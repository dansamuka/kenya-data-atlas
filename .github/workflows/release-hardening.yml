name: Release hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-release-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Prepare audit reports
        run: mkdir -p reports/p16

      - name: Cross-browser and WCAG journeys
        run: npm run p16:browser

      - name: Lighthouse performance and SEO budgets
        run: npm run p16:lighthouse

      - name: Deduplicated external-link audit
        run: npm run p16:links

      - name: Upload P16 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p16-release-audit-${{ github.sha }}
          path: |
            reports/p16
            test-results
          if-no-files-found: warn
          retention-days: 30
