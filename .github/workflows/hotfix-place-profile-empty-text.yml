name: Hotfix place-profile empty text values

on:
  push:
    paths:
      - '.github/workflows/hotfix-place-profile-empty-text.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kda-main-materialization
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch observation display fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/place-profile.js')
          s=p.read_text()
          old='pair.obs.text_value??pair.obs.value'
          new="(String(pair.obs.text_value??'').trim()!==''?pair.obs.text_value:pair.obs.value)"
          if s.count(old) != 1:
              raise SystemExit(f'expected one card fallback target, found {s.count(old)}')
          s=s.replace(old,new)
          old2="p?.obs?.text_value??p?.obs?.value??''"
          new2="(String(p?.obs?.text_value??'').trim()!==''?p.obs.text_value:(p?.obs?.value??''))"
          if s.count(old2) != 1:
              raise SystemExit(f'expected one CSV fallback target, found {s.count(old2)}')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Validate targeted regression
        run: |
          node --check assets/place-profile.js
          node - <<'NODE'
          const pick=o=>String(o.text_value??'').trim()!==''?o.text_value:o.value;
          const fmt=v=>Number(v).toLocaleString('en-KE',{minimumFractionDigits:0,maximumFractionDigits:0});
          if (fmt(pick({text_value:'',value:192.613248})) !== '193') throw new Error('blank text_value still masks numeric allocation');
          if (pick({text_value:'ODM',value:null}) !== 'ODM') throw new Error('categorical text regression');
          console.log('PLACE_PROFILE_EMPTY_TEXT_FALLBACK_OK');
          NODE
      - name: Commit hotfix
        run: |
          rm .github/workflows/hotfix-place-profile-empty-text.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/place-profile.js .github/workflows/hotfix-place-profile-empty-text.yml
          git commit -m 'fix(ui): preserve numeric values when text_value is blank'
          git pull --rebase origin main
          git push origin HEAD:main
