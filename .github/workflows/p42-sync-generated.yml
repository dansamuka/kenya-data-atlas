name: P42 sync generated outputs

on:
  push:
    branches: [p42-published-sae-probe]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p42-published-sae-probe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild published data
        run: npm run build:data
      - name: Commit deterministic build outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/geography/registry             data/geography/geometry             data/geography/reference             data/catalogue/registry             data/indicators/seed/derived/area-computed.json             data/indicators/registry             data/countyiq/county-summary.json             data/opportunities/opportunity-registry.json             data/completeness             data/distribution             data/release             data/ui/initial-pulse.json
          if git diff --cached --quiet; then
            echo "No gated generated outputs changed."
            exit 0
          fi
          git commit -m "P42: sync deterministic generated outputs"
          git push origin HEAD:p42-published-sae-probe
