name: Mobile CountyIQ fix materialization

on:
  push:
    branches:
      - fix-mobile-countyiq-density
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply mobile patch
        run: python scripts/mobile/apply-countyiq-mobile-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Validate repository
        run: npm test
      - name: Commit materialized fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mobile.css scripts/ui/validate-mobile.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(mobile): compact CountyIQ and restore fiscal table"
          git push origin HEAD:fix-mobile-countyiq-density
