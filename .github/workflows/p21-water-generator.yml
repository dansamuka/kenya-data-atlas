name: P21 water access generator

on:
  push:
    branches: [chatgpt/p21-water-access]
    paths:
      - '.github/workflows/p21-water-generator.yml'
      - 'scripts/p21/**'
      - 'scripts/p08/performance-index.mjs'
      - 'data/p21/source/**'

permissions:
  contents: write

concurrency:
  group: p21-water-access-generator
  cancel-in-progress: true

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p21-water-access
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check shapely
      - name: Apply all P21 preparation
        run: node scripts/p21/prepare-all.mjs
      - name: Rebuild all published Atlas products
        run: npm run build:data
      - name: Run full Atlas validation suite
        run: npm test
      - name: Run independent geometry audit
        run: npm run geography:audit
      - name: Commit water tranche and generated products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No P21 water changes produced.'
            exit 0
          fi
          git commit -m 'feat(p21): publish county improved water access'
          git push origin HEAD:chatgpt/p21-water-access
