name: P23 Form 34B source-row recovery

on:
  pull_request:
    paths:
      - .github/workflows/p23-form34b-source-row-recovery.yml
      - scripts/p23/probe-form34b-denominator-anchor-smoke.py
      - scripts/p23/validate-form34b-denominator-anchor-smoke.mjs
      - scripts/p23/aggregate-form34b-denominator-anchor-recovery.py
      - scripts/p23/validate-form34b-source-row-recovery.mjs
      - scripts/p23/render-form34b-pending-review-contexts.py
      - scripts/p23/validate-form34b-pending-review-contexts.mjs
      - scripts/p23/materialize-form34b-source-manifest.py
      - scripts/p23/validate-iebc-form34b-source-manifest.mjs
      - scripts/p23/validate-form34b-extraction-contract.mjs
      - data/p23/form34b-source-index-contract.json
      - data/p23/form34b-extraction-contract.json
      - data/p23/constituency-turnout-readiness-contract.json
      - data/p23/form34b-*-source-verification.json
      - data/indicators/registry/series.json
      - data/indicators/registry/observations.json
  push:
    branches: [main]
    paths:
      - .github/workflows/p23-form34b-source-row-recovery.yml
      - scripts/p23/probe-form34b-denominator-anchor-smoke.py
      - scripts/p23/validate-form34b-denominator-anchor-smoke.mjs
      - scripts/p23/aggregate-form34b-denominator-anchor-recovery.py
      - scripts/p23/validate-form34b-source-row-recovery.mjs
      - scripts/p23/render-form34b-pending-review-contexts.py
      - scripts/p23/validate-form34b-pending-review-contexts.mjs
      - scripts/p23/materialize-form34b-source-manifest.py
      - scripts/p23/validate-iebc-form34b-source-manifest.mjs
      - scripts/p23/validate-form34b-extraction-contract.mjs
      - data/p23/form34b-source-index-contract.json
      - data/p23/form34b-extraction-contract.json
      - data/p23/constituency-turnout-readiness-contract.json
      - data/p23/form34b-*-source-verification.json
      - data/indicators/registry/series.json
      - data/indicators/registry/observations.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p23-form34b-source-row-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governed-recovery-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate P23 source and extraction governance
        run: node scripts/p23/validate-form34b-extraction-contract.mjs
      - name: Materialize verified IEBC Form 34B locator manifest
        run: python3 scripts/p23/materialize-form34b-source-manifest.py --output /tmp/iebc-2022-form34b-source-manifest.json
      - name: Validate source-reference manifest boundary
        run: node scripts/p23/validate-iebc-form34b-source-manifest.mjs /tmp/iebc-2022-form34b-source-manifest.json
      - name: Upload governed source manifest
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-source-row-recovery-manifest
          path: /tmp/iebc-2022-form34b-source-manifest.json
          if-no-files-found: error
          retention-days: 3

  denominator-anchor-recovery:
    name: Source-row recovery ${{ matrix.range }}
    needs: governed-recovery-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - range: rows-001-025
            offset: 0
            limit: 25
          - range: rows-026-050
            offset: 25
            limit: 25
          - range: rows-051-075
            offset: 50
            limit: 25
          - range: rows-076-100
            offset: 75
            limit: 25
          - range: rows-101-125
            offset: 100
            limit: 25
          - range: rows-126-150
            offset: 125
            limit: 25
          - range: rows-151-175
            offset: 150
            limit: 25
          - range: rows-176-200
            offset: 175
            limit: 25
          - range: rows-201-225
            offset: 200
            limit: 25
          - range: rows-226-250
            offset: 225
            limit: 25
          - range: rows-251-275
            offset: 250
            limit: 25
          - range: rows-276-290
            offset: 275
            limit: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic PDF and OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-numpy
      - name: Download governed source manifest
        uses: actions/download-artifact@v4
        with:
          name: p23-form34b-source-row-recovery-manifest
          path: /tmp/p23-form34b-source-row-recovery-manifest
      - name: Run exact-denominator source-row locator for ${{ matrix.range }}
        run: >-
          python3 scripts/p23/probe-form34b-denominator-anchor-smoke.py
          --manifest /tmp/p23-form34b-source-row-recovery-manifest/iebc-2022-form34b-source-manifest.json
          --offset ${{ matrix.offset }}
          --limit ${{ matrix.limit }}
          --output /tmp/p23-form34b-denominator-${{ matrix.range }}.json
          --context-dir /tmp/p23-form34b-denominator-${{ matrix.range }}-contexts
      - name: Validate no-promotion denominator-locator boundary
        run: node scripts/p23/validate-form34b-denominator-anchor-smoke.mjs /tmp/p23-form34b-denominator-${{ matrix.range }}.json
      - name: Upload source-row recovery shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-source-row-recovery-${{ matrix.range }}
          path: |
            /tmp/p23-form34b-denominator-${{ matrix.range }}.json
            /tmp/p23-form34b-denominator-${{ matrix.range }}-contexts/*.png
          if-no-files-found: error
          retention-days: 7

  aggregate-source-row-recovery:
    name: Aggregate 290-row source-row recovery
    needs: denominator-anchor-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download all recovery shards
        uses: actions/download-artifact@v4
        with:
          pattern: p23-form34b-source-row-recovery-rows-*
          path: /tmp/p23-form34b-source-row-recovery
          merge-multiple: true
      - name: Aggregate governed recovery audit and visual-review queue
        run: >-
          python3 scripts/p23/aggregate-form34b-denominator-anchor-recovery.py
          --input-dir /tmp/p23-form34b-source-row-recovery
          --audit-output /tmp/p23-form34b-source-row-recovery-audit.json
          --queue-output /tmp/p23-form34b-source-row-recovery-queue.json
      - name: Validate recovery audit and review boundary
        run: node scripts/p23/validate-form34b-source-row-recovery.mjs /tmp/p23-form34b-source-row-recovery-audit.json /tmp/p23-form34b-source-row-recovery-queue.json
      - name: Upload governed source-row recovery packet
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-source-row-recovery-audit-and-review-queue
          path: |
            /tmp/p23-form34b-source-row-recovery-audit.json
            /tmp/p23-form34b-source-row-recovery-queue.json
            /tmp/p23-form34b-source-row-recovery/*.png
          if-no-files-found: error
          retention-days: 7

  render-pending-source-review-contexts:
    name: Render wider pending source-review contexts
    needs: aggregate-source-row-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils python3-numpy
      - name: Download governed current recovery queue
        uses: actions/download-artifact@v4
        with:
          name: p23-form34b-source-row-recovery-audit-and-review-queue
          path: /tmp/p23-form34b-current-recovery
      - name: Render full-page and wider contexts for the exact pending queue
        run: >-
          python3 scripts/p23/render-form34b-pending-review-contexts.py
          --queue /tmp/p23-form34b-current-recovery/p23-form34b-source-row-recovery-queue.json
          --output /tmp/p23-form34b-pending-review-contexts.json
          --context-dir /tmp/p23-form34b-pending-review-contexts
      - name: Validate review-only rendering boundary and exact image digests
        run: >-
          node scripts/p23/validate-form34b-pending-review-contexts.mjs
          /tmp/p23-form34b-pending-review-contexts.json
          /tmp/p23-form34b-current-recovery/p23-form34b-source-row-recovery-queue.json
          /tmp/p23-form34b-pending-review-contexts
      - name: Upload wider governed source-review packet
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-pending-source-review-contexts
          path: |
            /tmp/p23-form34b-pending-review-contexts.json
            /tmp/p23-form34b-pending-review-contexts/*.png
          if-no-files-found: error
          retention-days: 7
