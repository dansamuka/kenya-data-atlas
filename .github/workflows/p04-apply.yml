name: P04 apply social outcomes

on:
  push:
    paths:
      - '.github/workflows/p04-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p04-health-living-standards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply P04 source package
        run: node scripts/p04/apply-social-outcomes.mjs
      - name: Rebuild all published products
        run: npm run build:data
      - name: P04 release validator
        run: npm run countyiq:p04:validate
      - name: Full repository tests
        run: npm test
      - name: Commit deterministic P04 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'P04: activate county health and living standards'
          git push origin HEAD:p04-health-living-standards
