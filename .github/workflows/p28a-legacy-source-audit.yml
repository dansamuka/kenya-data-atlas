name: P28A legacy source audit

on:
  pull_request:
    paths:
      - 'scripts/p28/**'
      - 'data/legacy-secondary-source-audit-contract.json'
      - 'data/local-54-source-governance-contract.json'
      - 'data/local-54-completion-execution.json'
      - 'data/policy/local-54-indicator-contract.json'
      - 'data/completeness/local-54-indicator-manifest.json'
      - 'data/completeness/slot-ledger.json'
      - 'data/indicators/registry/**'
      - 'data/catalogue/registry/**'
      - 'data/geography/registry/geographies.json'
      - 'data/audit/legacy-*'
      - '.github/workflows/p28a-legacy-source-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/p28/**'
      - 'data/legacy-secondary-source-audit-contract.json'
      - 'data/local-54-source-governance-contract.json'
      - 'data/local-54-completion-execution.json'
      - 'data/policy/local-54-indicator-contract.json'
      - 'data/completeness/local-54-indicator-manifest.json'
      - 'data/completeness/slot-ledger.json'
      - 'data/indicators/registry/**'
      - 'data/catalogue/registry/**'
      - 'data/geography/registry/geographies.json'
      - 'data/audit/legacy-*'

permissions:
  contents: write

jobs:
  legacy-source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build deterministic P28A audit outputs
        run: node scripts/p28/build-legacy-source-audit.mjs
      - name: Validate P28A audit coverage and tiers
        run: node scripts/p28/validate-legacy-source-audit.mjs
      - name: Enforce zero drift once baseline is versioned
        run: |
          if git ls-files --error-unmatch data/audit/legacy-source-tier-summary.json >/dev/null 2>&1; then
            git diff --exit-code -- data/audit/legacy-*
          else
            echo 'P28A baseline outputs are not versioned yet; bootstrap commit is permitted on this run.'
          fi
      - name: Bootstrap generated audit outputs onto this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add data/audit/legacy-*
          if git diff --cached --quiet; then
            echo 'P28A generated outputs already match the committed baseline.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'P28A: materialize deterministic legacy audit outputs'
          git push origin HEAD:${{ github.head_ref }}
          node scripts/p28/build-legacy-source-audit.mjs
          git diff --exit-code -- data/audit/legacy-*
      - name: Show P28A summary
        run: cat data/audit/legacy-source-tier-summary.json
      - name: Upload P28A generated audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: p28a-legacy-source-audit
          path: |
            data/audit/legacy-source-tier-audit.json
            data/audit/legacy-source-tier-audit.csv
            data/audit/legacy-representation-opportunities.json
            data/audit/legacy-conflicts.json
            data/audit/legacy-source-tier-summary.json
          if-no-files-found: error
