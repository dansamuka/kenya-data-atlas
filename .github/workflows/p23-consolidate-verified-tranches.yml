name: P23 consolidate verified turnout tranches

on:
  push:
    branches:
      - watchdog/p23-consolidate-verified-tranches

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: watchdog/p23-consolidate-verified-tranches

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Fetch completed P23 tranche branches
        shell: bash
        run: |
          set -euo pipefail
          for br in \
            p23-turnout-tranche-a \
            p23-turnout-tranche-d \
            p23-turnout-tranche-c-v2 \
            p23-turnout-tranche-e \
            p23-turnout-tranche-f \
            p23-turnout-tranche-b; do
            git fetch --no-tags origin "$br:refs/remotes/origin/$br"
          done

      - name: Import only governed verified and promotion-eligible evidence
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/p23-seen-codes.txt
          : > /tmp/p23-imported.txt
          : > /tmp/p23-rejected.txt

          node <<'NODE' > /tmp/p23-seen-codes.txt
          const fs = require('fs');
          for (const name of fs.readdirSync('data/p23').filter(n => /^form34b-.+-source-verification\.json$/.test(n))) {
            try {
              const e = JSON.parse(fs.readFileSync(`data/p23/${name}`, 'utf8'));
              const c = Number(e?.sample?.constituency_code);
              if (Number.isInteger(c)) console.log(c);
            } catch {}
          }
          NODE
          sort -nu -o /tmp/p23-seen-codes.txt /tmp/p23-seen-codes.txt

          structurally_governed() {
            node - "$1" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          let e;
          try { e = JSON.parse(fs.readFileSync(p, 'utf8')); } catch { process.exit(1); }
          const hex64 = v => typeof v === 'string' && /^[0-9a-f]{64}$/.test(v);
          const hex40 = v => typeof v === 'string' && /^[0-9a-f]{40}$/.test(v);
          const s = e.sample || {};
          const r = e.review || {};
          if (e.schema_version !== 'kda.p23.form34b-source-verification.v1') process.exit(1);
          if (e.verification_state !== 'verified' || e.promotion_eligible !== true || e.promotion_authorized_by_this_file !== false) process.exit(1);
          if (!Number.isInteger(Number(s.constituency_code)) || Number(s.constituency_code) < 1 || Number(s.constituency_code) > 290) process.exit(1);
          if (!String(s.source_url || '').startsWith('https://forms.iebc.or.ke/')) process.exit(1);
          if (!hex64(s.source_pdf_sha256) || !Number.isInteger(s.page_number) || s.page_number < 1) process.exit(1);
          if (s.render_dpi !== 250 || !hex64(s.review_context_image_sha256)) process.exit(1);
          if (r.reviewer_class !== 'independent_visual_source_image_review' || !r.reviewed_by || r.source_image_legibility !== 'clear' || r.total_row_label_visually_confirmed !== true) process.exit(1);
          const vals = {};
          let visualOnly = false;
          for (const f of ['registered_voters','total_valid_votes','rejected_ballots']) {
            const x = e.field_evidence?.[f];
            if (!x || x.verification_state !== 'source_verified' || x.verification_method !== 'direct_visual_read_of_official_form34b_total_row') process.exit(1);
            if (Number(x.page_number) !== Number(s.page_number) || !hex64(x.source_image_sha256) || x.source_image_sha256 !== s.review_context_image_sha256) process.exit(1);
            if (!Number.isInteger(x.verified_value) || x.verified_value < 0) process.exit(1);
            vals[f] = x.verified_value;
            if (Number.isInteger(x.machine_transcription)) {
              if (x.machine_transcription !== x.verified_value) process.exit(1);
              if (x.machine_verification_state !== undefined && x.machine_verification_state !== 'machine_candidate') process.exit(1);
              if (x.machine_decision !== undefined && x.machine_decision !== 'threshold_consensus') process.exit(1);
            } else {
              visualOnly = true;
              if (x.machine_transcription !== null || x.visual_transcription_required !== true) process.exit(1);
              if (e.source_row_recovery_context) {
                if (x.machine_verification_state !== 'not_extracted_by_recovery_locator' || x.machine_decision !== 'visual_source_transcription_required') process.exit(1);
              } else {
                if (x.machine_verification_state !== 'source_unreadable' || x.machine_decision !== 'no_threshold_consensus') process.exit(1);
              }
            }
          }
          if (visualOnly) {
            const q = e.source_row_recovery_context;
            if (q) {
              if (q.schema_version !== 'kda.p23.form34b.source-row-recovery-context.v1' || !Number.isInteger(q.workflow_run_id) || q.workflow_run_id <= 0 || !hex40(q.workflow_head_sha) || !Number.isInteger(q.aggregate_artifact_id) || q.aggregate_artifact_id <= 0 || !hex64(q.aggregate_artifact_sha256) || !hex64(q.review_context_sha256) || q.review_context_sha256 !== s.review_context_image_sha256 || q.anchor_state !== 'unique_exact_denominator_anchor' || q.denominator_anchor_is_locator_only !== true || q.source_verified_values_at_recovery !== 0 || q.promotion_authorized_at_recovery !== false) process.exit(1);
            } else {
              const q2 = e.machine_review_context || {};
              if (q2.schema_version !== 'kda.p23.form34b.machine-review-contexts.v1' || !Number.isInteger(q2.workflow_run_id) || q2.workflow_run_id <= 0 || !hex40(q2.workflow_head_sha) || !hex64(q2.manifest_sha256) || !hex64(q2.review_context_sha256) || q2.review_context_sha256 !== s.review_context_image_sha256) process.exit(1);
            }
          }
          const votes = e.same_row_valid_vote_reconciliation?.candidate_vote_totals_in_source_column_order || [];
          if (votes.length !== 4 || !votes.every(Number.isInteger) || votes.reduce((a,b)=>a+b,0) !== vals.total_valid_votes) process.exit(1);
          if (vals.registered_voters <= 0 || vals.total_valid_votes + vals.rejected_ballots > vals.registered_voters) process.exit(1);
          process.exit(0);
          NODE
          }

          branches=(
            p23-turnout-tranche-a
            p23-turnout-tranche-d
            p23-turnout-tranche-c-v2
            p23-turnout-tranche-e
            p23-turnout-tranche-f
            p23-turnout-tranche-b
          )

          for br in "${branches[@]}"; do
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              # Existing canonical evidence always wins; do not overwrite it.
              [[ -e "$f" ]] && continue
              git show "origin/$br:$f" > /tmp/p23-candidate.json
              code="$(node -e "const e=require('/tmp/p23-candidate.json'); process.stdout.write(String(Number(e?.sample?.constituency_code)||''))")"
              [[ -n "$code" ]] || { echo "$br $f invalid_code" >> /tmp/p23-rejected.txt; continue; }

              # Explicit human-review holds: Molo has a 220/720 rejected-ballot conflict;
              # Kajiado East's blank rejected-ballot cell must not be promoted as inferred zero.
              if [[ "$code" == "166" || "$code" == "185" ]]; then
                echo "$br $f explicit_hold" >> /tmp/p23-rejected.txt
                continue
              fi
              grep -qx "$code" /tmp/p23-seen-codes.txt && continue

              if structurally_governed /tmp/p23-candidate.json; then
                cp /tmp/p23-candidate.json "$f"
                echo "$code" >> /tmp/p23-seen-codes.txt
                sort -nu -o /tmp/p23-seen-codes.txt /tmp/p23-seen-codes.txt
                echo "$br $code $f" >> /tmp/p23-imported.txt
              else
                echo "$br $f structural_governance_reject" >> /tmp/p23-rejected.txt
              fi
            done < <(git ls-tree -r --name-only "origin/$br" -- data/p23 | grep -E '^data/p23/form34b-.+-source-verification\.json$' || true)
          done

          echo '=== imported ==='
          cat /tmp/p23-imported.txt || true
          echo '=== rejected/held ==='
          cat /tmp/p23-rejected.txt || true
          echo "imported_count=$(wc -l < /tmp/p23-imported.txt)"

      - name: Deterministically rebuild canonical Atlas data
        run: npm run build:data

      - name: Refresh P23 promotion contract to the consolidated materialized set
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/p23/form34b-turnout-promotion-contract.json';
          const c = JSON.parse(fs.readFileSync(path, 'utf8'));
          const evidenceNames = fs.readdirSync('data/p23').filter(n => /^form34b-.+-source-verification\.json$/.test(n)).sort();
          const rows = evidenceNames.map(n => JSON.parse(fs.readFileSync(`data/p23/${n}`, 'utf8')))
            .filter(e => e.verification_state === 'verified' && e.promotion_eligible === true)
            .sort((a,b) => Number(a.sample.constituency_code)-Number(b.sample.constituency_code));
          const summary = JSON.parse(fs.readFileSync('data/completeness/summary.json','utf8'));
          const imported = fs.existsSync('/tmp/p23-imported.txt') ? fs.readFileSync('/tmp/p23-imported.txt','utf8').trim().split(/\n/).filter(Boolean) : [];
          const importedCodes = imported.map(x => Number(x.split(/\s+/)[1])).filter(Number.isInteger).sort((a,b)=>a-b);
          c.contract_id = 'P23-IEBC-2022-FORM34B-TURNOUT-PROMOTION-2026-09-10-CONSOLIDATED';
          c.as_of = '2026-09-10';
          c.current_tranche = c.current_tranche || {};
          c.current_tranche.verified_constituencies = rows.length;
          c.current_tranche.verified_geo_codes = rows.map(e => e.sample.geo_code);
          c.current_tranche.verified_constituency_codes = rows.map(e => Number(e.sample.constituency_code));
          c.current_tranche.newly_authorized_constituency_codes = importedCodes;
          c.current_tranche.expected_p23_remaining_after_materialization = 290 - rows.length;
          c.current_tranche.expected_resolved_slots_after_materialization = summary.resolved_slots;
          c.current_tranche.governed_total_slots = summary.total_slots;
          c.current_tranche.materialization_state = 'explicit_materialization_authorized';
          c.current_tranche.materialization_checks = ['canonical_rebuild','exact_completeness_delta','full_validation_suite','independent_geography_audit'];
          c.current_tranche.materialization_note = `Consolidated from completed P23 turnout tranche branches onto current main. Imported ${importedCodes.length} unique governed source-verification records after structural provenance screening. Existing canonical evidence won all duplicates. Molo (166) remains excluded pending independent resolution of the 220-versus-720 rejected-ballot discrepancy, and Kajiado East (185) remains excluded because a blank rejected-ballot cell is not treated as a directly source-verified zero. No stale generated registry from a tranche branch was imported.`;
          fs.writeFileSync(path, JSON.stringify(c,null,2)+'\n');
          console.log(`P23_CONSOLIDATED_PROMOTION_CONTRACT verified=${rows.length} imported=${importedCodes.length} remaining=${290-rows.length} resolved=${summary.resolved_slots}`);
          NODE

      - name: Enforce P23 source-verification and completion governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/p23/validate-form34b-source-verifications.mjs
          npm run p23:validate
          npm run completeness:validate
          node - <<'NODE'
          const s=require('./data/completeness/summary.json');
          if (s.total_slots !== 20115) throw new Error(`governed denominator changed: ${s.total_slots}`);
          if (s.unknown_missing !== 0) throw new Error(`unknown_missing=${s.unknown_missing}`);
          if ((s.by_completion_phase?.P24 || 0) !== 0) throw new Error(`P24 regressed: ${s.by_completion_phase?.P24}`);
          console.log(`CONSOLIDATED_LEDGER_OK resolved=${s.resolved_slots} unresolved=${s.unresolved_slots} pct=${s.resolved_pct} p23=${s.by_completion_phase?.P23||0} p24=${s.by_completion_phase?.P24||0} p25=${s.by_completion_phase?.P25||0}`);
          NODE

      - name: Run full Atlas validation suite
        run: npm test

      - name: Commit governed source evidence and deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p23-consolidate-verified-tranches.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No consolidation delta produced.'
            exit 1
          fi
          git commit -m 'P23: consolidate governed source-verified turnout tranches'
          git push origin HEAD:watchdog/p23-consolidate-verified-tranches
