name: P23 constituency voter materialization

on:
  push:
    branches:
      - watchdog/p23-materialization-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          pip install shapely
      - name: Wire P23 builder into canonical rebuild
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          const cat = 'node scripts/p23/build-constituency-voters.mjs catalogue';
          const ind = 'node scripts/p23/build-constituency-voters.mjs indicators';
          if (!p.scripts['catalogue:build'].includes(cat)) p.scripts['catalogue:build'] += ` && ${cat}`;
          if (!p.scripts['indicators:build'].includes(ind)) {
            const marker = 'node scripts/indicators/apply-worldbank-registry-metadata.mjs';
            if (!p.scripts['indicators:build'].includes(marker)) throw new Error('World Bank metadata marker missing from indicators:build');
            p.scripts['indicators:build'] = p.scripts['indicators:build'].replace(marker, `${ind} && ${marker}`);
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Rebuild published data
        run: npm run build:data
      - name: Assert P23 voter tranche
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summary = JSON.parse(fs.readFileSync('data/completeness/summary.json','utf8'));
          const series = JSON.parse(fs.readFileSync('data/indicators/registry/series.json','utf8'));
          const observations = JSON.parse(fs.readFileSync('data/indicators/registry/observations.json','utf8'));
          if (summary.total_slots !== 20115) throw new Error(`denominator drift: ${summary.total_slots}`);
          if (summary.unknown_missing !== 0) throw new Error(`unknown_missing=${summary.unknown_missing}`);
          if (summary.resolved_slots !== 4744) throw new Error(`expected 4744 resolved slots after voter promotion, got ${summary.resolved_slots}`);
          if (summary.by_completion_phase?.P23 !== 2320) throw new Error(`expected P23 remaining 2320 after 870 governed slot instances resolve, got ${summary.by_completion_phase?.P23}`);
          const voterSeries = series.filter(s => /^KDA-VOTERS-CON-\d{3}-2022$/.test(s.series_code));
          if (voterSeries.length !== 290) throw new Error(`expected 290 constituency voter series, got ${voterSeries.length}`);
          const ids = new Set(voterSeries.map(s => s.series_id));
          const voterObs = observations.filter(o => ids.has(o.series_id));
          if (voterObs.length !== 290) throw new Error(`expected 290 constituency voter observations, got ${voterObs.length}`);
          if (voterObs.reduce((sum,o)=>sum+Number(o.value),0) !== 22102532) throw new Error('national voter total changed');
          console.log('P23 voter promotion assertions passed: 290 observations; 870 governed slot instances resolved; P23 remaining 2320; denominator 20115.');
          NODE
      - name: Capture remaining P23 taxonomy
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ledger = JSON.parse(fs.readFileSync('data/completeness/slot-ledger.json','utf8'));
          const rows = (ledger.rows || []).filter(r => r.resolved !== true && r.completion_phase === 'P23');
          const groups = new Map();
          for (const row of rows) {
            const key = [row.indicator_code || '', row.level || '', row.tab || '', row.status || ''].join('|');
            if (!groups.has(key)) groups.set(key, {indicator_code: row.indicator_code || '', level: row.level || '', tab: row.tab || '', status: row.status || '', count: 0, geo_codes: new Set(), sample: row});
            const g = groups.get(key);
            g.count += 1;
            if (row.geo_code) g.geo_codes.add(row.geo_code);
          }
          const compact = [...groups.values()].map(g => ({...g, geo_count: g.geo_codes.size, geo_codes: undefined})).sort((a,b) => b.count-a.count || a.indicator_code.localeCompare(b.indicator_code));
          const out = {schema_version:'kda.p23.remaining-breakdown.v1', generated_from:'post-voter-materialization', remaining_slots: rows.length, group_count: compact.length, groups: compact};
          fs.mkdirSync('data/p23',{recursive:true});
          fs.writeFileSync('data/p23/remaining-breakdown.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify({remaining_slots:out.remaining_slots, group_count:out.group_count, groups:compact.map(({sample,...g})=>g)}, null, 2));
          NODE
      - name: Run full validation
        run: |
          set -o pipefail
          npm test 2>&1 | tee p23-test.log
      - name: Persist validation diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p23-test.log data/p23/remaining-breakdown.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(p23): capture materialization validation diagnostics"
          git push origin HEAD:watchdog/p23-materialization-repair
      - name: Run independent geography audit
        run: npm run geography:audit
      - name: Commit validated materialization and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p23-constituency-materialize.yml
          git add package.json data assets index.html scripts/p22/validate-terminal.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat(p23): materialize constituency voter promotion"
          git push origin HEAD:watchdog/p23-materialization-repair
