name: P21 vehicle ownership materialization

on:
  push:
    branches:
      - p21-vehicle-ownership-replacement
    paths:
      - .github/workflows/p21-vehicle-ownership-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply governed replacement decision
        run: node scripts/p21/prepare-vehicle-ownership-replacement.mjs
      - name: Rebuild all governed data products
        run: npm run build:data
      - name: Validate full repository
        run: npm test
      - name: Validate completion targets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const s=j('data/completeness/summary.json'),q=j('data/completeness/p21-work-queue.json');
          const fail=m=>{throw new Error(m)};
          if(s.total_slots!==20115)fail(`total_slots=${s.total_slots}`);
          if(s.resolved_slots!==3761)fail(`resolved_slots=${s.resolved_slots}`);
          if(s.unresolved_slots!==16354)fail(`unresolved_slots=${s.unresolved_slots}`);
          if(s.unknown_missing!==0)fail(`unknown_missing=${s.unknown_missing}`);
          if(s.by_completion_phase?.P21!==47)fail(`P21=${s.by_completion_phase?.P21}`);
          if(s.by_status?.retired_replaced!==329)fail(`retired_replaced=${s.by_status?.retired_replaced}`);
          const expected={'IND-ROAD-NETWORK-LENGTH':47};
          if(q.remaining_slots!==47||q.family_count!==1)fail(`queue slots=${q.remaining_slots} families=${q.family_count}`);
          if(JSON.stringify(q.family_counts)!==JSON.stringify(expected))fail(`queue families=${JSON.stringify(q.family_counts)}`);
          console.log('P21_VEHICLE_OWNERSHIP_TARGET_OK resolved=3761 unresolved=16354 p21=47 families=1');
          NODE
      - name: Commit governed outputs and remove one-shot workflow
        run: |
          rm .github/workflows/p21-vehicle-ownership-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'P21: replace vehicle registrations with census ownership'
            git push
          fi
