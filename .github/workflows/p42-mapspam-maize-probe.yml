name: P42 MAPSPAM maize source probe

on:
  push:
    branches:
      - p42-mapspam-maize-probe
    paths:
      - .github/workflows/p42-mapspam-maize-probe.yml
      - scripts/p42/probe_mapspam_maize.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p42-mapspam-maize-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cloud-array dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "xarray==2026.6.0" "zarr<3" "fsspec" "s3fs" "numpy"
      - name: Probe MAPSPAM maize cube
        run: python scripts/p42/probe_mapspam_maize.py
      - name: Commit sanitized source profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/p42/mapspam-maize-source-probe.json
          git commit -m "P42: record MAPSPAM maize source profile"
          git push origin HEAD:p42-mapspam-maize-probe
