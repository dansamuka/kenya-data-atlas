name: P18-P22 public surface validation

on:
  push:
    branches:
      - p22-public-surface-mapping
    paths:
      - .github/workflows/p18-p22-public-surface-materialize.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate public surface contract
        run: npm run ui:validate
      - name: Validate full repository
        run: npm test
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/p18-p22-public-surface-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove P18-P22 public surface validator'
            git push
          fi
