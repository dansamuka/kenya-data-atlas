name: P15 data distribution release

on:
  push:
    branches:
      - p15-data-distribution-20260830

permissions:
  contents: write

jobs:
  build-validate-finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p15-data-distribution-20260830
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply P15 release migration
        run: node scripts/distribution/apply-p15-release.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Install independent geometry audit dependency
        run: pip install shapely

      - name: Build all canonical and distribution products
        run: npm run build:data

      - name: Capture deterministic candidate
        run: |
          git add -A
          git diff --cached --binary > /tmp/p15-first.patch

      - name: Rebuild and prove deterministic output
        run: |
          npm run build:data
          git add -A
          git diff --cached --binary > /tmp/p15-second.patch
          diff -u /tmp/p15-first.patch /tmp/p15-second.patch

      - name: Validate complete Atlas
        run: npm test

      - name: Independent geometry audit
        run: npm run geography:audit

      - name: Final P15 distribution validation
        run: npm run distribution:validate

      - name: Remove one-shot release tooling
        run: |
          rm -f scripts/distribution/apply-p15-release.mjs
          rm -f .github/workflows/p15-data-distribution.yml
          git diff --check

      - name: Commit validated P15 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P15: publish data distribution and developer surface" || exit 0
          git push origin HEAD:p15-data-distribution-20260830
