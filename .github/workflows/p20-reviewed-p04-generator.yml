name: P20 remaining queue diagnostic

on:
  push:
    branches: [p20-reviewed-p04-county-promotion]
    paths:
      - '.github/workflows/p20-reviewed-p04-generator.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p20-reviewed-p04-county-promotion
      - name: Print governed P20 queue by indicator
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ledger=JSON.parse(fs.readFileSync('data/completeness/slot-ledger.json','utf8'));
          const rows=ledger.rows.filter(r=>r.completion_phase==='P20' && r.resolved===false);
          const grouped=new Map();
          for(const r of rows){
            const g=grouped.get(r.indicator_code)||{indicator_code:r.indicator_code,indicator_name:r.indicator_name,status:r.status,tab:r.tab,count:0,source:r.source,source_url:r.source_url,examples:[]};
            g.count++;
            if(g.examples.length<3)g.examples.push(r.geo_code);
            grouped.set(r.indicator_code,g);
          }
          console.log(`P20_QUEUE_TOTAL ${rows.length}`);
          for(const g of [...grouped.values()].sort((a,b)=>b.count-a.count||a.indicator_code.localeCompare(b.indicator_code))){
            console.log(JSON.stringify(g));
          }
          NODE
