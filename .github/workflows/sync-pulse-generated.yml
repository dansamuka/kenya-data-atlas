name: Sync Pulse generated artifact

on:
  push:
    branches: [pulse-history-backfill]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - name: Commit generated Pulse product
        run: |
          if git diff --quiet -- data/ui/initial-pulse.json; then
            echo 'Pulse product already in sync.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ui/initial-pulse.json
          git commit -m 'Sync generated Pulse history product'
          git push origin HEAD:pulse-history-backfill
