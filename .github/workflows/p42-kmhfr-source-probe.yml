name: P42 KMHFR source probe

on:
  push:
    branches:
      - p42-kmhfr-source-probe
    paths:
      - .github/workflows/p42-kmhfr-source-probe.yml
      - scripts/p42/probe_kmhfr.py

permissions:
  contents: write

concurrency:
  group: p42-kmhfr-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p42-kmhfr-source-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official KMHFR public API over IPv4 with retries
        shell: bash
        run: |
          set -euo pipefail
          curl -4 --fail --location --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 120 \
            --header 'Accept: application/json' \
            --user-agent 'Kenya-Data-Atlas-P42/1.0' \
            'https://api.kmhfr.health.go.ke/api/public/facilities/?page_size=100&page=1' \
            -o /tmp/kmhfr.json
          test -s /tmp/kmhfr.json
      - name: Profile official KMHFR public API payload
        env:
          KMHFR_PROBE_FILE: /tmp/kmhfr.json
        run: python scripts/p42/probe_kmhfr.py
      - name: Commit sanitized source profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/p42/kmhfr-source-probe.json
          if git diff --cached --quiet; then
            echo "No probe change."
          else
            git commit -m "P42: record KMHFR public API source profile"
            git push origin HEAD:p42-kmhfr-source-probe
          fi
