name: Generated native registries and CountyIQ mart

on:
  push:
    branches: [main, p20-county-sourced-promotion]
    paths:
      - '.github/workflows/placeholder-taxonomy.yml'
      - 'data/indicators/seed/placeholder-taxonomy.json'
      - 'data/geography/reference/geography-subsets.json'
      - 'data/geography/registry/geographies.json'
      - 'data/catalogue/registry/**'
      - 'data/indicators/registry/**'
      - 'data/opportunities/programmes.seed.json'
      - 'data/p05/source/connectivity-housing-survey-2023-24.csv'
      - 'data/p05/source/manifest.json'
      - 'data/countyiq/source/p10-fiscal-accountability-2024-25.json'
      - 'scripts/indicators/apply-placeholder-taxonomy.mjs'
      - 'scripts/indicators/validate-placeholder-taxonomy.mjs'
      - 'scripts/indicators/validate-native-api.mjs'
      - 'scripts/countyiq/build-mart.mjs'
      - 'scripts/countyiq/validate-mart.mjs'
      - 'scripts/completeness/**'
      - 'scripts/p14/**'
      - 'scripts/p20/**'
      - 'assets/countyiq-view.js'
      - 'assets/opportunity-finder.js'
      - 'assets/opportunity-finder.css'
      - 'assets/lazy-integrations.js'
      - 'assets/place-profile.js'
      - 'assets/place-profile.css'
      - 'db/schema/indicators.sql'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check lifecycle profile frontend
        run: |
          node --check assets/place-profile.js
          node --check assets/ux-polish.js
          node --check assets/unit-system.js
          node --check assets/countyiq-view.js
          node --check assets/opportunity-finder.js
      - name: Build canonical catalogue
        run: npm run catalogue:build
      - name: Build native indicators with lifecycle taxonomy
        run: npm run indicators:build
      - name: Build canonical CountyIQ analytical mart
        run: npm run countyiq:build
      - name: Build P14 opportunity registry
        run: npm run opportunities:build
      - name: Build P18 completeness ledger
        run: npm run completeness:build
      - name: Validate full Atlas registry, CountyIQ mart, P14 Beta and P18/P20 ledger
        run: npm test
      - name: Confirm P14 completion ledger is immutable
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const roadmap = JSON.parse(fs.readFileSync('data/project-roadmap.json', 'utf8'));
          const p14 = roadmap.phases.find(phase => phase.id === 'P14');
          if (!p14 || p14.status !== 'complete') {
            throw new Error(`P14 must remain complete; got ${p14?.status || 'missing'}`);
          }
          console.log('P14_COMPLETION_LEDGER_IMMUTABLE_OK');
          NODE
      - name: Commit generated products when they change
        run: |
          if [[ -z "$(git status --porcelain -- data/catalogue/registry data/indicators/registry data/countyiq/county-summary.json data/opportunities/opportunity-registry.json data/completeness)" ]]; then
            echo "No generated catalogue, registry, CountyIQ mart, P14 opportunity or completeness changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue/registry data/indicators/registry data/countyiq/county-summary.json data/opportunities/opportunity-registry.json data/completeness
          git commit -m "build: refresh generated registries and completeness ledger"
          git push
