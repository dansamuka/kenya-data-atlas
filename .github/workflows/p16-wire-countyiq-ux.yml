name: P16 wire CountyIQ UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p16-wire-countyiq-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire CountyIQ UX into lazy route loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/lazy-integrations.js')
          s = p.read_text()
          old_styles = "styles([['assets/countyiq-view.css','kda-countyiq-css'],['assets/p05-breadth.css','kda-p05-breadth-css']]),"
          new_styles = "styles([['assets/countyiq-view.css','kda-countyiq-css'],['assets/p05-breadth.css','kda-p05-breadth-css'],['assets/countyiq-ux.css','kda-countyiq-ux-css']]),"
          if old_styles not in s:
              raise SystemExit('CountyIQ style loader contract not found')
          s = s.replace(old_styles, new_styles, 1)
          old_chain = ".then(()=>window.KDACountyIQ?.boot?.()||null)\n      .then(()=>Promise.allSettled([loadEvidenceHub(),loadOpportunityFinder(),loadPublicCleanup(),loadCompletionSurface()]))"
          new_chain = ".then(()=>window.KDACountyIQ?.boot?.()||null)\n      .then(()=>KDA.loadScript('assets/countyiq-ux.js',{id:'kda-countyiq-ux'}))\n      .then(()=>window.KDACountyIQUX?.boot?.()||null)\n      .then(()=>Promise.allSettled([loadEvidenceHub(),loadOpportunityFinder(),loadPublicCleanup(),loadCompletionSurface()]))"
          if old_chain not in s:
              raise SystemExit('CountyIQ script loader contract not found')
          s = s.replace(old_chain, new_chain, 1)
          p.write_text(s)
          PY
          rm .github/workflows/p16-wire-countyiq-ux.yml
      - name: Verify loader wiring
        run: |
          grep -q "countyiq-ux.css" assets/lazy-integrations.js
          grep -q "countyiq-ux.js" assets/lazy-integrations.js
          grep -q "KDACountyIQUX" assets/lazy-integrations.js
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lazy-integrations.js .github/workflows/p16-wire-countyiq-ux.yml
          git commit -m "fix(p16): load CountyIQ UX with CountyIQ route"
          git push origin main
