name: P17 refresh release county summary

on:
  push:
    branches: [fix-p17-release-gate-dispatch]
    paths:
      - '.github/workflows/p17-refresh-county-summary.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-p17-release-gate-dispatch
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate CountyIQ release summary
        run: node scripts/countyiq/build-mart.mjs

      - name: Commit deterministic release output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/countyiq/county-summary.json
          if git diff --cached --quiet; then
            echo 'P17_COUNTY_SUMMARY_ALREADY_CLEAN'
            exit 0
          fi
          git commit -m 'build(p17): refresh v1.0 CountyIQ summary'
          git push origin HEAD:fix-p17-release-gate-dispatch
          echo 'P17_COUNTY_SUMMARY_REFRESH_OK'
