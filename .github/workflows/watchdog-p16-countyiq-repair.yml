name: Watchdog P16 CountyIQ repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/watchdog-p16-countyiq-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard expected stalled head
        run: test "$(git rev-parse HEAD^)" = "d59562fe09d82287c7e0e338c9a4bb6daecedab0"
      - name: Patch CountyIQ UX to load in parallel with data boot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/lazy-integrations.js')
          s = p.read_text()
          start = s.index('  function loadCountyIQ(){')
          end = s.index('\n\n  const routeNeedsOptional', start)
          current = s[start:end]
          if "KDA.loadScript('assets/countyiq-ux.js'" not in current:
              raise SystemExit('Current CountyIQ UX loader contract not found; refusing unsafe patch')
          new = '\n'.join([
              '  function loadCountyIQUX(){',
              '    if(window.KDACountyIQUX){window.KDACountyIQUX.boot?.();return Promise.resolve(window.KDACountyIQUX);}',
              "    return Promise.all([",
              "      KDA.loadStyle('assets/countyiq-ux.css',{id:'kda-countyiq-ux-css'}),",
              "      KDA.loadScript('assets/countyiq-ux.js',{id:'kda-countyiq-ux'})",
              "    ]).then(()=>{window.KDACountyIQUX?.boot?.();return window.KDACountyIQUX||null;});",
              '  }',
              '  function loadCountyIQ(){',
              '    installCountyIQDataGuard();',
              '    if(window.KDACountyIQ)return Promise.all([Promise.resolve(window.KDACountyIQ.boot()),loadCountyIQUX()]).then(()=>Promise.allSettled([loadEvidenceHub(),loadOpportunityFinder(),loadPublicCleanup(),loadHardening(),loadCompletionSurface()]));',
              '    if(countyIqPromise)return countyIqPromise;',
              '    countyIqPromise=Promise.all([',
              "      styles([['assets/countyiq-view.css','kda-countyiq-css'],['assets/p05-breadth.css','kda-p05-breadth-css']]),",
              '      loadCountyIQUX(),loadHardening(),loadPolish()',
              "    ]).then(()=>KDA.loadScript('assets/countyiq-view.js',{id:'kda-countyiq-view'}))",
              '      .then(()=>window.KDACountyIQ?.boot?.()||null)',
              '      .then(()=>window.KDACountyIQUX?.boot?.()||null)',
              '      .then(()=>Promise.allSettled([loadEvidenceHub(),loadOpportunityFinder(),loadPublicCleanup(),loadCompletionSurface()]))',
              '      .then(value=>{redriveRoute();return value;})',
              '      .catch(countyIqFailure);',
              '    return countyIqPromise;',
              '  }',
          ])
          p.write_text(s[:start] + new + s[end:])
          PY
          node --check assets/lazy-integrations.js
          git diff --check
      - name: Install Atlas dependencies
        run: npm ci
      - name: Build generated browser fixture
        run: npm run opportunities:build
      - name: Deterministic P16 static gate
        run: npm run p16:static
      - name: Install pinned browser audit tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2 lighthouse@13.4.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Target CountyIQ browser contract
        run: npx playwright test tests/p16/release-audit.spec.mjs --project=chromium --grep "critical route: countyiq|CountyIQ is compact"
      - name: Commit validated repair and remove watchdog workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/watchdog-p16-countyiq-repair.yml
          git add assets/lazy-integrations.js
          git commit -m "fix(p16): load CountyIQ UX alongside data boot"
          git push origin HEAD:main
