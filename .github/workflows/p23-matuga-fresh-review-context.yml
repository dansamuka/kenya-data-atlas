name: P23 Matuga fresh review context

on:
  pull_request:
    paths:
      - .github/workflows/p23-matuga-fresh-review-context.yml
      - data/p23/turnout-salvage-tranche-a.json
      - data/p23/form34b-source-index-contract.json
      - scripts/p23/fresh-download-turnout-salvage-tranche.py
      - scripts/p23/build-matuga-fresh-review-context.py
      - scripts/p23/validate-matuga-fresh-review-context.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/p23-matuga-fresh-review-context.yml
      - data/p23/turnout-salvage-tranche-a.json
      - data/p23/form34b-source-index-contract.json
      - scripts/p23/fresh-download-turnout-salvage-tranche.py
      - scripts/p23/build-matuga-fresh-review-context.py
      - scripts/p23/validate-matuga-fresh-review-context.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matuga-fresh-review-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install deterministic PDF/image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils python3-pil
      - name: Fresh-download governed salvage-A sources
        run: >-
          python3 scripts/p23/fresh-download-turnout-salvage-tranche.py
          --tranche data/p23/turnout-salvage-tranche-a.json
          --source-index data/p23/form34b-source-index-contract.json
          --output /tmp/p23-turnout-salvage-a-fresh-download.json
          --download-dir /tmp/p23-turnout-salvage-a-pdfs
      - name: Render Matuga source page at exactly 250 DPI
        run: >-
          pdftoppm -f 3 -singlefile -r 250 -png
          /tmp/p23-turnout-salvage-a-pdfs/KEN-C002-CON009-form34b.pdf
          /tmp/matuga-form34b-page3-250dpi
      - name: Build governed full-page review context without extracting values
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/p23/build-matuga-fresh-review-context.py
          --download-manifest /tmp/p23-turnout-salvage-a-fresh-download.json
          --pdf /tmp/p23-turnout-salvage-a-pdfs/KEN-C002-CON009-form34b.pdf
          --page-png /tmp/matuga-form34b-page3-250dpi.png
          --output /tmp/matuga-fresh-review-context.json
          --workflow-run-id "$RUN_ID"
          --workflow-head-sha "$HEAD_SHA"
      - name: Validate 250-DPI no-value no-promotion context
        run: >-
          node scripts/p23/validate-matuga-fresh-review-context.mjs
          /tmp/matuga-fresh-review-context.json
          /tmp/matuga-form34b-page3-250dpi.png
      - name: Record manifest digest
        run: sha256sum /tmp/matuga-fresh-review-context.json | tee /tmp/matuga-fresh-review-context.sha256
      - name: Publish temporary branch review image for independent visual inspection
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p review-artifacts/p23/matuga
          cp /tmp/matuga-form34b-page3-250dpi.png review-artifacts/p23/matuga/page3-250dpi.png
          cp /tmp/matuga-fresh-review-context.json review-artifacts/p23/matuga/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f review-artifacts/p23/matuga/page3-250dpi.png review-artifacts/p23/matuga/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "P23: publish temporary Matuga review image"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload fresh Matuga review evidence locator
        uses: actions/upload-artifact@v4
        with:
          name: p23-matuga-fresh-review-context
          path: |
            /tmp/matuga-fresh-review-context.json
            /tmp/matuga-fresh-review-context.sha256
            /tmp/matuga-form34b-page3-250dpi.png
            /tmp/p23-turnout-salvage-a-pdfs/KEN-C002-CON009-form34b.pdf
          if-no-files-found: error
          retention-days: 2
