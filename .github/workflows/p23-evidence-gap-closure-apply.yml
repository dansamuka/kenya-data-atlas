name: P23 apply utilisation and density closures

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p23-evidence-gap-closure-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Materialise evidence closures
        run: python scripts/p23/apply-constituency-evidence-gap-closures.py
      - name: Rebuild and validate
        run: |
          node scripts/completeness/build-slot-ledger.mjs
          node scripts/completeness/validate-slot-ledger.mjs
          node scripts/p23/validate-constituency-evidence-gap-closures.mjs
          npm run p23:validate
          git diff --check
      - name: Commit validated tranche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p23-evidence-gap-closure-apply.yml
          git add package.json data/completeness/evidence-states.json data/completeness/slot-ledger.json data/completeness/slot-ledger.csv data/completeness/summary.json scripts/completeness/validate-slot-ledger.mjs
          git commit -m 'feat(p23): govern utilisation and facility-density gaps'
          git pull --rebase origin main
          git push origin HEAD:main
