name: P23 cycle 1 30-way shards6-8 new6 terminal classification

# Archived by P39 (2026-09-22): originally triggered on pull_request, every
# path scoped only to this workflow's own files (P38 classification: historical_one_off). Will not
# fire automatically again; preserved as a governed evidence record and kept available for
# on-demand manual re-run via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed terminal classifications
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/p23/p23-cycle1-terminal-classification-30way-shards6-8-new6.json')
          d=json.loads(p.read_text())
          assert d['schema_version']=='kda.p23.cycle1-terminal-classification-batch.v1'
          assert d['source_cycle']['workflow_run_id']==34844699737
          assert d['source_cycle']['workflow_head_sha']=='cec9f2ee607653114c8dcafed3dcee6b8850d855'
          assert len(d['source_cycle']['artifacts'])==3
          g=d['governance']
          assert g['no_inheritance'] is True
          assert g['no_promotion'] is True
          assert g['required_render_dpi']==250
          assert g['promotion_authorized_by_this_file'] is False
          assert g['canonical_turnout_value_written'] is False
          assert g['verified_rows_still_require_separate_cycle2_promotion_review'] is True
          rows=d['rows']
          assert len(rows)==6
          expected={
            'KEN-C015-CON070':'verified',
            'KEN-C027-CON144':'denominator_mismatch',
            'KEN-C015-CON072':'denominator_mismatch',
            'KEN-C027-CON145':'denominator_mismatch',
            'KEN-C016-CON075':'verified',
            'KEN-C027-CON146':'denominator_mismatch',
          }
          assert {r['geo_code'] for r in rows}==set(expected)
          for r in rows:
              assert r['verification_state']==expected[r['geo_code']]
              assert r['render_dpi']==250
              v=r['visual_transcription']; rec=r['same_row_valid_vote_reconciliation']; den=r['governed_denominator']
              assert sum(v['candidate_vote_totals_in_source_column_order'])==v['total_valid_votes']==rec['candidate_vote_sum']
              assert rec['reconciles_total_valid_votes'] is True and rec['delta']==0
              assert sum(den['ward_values'])==den['sum']
              assert den['form_registered_voters']==v['registered_voters']
              assert den['delta']==den['form_registered_voters']-den['sum']
              if r['verification_state']=='verified':
                  assert den['delta']==0 and den['reconciles'] is True and den['sum']==v['registered_voters']
              else:
                  assert den['delta']>0 and den['reconciles'] is False and den['sum']!=v['registered_voters']
              assert r['promotion_eligible'] is False
              assert r['promotion_authorized_by_this_record'] is False
              assert r['canonical_turnout_written'] is False
          assert sum(r['verification_state']=='verified' for r in rows)==2
          assert sum(r['verification_state']=='denominator_mismatch' for r in rows)==4
          print('P23_CYCLE1_30WAY_SHARDS6_8_NEW6_OK rows=6 verified=2 denominator_mismatch=4 no_promotion=true')
          PY
