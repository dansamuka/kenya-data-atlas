name: Methods and comparability visibility

on:
  push:
    branches:
      - feature/methods-comparability-visibility
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-validate-finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/methods-comparability-visibility
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Methods visibility integration
        run: node scripts/methods/bootstrap.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install geometry audit dependency
        run: python -m pip install shapely
      - name: Rebuild canonical policy registry
        run: npm run policy:build
      - name: Validate Methods and full Atlas
        run: npm test
      - name: Independent geometry audit
        run: npm run geography:audit
      - name: Remove one-shot integration tooling
        run: |
          rm scripts/methods/bootstrap.mjs
          rm .github/workflows/methods-visibility.yml
      - name: Commit validated Methods release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(methods): expose policy, rankings, trends and comparability"
            git push origin HEAD:feature/methods-comparability-visibility
          fi
