name: P05 breadth materialization

on:
  push:
    branches:
      - p05-breadth
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          pip install shapely
      - name: Apply P05 canonical integration
        run: |
          node scripts/p05/apply-p05.mjs
          node scripts/p05/finalize-derived-provenance.mjs
      - name: Rebuild published data
        run: npm run build:data
      - name: Run full validation
        run: npm test
      - name: Run independent geography audit
        run: npm run geography:audit
      - name: Commit validated materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets index.html package.json
          git diff --cached --quiet && exit 0
          git commit -m "feat(p05): materialize validated county breadth release"
          git push origin HEAD:p05-breadth
