name: P17 v1.0 publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p17-publish.yml'
      - 'scripts/p17/**'
      - 'scripts/countyiq/validate-p06.mjs'
      - 'scripts/countyiq/validate-p07.mjs'
      - 'scripts/countyiq/validate-p08.mjs'
      - 'scripts/distribution/validate-distribution.mjs'
      - 'docs/releases/v1.0.0.md'
      - 'docs/releases/v1.0.0-unresolved.md'
      - 'data/release/v1.0.0.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: p17-v1-release
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for release-candidate gates on exact main SHA
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const required = ['Validate Atlas data', 'P16 release audit', 'pages build and deployment'];
            const terminalFailure = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'stale']);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 0; attempt < 80; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, head_sha: sha, per_page: 100 });
              const state = {};
              for (const name of required) {
                const candidates = runs.filter(run => run.name === name).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                state[name] = candidates[0] || null;
              }
              core.info(`Candidate gate state ${sha}: ${required.map(name => `${name}=${state[name]?.status || 'missing'}/${state[name]?.conclusion || '-'}`).join(' | ')}`);
              for (const name of required) {
                if (state[name]?.conclusion && terminalFailure.has(state[name].conclusion)) {
                  core.setFailed(`${name} failed for candidate ${sha}: ${state[name].conclusion}`);
                  return;
                }
              }
              if (required.every(name => state[name]?.status === 'completed' && state[name]?.conclusion === 'success')) return;
              await sleep(10000);
            }
            core.setFailed(`Timed out waiting for exact candidate gates on ${sha}`);

      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check shapely

      - name: Finalize v1.0 metadata and rebuild release products
        run: |
          node scripts/p17/finalize-release.mjs
          npm run build:data
          npm test
          npm run geography:audit

      - name: Commit v1.0 completion state
        id: release_commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json data/project-roadmap.json data/release/v1.0.0.json data/distribution data/countyiq/county-summary.json README.md ROADMAP.md CHANGELOG.md CITATION.cff docs/REPO-COMPLETION-PLAN.md
          if git diff --cached --quiet; then
            echo 'No release metadata changes were required.'
          else
            git commit -m 'release: Kenya Data Atlas v1.0.0'
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch final release gates on exact main head
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.release_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.RELEASE_SHA;
            const main = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.data.object.sha !== sha) {
              core.setFailed(`Refusing to dispatch release gates: main=${main.data.object.sha}, release=${sha}`);
              return;
            }
            for (const workflow_id of ['validate.yml', 'release-audit.yml']) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: 'main' });
              core.info(`P17_RELEASE_GATE_DISPATCHED workflow=${workflow_id} sha=${sha}`);
            }

      - name: Wait for final release gates on exact release SHA
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.release_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.RELEASE_SHA;
            const required = ['Validate Atlas data', 'P16 release audit', 'pages build and deployment'];
            const terminalFailure = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'stale']);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 0; attempt < 80; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, head_sha: sha, per_page: 100 });
              const state = {};
              for (const name of required) {
                const candidates = runs.filter(run => run.name === name).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                state[name] = candidates[0] || null;
              }
              core.info(`Release gate state ${sha}: ${required.map(name => `${name}=${state[name]?.status || 'missing'}/${state[name]?.conclusion || '-'}`).join(' | ')}`);
              for (const name of required) {
                if (state[name]?.conclusion && terminalFailure.has(state[name].conclusion)) {
                  core.setFailed(`${name} failed for release ${sha}: ${state[name].conclusion}`);
                  return;
                }
              }
              if (required.every(name => state[name]?.status === 'completed' && state[name]?.conclusion === 'success')) return;
              await sleep(10000);
            }
            core.setFailed(`Timed out waiting for exact release gates on ${sha}`);

      - name: Post-deployment live smoke test
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://dansamuka.github.io/kenya-data-atlas'
          curl -fsSL --retry 5 --retry-delay 3 "$base/?release=$RELEASE_SHA" -o /tmp/index.html
          grep -q 'Kenya Data Atlas' /tmp/index.html
          curl -fsSL --retry 5 --retry-delay 3 "$base/county-dashboard.html?release=$RELEASE_SHA" -o /tmp/county-dashboard.html
          grep -q 'Kenya Data Atlas' /tmp/county-dashboard.html
          curl -fsSL --retry 5 --retry-delay 3 "$base/data/project-roadmap.json?release=$RELEASE_SHA" -o /tmp/roadmap.json
          curl -fsSL --retry 5 --retry-delay 3 "$base/data/release/v1.0.0.json?release=$RELEASE_SHA" -o /tmp/release.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/roadmap.json'));const p=r.phases.find(x=>x.id==='P17');if(!p||p.status!=='complete')process.exit(1);const m=JSON.parse(fs.readFileSync('/tmp/release.json'));if(m.release_version!=='1.0.0'||m.release_status!=='released')process.exit(1);console.log('P17_LIVE_SMOKE_OK release=1.0.0');"

      - name: Create immutable v1.0.0 tag and GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.release_sha }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.RELEASE_SHA;
            const tag = 'v1.0.0';
            try {
              const existing = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (existing.data.object.sha !== sha) {
                core.setFailed(`${tag} already points to ${existing.data.object.sha}, expected ${sha}`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            }
            const body = `${fs.readFileSync('docs/releases/v1.0.0.md', 'utf8')}\n\nRelease commit: \`${sha}\`\n`;
            try {
              const existingRelease = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({ owner, repo, release_id: existingRelease.data.id, tag_name: tag, name: 'Kenya Data Atlas v1.0.0', body, draft: false, prerelease: false });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: sha, name: 'Kenya Data Atlas v1.0.0', body, draft: false, prerelease: false });
            }
            core.info(`P17_GITHUB_RELEASE_OK tag=${tag} sha=${sha}`);
