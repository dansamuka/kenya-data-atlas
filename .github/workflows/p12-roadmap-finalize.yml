name: P12 roadmap finalization

on:
  push:
    branches: [p12-canonical-convergence-20260829]
    paths:
      - 'scripts/p12/finalize-roadmap.mjs'
      - '.github/workflows/p12-roadmap-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out P12 branch
        uses: actions/checkout@v4
        with:
          ref: p12-canonical-convergence-20260829
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Finalize roadmap and completion plan
        run: node scripts/p12/finalize-roadmap.mjs

      - name: Remove one-shot finalization tooling
        run: |
          rm scripts/p12/finalize-roadmap.mjs
          rm .github/workflows/p12-roadmap-finalize.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate P12 policy and project handoff
        run: |
          npm run policy:validate
          npm run project:validate

      - name: Commit P12 governance handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P12: finalize convergence governance and advance P13'
          git push origin HEAD:p12-canonical-convergence-20260829
