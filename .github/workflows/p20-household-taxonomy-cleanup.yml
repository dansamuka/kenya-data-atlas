name: P20 household taxonomy cleanup

on:
  push:
    branches: [p20-household-size-promotion]
    paths:
      - '.github/workflows/p20-household-taxonomy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p20-household-size-promotion
          fetch-depth: 0
      - name: Restore compact taxonomy and patch exact household source
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:data/indicators/seed/placeholder-taxonomy.json > data/indicators/seed/placeholder-taxonomy.json
          python - <<'PY'
          from pathlib import Path
          p=Path('data/indicators/seed/placeholder-taxonomy.json')
          s=p.read_text()
          old='{"code":"IND-HOUSEHOLD-SIZE","name":"Average household size","description":"Average number of persons per household.","unit_code":"persons_per_household","status":"sourced","tab":"people","levels":["county","constituency"],"source":"KNBS 2019 census, Volume II","source_url":"https://www.knbs.or.ke/2019-kenya-population-and-housing-census-reports/","note":"Constituency alignment must be verified before activation."}'
          new='{"code":"IND-HOUSEHOLD-SIZE","name":"Average household size","description":"Average number of persons per household.","unit_code":"persons_per_household","status":"sourced","tab":"people","levels":["county","constituency"],"source":"KNBS 2019 Kenya Population and Housing Census, Volume I, Table 2.3","source_url":"https://repository.knbs.or.ke/handle/knbs-ke-repo/385","note":"County average household size is published directly in Volume I Table 2.3. Do not inherit county values to constituencies; lower-level activation requires its own governed source mapping."}'
          if old not in s:
              raise SystemExit('expected household taxonomy seed not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/indicators/seed/placeholder-taxonomy.json
          git commit -m 'chore(p20): keep household taxonomy diff focused'
          git push origin HEAD:p20-household-size-promotion
