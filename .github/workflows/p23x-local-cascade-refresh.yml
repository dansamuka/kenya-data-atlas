name: P23X local cascade refresh

on:
  push:
    branches: [watchdog/indicator-cascade-contract]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: watchdog/indicator-cascade-contract
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check shapely
      - name: Rebuild deterministic Atlas products
        run: npm run build:data
      - name: Build and validate local cascade audit
        run: |
          node scripts/completeness/build-local-indicator-cascade.mjs
          node scripts/completeness/validate-local-indicator-cascade.mjs
      - name: Run full Atlas validation
        run: npm test
      - name: Commit deterministic refresh and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p23x-local-cascade-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/completeness/evidence-states.json \
                  data/completeness/local-indicator-cascade.json \
                  data/completeness/local-indicator-cascade-summary.json \
                  .github/workflows/p23x-local-cascade-refresh.yml
          if git diff --cached --quiet; then
            echo 'No deterministic refresh required.'
            exit 0
          fi
          git commit -m 'build: refresh local cascade governance artifacts'
          git push origin HEAD:watchdog/indicator-cascade-contract
