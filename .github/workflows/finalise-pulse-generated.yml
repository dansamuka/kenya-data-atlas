name: Finalise Pulse generated outputs

on:
  push:
    branches: [pulse-history-backfill]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse-history-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check shapely
      - name: Rebuild all published data products
        run: npm run build:data
      - name: Commit deterministic generated outputs
        run: |
          if git diff --quiet; then
            echo 'Generated outputs already in sync.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Sync generated outputs for Pulse history backfill'
          git push origin HEAD:pulse-history-backfill
