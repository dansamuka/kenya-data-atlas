name: Validate Sprint 3 release with World Bank

on:
  push:
    branches: [release-sprint3-wb-20260827]
  workflow_dispatch:

concurrency:
  group: sprint3-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deterministic combined build
        run: npm run build:data
      - name: Full Atlas validation
        run: npm test
      - name: Commit generated native registries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Geography is rebuilt only to prove the full pipeline still passes.
          # Sprint 3 owns no geography changes, so discard any deterministic
          # regeneration churn before publishing the historical registry state.
          git restore data/geography
          git add data/catalogue/registry data/indicators/registry data/indicators/seed/derived
          if git diff --cached --quiet; then
            echo "Generated native registries already current."
          else
            git commit -m "build(sprint3): publish combined WB + historical registries"
            git push origin HEAD:release-sprint3-wb-20260827
          fi
