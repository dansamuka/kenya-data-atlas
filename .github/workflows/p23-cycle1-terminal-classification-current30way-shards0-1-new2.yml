name: P23 cycle 1 current 30-way shards0-1 new2 terminal classification

# Archived by P39 (2026-09-22): originally triggered on pull_request, every
# path scoped only to this workflow's own files (P38 classification: historical_one_off). Will not
# fire automatically again; preserved as a governed evidence record and kept available for
# on-demand manual re-run via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed terminal classifications
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/p23/p23-cycle1-terminal-classification-current30way-shards0-1-new2.json')
          d=json.loads(p.read_text())
          assert d['schema_version']=='kda.p23.cycle1-terminal-classification-batch.v1'
          assert d['source_cycle']['workflow_run_id']==34903665755
          assert d['source_cycle']['workflow_head_sha']=='983ae302b568087ba13c9d21b99829230031b4bc'
          assert [a['id'] for a in d['source_cycle']['artifacts']]==[10372420614,10372345657]
          assert all(a['digest'].startswith('sha256:') for a in d['source_cycle']['artifacts'])
          g=d['governance']
          assert g['no_inheritance'] is True
          assert g['no_promotion'] is True
          assert g['required_render_dpi']==250
          assert g['automatic_polling_station_aggregation_for_terminal_result_values_forbidden'] is True
          assert g['promotion_authorized_by_this_file'] is False
          assert g['canonical_turnout_value_written'] is False
          assert g['verified_rows_still_require_separate_cycle2_promotion_review'] is True
          rows={r['geo_code']:r for r in d['rows']}
          assert set(rows)=={'KEN-C012-CON055','KEN-C012-CON057'}

          tig=rows['KEN-C012-CON055']
          assert tig['name']=='Tigania East' and tig['verification_state']=='partial_unresolved'
          assert tig['render_dpi']==250
          assert tig['source_pdf_sha256']=='81762e14ffdec2dea38649628ea47438aea2ecc5f67fea6a1926d4140811bacb'
          assert tig['review_context_image_sha256']=='af335442c6a713c15b0ae33ab91c18c395862044a828ca3708a34f956cc799cd'
          v=tig['visual_transcription']; den=tig['governed_denominator']; unr=tig['unresolved_result_summary']
          assert v['registered_voters']==83527 and v['voters_who_turned_out_to_vote']==53114
          assert v['candidate_vote_totals_in_source_column_order'] is None
          assert v['total_valid_votes'] is None and v['rejected_ballots'] is None
          assert sum(den['ward_values'])==den['sum']==den['form_registered_voters']==v['registered_voters']==83527
          assert den['delta']==0 and den['reconciles'] is True
          assert unr['candidate_totals_resolved'] is False and unr['automatic_aggregation_performed'] is False

          buu=rows['KEN-C012-CON057']
          assert buu['name']=='Buuri' and buu['verification_state']=='verified'
          assert buu['render_dpi']==250
          assert buu['source_pdf_sha256']=='76cff6d3e7ee45d2aef7a9dae9b066fa37bb1cc30e4edf248a08fd0162dd6215'
          assert buu['review_context_image_sha256']=='5535307522e908fb9bb6ad97ac7c9f0ab114ce560052d885c65d2d152e76acd9'
          v=buu['visual_transcription']; rec=buu['same_row_valid_vote_reconciliation']; den=buu['governed_denominator']
          assert v['candidate_vote_totals_in_source_column_order']==[7107,46441,78,206]
          assert sum(v['candidate_vote_totals_in_source_column_order'])==53832==v['total_valid_votes']==rec['candidate_vote_sum']
          assert rec['reconciles_total_valid_votes'] is True and rec['delta']==0
          assert sum(den['ward_values'])==82341==den['sum']==den['form_registered_voters']==v['registered_voters']
          assert den['delta']==0 and den['reconciles'] is True

          for r in rows.values():
              assert r['promotion_eligible'] is False
              assert r['promotion_authorized_by_this_record'] is False
              assert r['canonical_turnout_written'] is False
          print('P23_CYCLE1_CURRENT30WAY_SHARDS0_1_NEW2_OK rows=2 verified=1 partial_unresolved=1 no_promotion=true')
          PY
