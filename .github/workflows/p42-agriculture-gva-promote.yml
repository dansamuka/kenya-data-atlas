name: P42 Agriculture GVA promotion

on:
  push:
    branches:
      - p42-economic-gridded-probe
    paths:
      - .github/workflows/p42-agriculture-gva-promote.yml
      - data/p42/agriculture-gva-candidate.json
      - data/p42/agriculture-gva-contract.json
      - scripts/p42/apply-agriculture-gva.mjs
      - scripts/p42/validate-agriculture-gva-candidate.mjs
      - docs/methodology/P42-AGRICULTURE-GVA.md
      - data/local-indicator-cascade-decisions.json
      - package.json

permissions:
  contents: write

concurrency:
  group: p42-agriculture-gva-promotion
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p42-economic-gridded-probe
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Validate frozen candidate
        run: node scripts/p42/validate-agriculture-gva-candidate.mjs
      - name: Promote passing cells to canonical registries
        run: |
          node scripts/p42/apply-agriculture-gva.mjs catalogue
          node scripts/catalogue/validate-catalogue.mjs
          node scripts/p42/apply-agriculture-gva.mjs indicators
          node scripts/indicators/build-cross-level-eligibility.mjs
          node scripts/indicators/validate-registry.mjs
      - name: Rebuild Local-54 publication surfaces
        run: |
          node scripts/distribution/build-distribution.mjs
          node scripts/p29/build-local-54-slot-ledger.mjs
          node scripts/p34/build-local-54-profile-subsets.mjs
          node scripts/p35/build-local-54-release-gate.mjs
          node scripts/completeness/build-local-indicator-cascade.mjs
      - name: Validate promoted Agriculture GVA and governance
        run: |
          npm run distribution:validate
          npm run p29:validate
          npm run p34:validate
          npm run p35:validate
          node scripts/completeness/validate-local-indicator-cascade.mjs --strict
      - name: Commit promotion outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/catalogue/registry             data/indicators/registry             data/distribution             data/completeness/local-54-slot-ledger.json             data/completeness/local-54-slot-ledger.csv             data/completeness/local-54-reason-catalogue.json             data/completeness/local-54-reason-catalogue.csv             data/completeness/local-54-summary.json             data/completeness/local-indicator-cascade.json             data/completeness/local-indicator-cascade-summary.json             data/local-54-profiles             data/audit/local-54-freshness-queue.json             data/audit/local-54-supersession-queue.json             data/audit/local-54-reaudit-queue.json             data/local-54-completion-dashboard.json
          if git diff --cached --quiet; then
            echo "No promotion output change."
          else
            git commit -m "P42: promote validated Agriculture GVA estimates"
            git push origin HEAD:p42-economic-gridded-probe
          fi
