name: P12 canonical convergence

on:
  push:
    branches: [p12-canonical-convergence-20260829]
    paths:
      - 'scripts/policy/**'
      - 'scripts/p12/**'
      - 'scripts/p06/**'
      - 'scripts/indicators/build-cross-level-eligibility.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p12-convergence.yml'

permissions:
  contents: write

jobs:
  converge-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out P12 branch
        uses: actions/checkout@v4
        with:
          ref: p12-canonical-convergence-20260829
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply one-shot CountyIQ convergence migration
        run: node scripts/p12/migrate-convergence.mjs

      - name: Remove one-shot migration tooling from release tree
        run: |
          rm scripts/p12/migrate-convergence.mjs
          rm .github/workflows/p12-convergence.yml

      - name: Install dependencies
        run: npm ci

      - name: Install geometry audit dependency
        run: python -m pip install shapely

      - name: Rebuild indicator registry products
        run: npm run indicators:build

      - name: Rebuild CountyIQ and public policy registry
        run: npm run countyiq:build

      - name: Run full Atlas validation
        run: npm test

      - name: Run independent geometry audit
        run: npm run geography:audit

      - name: Commit validated P12 convergence candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'P12: converge canonical indicator policy across Atlas'
            git push origin HEAD:p12-canonical-convergence-20260829
          fi
