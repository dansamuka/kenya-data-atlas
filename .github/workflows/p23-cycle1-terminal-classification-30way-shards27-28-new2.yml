name: P23 cycle 1 refreshed 30-way shards27-28 new2 terminal classification

# Archived by P39 (2026-09-22): originally triggered on pull_request, every
# path scoped only to this workflow's own files (P38 classification: historical_one_off). Will not
# fire automatically again; preserved as a governed evidence record and kept available for
# on-demand manual re-run via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed terminal classifications
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/p23/p23-cycle1-terminal-classification-30way-shards27-28-new2.json')
          d=json.loads(p.read_text())
          assert d['schema_version']=='kda.p23.cycle1-terminal-classification-batch.v1'
          assert d['source_cycle']['workflow_run_id']==34898481883
          assert d['source_cycle']['workflow_head_sha']=='6b533ae49b27ae2ac10d4d484e81824843de499d'
          assert len(d['source_cycle']['artifacts'])==2
          g=d['governance']
          assert g['no_inheritance'] is True
          assert g['no_promotion'] is True
          assert g['required_render_dpi']==250
          assert g['promotion_authorized_by_this_file'] is False
          assert g['canonical_turnout_value_written'] is False
          assert g['verified_rows_still_require_separate_cycle2_promotion_review'] is True
          rows=d['rows']
          assert len(rows)==2
          assert {r['geo_code'] for r in rows}=={'KEN-C022-CON115','KEN-C022-CON120'}
          by={r['geo_code']:r for r in rows}
          assert by['KEN-C022-CON115']['verification_state']=='denominator_mismatch'
          assert by['KEN-C022-CON120']['verification_state']=='verified'
          for r in rows:
              assert r['render_dpi']==250
              v=r['visual_transcription']; rec=r['same_row_valid_vote_reconciliation']; den=r['governed_denominator']
              assert sum(v['candidate_vote_totals_in_source_column_order'])==v['total_valid_votes']==rec['candidate_vote_sum']
              assert rec['reconciles_total_valid_votes'] is True and rec['delta']==0
              assert sum(den['ward_values'])==den['sum']
              assert den['delta']==den['form_registered_voters']-den['sum']
              if r['verification_state']=='verified':
                  assert den['reconciles'] is True and den['delta']==0
                  assert den['sum']==v['registered_voters']==den['form_registered_voters']
              else:
                  assert den['reconciles'] is False and den['delta']!=0
                  assert v['registered_voters']==den['form_registered_voters']
              assert r['promotion_eligible'] is False
              assert r['promotion_authorized_by_this_record'] is False
              assert r['canonical_turnout_written'] is False
          print('P23_CYCLE1_REFRESHED_30WAY_SHARDS27_28_NEW2_OK rows=2 verified=1 denominator_mismatch=1 no_promotion=true')
          PY
