name: P21 materialize business and facility closures

on:
  push:
    branches: [p21-materialize-business-facility-closures]
    paths:
      - '.github/workflows/p21-materialize-business-facility.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p21-materialize-business-facility-closures
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply governed P21 closure decisions
        run: |
          node scripts/p21/prepare-business-licenses-retirement.mjs
          node scripts/p21/prepare-facility-infrastructure-retirement.mjs
      - name: Rebuild all governed data products
        run: npm run build:data
      - name: Validate full repository
        run: npm test
      - name: Validate completion targets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summary=JSON.parse(fs.readFileSync('data/completeness/summary.json','utf8'));
          const queue=JSON.parse(fs.readFileSync('data/completeness/p21-work-queue.json','utf8'));
          const evidence=JSON.parse(fs.readFileSync('data/completeness/evidence-states.json','utf8'));
          const taxonomy=JSON.parse(fs.readFileSync('data/indicators/seed/placeholder-taxonomy.json','utf8'));
          const expectedFamilies=['IND-HOSPITAL-BED-UTILIZATION','IND-ROAD-NETWORK-LENGTH','IND-SOCIAL-PROTECTION-BENEFICIARIES','IND-VEHICLE-REGISTRATIONS'];
          const fail=m=>{throw new Error(m)};
          if(summary.total_slots!==20115) fail(`total slots ${summary.total_slots}`);
          if(summary.resolved_slots!==3620) fail(`resolved ${summary.resolved_slots}, expected 3620`);
          if(summary.unresolved_slots!==16495) fail(`unresolved ${summary.unresolved_slots}, expected 16495`);
          if(summary.by_completion_phase?.P21!==188) fail(`P21 ${summary.by_completion_phase?.P21}, expected 188`);
          if(queue.remaining_slots!==188||queue.family_count!==4) fail(`queue ${queue.remaining_slots}/${queue.family_count}, expected 188/4`);
          if(JSON.stringify(Object.keys(queue.family_counts||{}).sort())!==JSON.stringify(expectedFamilies)) fail(`unexpected P21 families ${Object.keys(queue.family_counts||{}).sort().join(',')}`);
          for(const code of ['IND-BUSINESS-LICENSES','IND-FACILITY-INFRASTRUCTURE']){
            const closure=(evidence.states||[]).find(s=>s.indicator_code===code&&s.status==='retired_replaced');
            if(!closure||closure.geo_codes?.length!==47) fail(`${code} governed closure missing`);
            const def=(taxonomy.indicators||[]).find(i=>i.code===code);
            if(def?.status!=='retired') fail(`${code} taxonomy not retired`);
          }
          console.log('P21_MATERIALIZATION_OK resolved=3620 p21_remaining=188 families=4');
          NODE
      - name: Commit governed outputs and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p21-materialize-business-facility.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 1
          fi
          git commit -m 'P21: materialize business and facility closures'
          git push origin HEAD:p21-materialize-business-facility-closures
