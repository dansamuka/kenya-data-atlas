name: Actions queue hygiene

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-queue-hygiene.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: write

jobs:
  clear-stale-queued-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STALE_AFTER_HOURS: '6'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clear stale queued workflow runs
        shell: bash
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d "${STALE_AFTER_HOURS} hours ago" +%s)"
          normal_cancelled=0
          force_cancelled=0
          deleted=0
          failed=0
          seen=0

          while IFS=$'\t' read -r run_id created_at run_name head_branch; do
            [[ -z "${run_id:-}" ]] && continue
            seen=$((seen + 1))
            created_epoch="$(date -u -d "${created_at}" +%s)"

            if (( created_epoch >= cutoff_epoch )); then
              echo "KEEP   #${run_id} | ${created_at} | ${run_name} | ${head_branch} (younger than ${STALE_AFTER_HOURS}h)"
              continue
            fi

            echo "CLEAR  #${run_id} | ${created_at} | ${run_name} | ${head_branch}"

            if gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1; then
              normal_cancelled=$((normal_cancelled + 1))
              continue
            fi

            if gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1; then
              force_cancelled=$((force_cancelled + 1))
              continue
            fi

            # Some GitHub Actions records can become "phantom queued" entries:
            # list APIs say queued, but cancel/force-cancel both return 409
            # ("has not been queued yet") and no jobs were ever instantiated.
            # Re-check state immediately before deleting only that stale run record.
            live_status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            if [[ "${live_status}" == "queued" ]]; then
              echo "Phantom queued record detected; deleting stale run #${run_id}."
              if gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null; then
                deleted=$((deleted + 1))
                continue
              fi
            fi

            failed=$((failed + 1))
            echo "::warning::Could not clear stale run #${run_id}; live status=${live_status:-unknown}."
          done < <(
            gh api --paginate               "/repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100"               --jq '.workflow_runs[] | [.id, .created_at, .name, (.head_branch // "")] | @tsv'
          )

          echo "Queued runs inspected: ${seen}"
          echo "Normal cancellations accepted: ${normal_cancelled}"
          echo "Force-cancellations accepted: ${force_cancelled}"
          echo "Phantom queued records deleted: ${deleted}"
          echo "Cleanup failures: ${failed}"

          {
            echo "## Actions queue hygiene"
            echo
            echo "- Safety threshold: **${STALE_AFTER_HOURS} hours**"
            echo "- Queued runs inspected: **${seen}**"
            echo "- Normal cancellations accepted: **${normal_cancelled}**"
            echo "- Force-cancellations accepted: **${force_cancelled}**"
            echo "- Phantom queued records deleted: **${deleted}**"
            echo "- Cleanup failures: **${failed}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify stale queue is clear
        shell: bash
        run: |
          set -euo pipefail
          sleep 3

          cutoff_epoch="$(date -u -d "${STALE_AFTER_HOURS} hours ago" +%s)"
          stale=0

          while IFS=$'\t' read -r run_id created_at run_name; do
            [[ -z "${run_id:-}" ]] && continue
            created_epoch="$(date -u -d "${created_at}" +%s)"
            if (( created_epoch < cutoff_epoch )); then
              echo "::warning::Still queued: #${run_id} | ${created_at} | ${run_name}"
              stale=$((stale + 1))
            fi
          done < <(
            gh api --paginate               "/repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100"               --jq '.workflow_runs[] | [.id, .created_at, .name] | @tsv'
          )

          echo "Stale queued runs remaining after cleanup: ${stale}"
          if (( stale > 0 )); then
            exit 1
          fi
