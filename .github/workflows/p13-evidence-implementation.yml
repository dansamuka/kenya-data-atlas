name: P13 evidence hub implementation

on:
  push:
    branches:
      - p13-county-evidence-hub-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-validate-finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out P13 branch
        uses: actions/checkout@v4
        with:
          ref: p13-county-evidence-hub-20260830
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply P13 product migration
        run: node scripts/p13/bootstrap.mjs product
      - name: Install dependencies
        run: npm ci
      - name: Install geometry audit dependency
        run: python -m pip install shapely
      - name: Build P13 evidence registry
        run: npm run evidence:build
      - name: Validate P13 and full Atlas
        run: npm test
      - name: Independent geometry audit
        run: npm run geography:audit
      - name: Finalize roadmap handoff
        run: |
          node scripts/p13/bootstrap.mjs finalize
          npm run project:validate
          npm run evidence:validate
      - name: Remove one-shot implementation tooling
        run: |
          rm scripts/p13/bootstrap.mjs
          rm .github/workflows/p13-evidence-implementation.yml
      - name: Commit validated P13 release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "P13: publish county evidence and knowledge hub"
            git push origin HEAD:p13-county-evidence-hub-20260830
          fi
