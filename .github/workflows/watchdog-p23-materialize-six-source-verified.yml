name: Watchdog P23 materialize six source-verified turnout rows

on:
  push:
    branches:
      - watchdog/p23-materialize-six-source-verified

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Authorize only the six independently source-verified rows
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            ['data/p23/form34b-kinango-source-verification.json',10,'KEN-C002-CON010'],
            ['data/p23/form34b-mbeere-north-source-verification.json',66,'KEN-C014-CON066'],
            ['data/p23/form34b-mavoko-source-verification.json',80,'KEN-C016-CON080'],
            ['data/p23/form34b-kabete-source-verification.json',119,'KEN-C022-CON119'],
            ['data/p23/form34b-rangwe-source-verification.json',248,'KEN-C043-CON248'],
            ['data/p23/form34b-ndhiwa-source-verification.json',250,'KEN-C043-CON250']
          ];
          for (const [path, code, geo] of files) {
            const e = JSON.parse(fs.readFileSync(path,'utf8'));
            if (e.verification_state !== 'verified') throw new Error(`${path}: not verified`);
            if (e.promotion_eligible !== false || e.promotion_state !== 'pending_explicit_materialization' || e.promotion_authorized_by_this_file !== false) throw new Error(`${path}: unexpected pre-promotion state`);
            if (Number(e.sample?.constituency_code) !== code || e.sample?.geo_code !== geo) throw new Error(`${path}: identity mismatch`);
            for (const field of ['registered_voters','total_valid_votes','rejected_ballots']) {
              if (e.field_evidence?.[field]?.verification_state !== 'source_verified' || !Number.isInteger(e.field_evidence?.[field]?.verified_value)) throw new Error(`${path}: ${field} not source_verified`);
            }
            const f=e.field_evidence;
            if (f.total_valid_votes.verified_value + f.rejected_ballots.verified_value > f.registered_voters.verified_value) throw new Error(`${path}: ballot bound failure`);
            e.promotion_eligible = true;
            e.promotion_state = 'explicit_materialization_authorized';
            e.promotion_authorization_contract = 'data/p23/form34b-turnout-promotion-contract.json';
            e.note = 'This evidence establishes a source-verified row under the extraction contract. Canonical materialization is authorized only by the separate governed promotion tranche in data/p23/form34b-turnout-promotion-contract.json.';
            fs.writeFileSync(path, JSON.stringify(e,null,2)+'\n');
          }
          const p='data/p23/form34b-turnout-promotion-contract.json';
          const c=JSON.parse(fs.readFileSync(p,'utf8'));
          const addCodes=[10,66,80,119,248,250];
          const addGeos=['KEN-C002-CON010','KEN-C014-CON066','KEN-C016-CON080','KEN-C022-CON119','KEN-C043-CON248','KEN-C043-CON250'];
          const existingCodes=new Set(c.current_tranche.verified_constituency_codes);
          const existingGeos=new Set(c.current_tranche.verified_geo_codes);
          for (const x of addCodes) { if (existingCodes.has(x)) throw new Error(`already authorized code ${x}`); existingCodes.add(x); }
          for (const x of addGeos) { if (existingGeos.has(x)) throw new Error(`already authorized geo ${x}`); existingGeos.add(x); }
          c.contract_id='P23-IEBC-2022-FORM34B-TURNOUT-PROMOTION-2026-09-09-T6';
          c.as_of='2026-09-09';
          c.current_tranche.verified_constituencies=38;
          c.current_tranche.verified_constituency_codes=[...existingCodes].sort((a,b)=>a-b);
          c.current_tranche.verified_geo_codes=[...existingGeos].sort((a,b)=>Number(a.match(/CON(\d+)/)?.[1])-Number(b.match(/CON(\d+)/)?.[1]));
          c.current_tranche.newly_authorized_constituency_codes=addCodes;
          c.current_tranche.expected_p23_remaining_after_materialization=252;
          c.current_tranche.expected_resolved_slots_after_materialization=14032;
          c.current_tranche.governed_total_slots=20115;
          c.scale_plan.next_step='Continue independent official Form 34B source review or governed closure for the remaining P23 turnout rows; preserve all arithmetic conflicts, incomplete rows and ambiguous TOTAL labels without inference.';
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Rebuild canonical data
        run: npm run build:data
      - name: Validate source-verification boundary
        run: node scripts/p23/validate-form34b-source-verifications.mjs
      - name: Validate exact deterministic delta
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('data/completeness/summary.json','utf8'));
          if (s.total_slots!==20115 || s.resolved_slots!==14032 || s.unresolved_slots!==6083 || s.by_completion_phase?.P23!==252 || s.unknown_missing!==0) throw new Error(`unexpected summary ${JSON.stringify(s)}`);
          const series=JSON.parse(fs.readFileSync('data/indicators/registry/series.json','utf8'));
          const obs=JSON.parse(fs.readFileSync('data/indicators/registry/observations.json','utf8'));
          for (const code of [10,66,80,119,248,250]) {
            const sc=`KDA-TURNOUT-CON-${String(code).padStart(3,'0')}-2022-PRES`;
            const sr=series.find(x=>x.series_code===sc);
            if (!sr) throw new Error(`missing ${sc}`);
            const or=obs.find(x=>x.series_id===sr.series_id && x.period_start==='2022-08-09');
            if (!or || or.source_class!=='official' || or.badge!=='A' || or.source_row_label!=='TOTAL') throw new Error(`bad observation ${sc}`);
          }
          NODE
      - name: Full deterministic validation suite
        run: npm test
      - name: Remove one-shot workflow and commit generated outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/watchdog-p23-materialize-six-source-verified.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'P23: materialize six source-verified Form 34B turnout rows'
          git push origin HEAD:watchdog/p23-materialize-six-source-verified
