name: P23 cycle 1 refreshed 30-way shards17-18 new2 terminal classification

on:
  pull_request:
    paths:
      - data/p23/p23-cycle1-terminal-classification-30way-shards17-18-new2.json
      - .github/workflows/p23-cycle1-terminal-classification-30way-shards17-18-new2.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed terminal classifications
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/p23/p23-cycle1-terminal-classification-30way-shards17-18-new2.json')
          d=json.loads(p.read_text())
          assert d['schema_version']=='kda.p23.cycle1-terminal-classification-batch.v1'
          assert d['source_cycle']['workflow_run_id']==34867685029
          assert d['source_cycle']['workflow_head_sha']=='2f6fb62d936761f90e47d93808bcbb723663b7a9'
          assert len(d['source_cycle']['artifacts'])==2
          g=d['governance']
          assert g['no_inheritance'] is True
          assert g['no_promotion'] is True
          assert g['required_render_dpi']==250
          assert g['promotion_authorized_by_this_file'] is False
          assert g['canonical_turnout_value_written'] is False
          assert g['verified_rows_still_require_separate_cycle2_promotion_review'] is True
          rows=d['rows']
          assert len(rows)==2
          by={r['geo_code']:r for r in rows}
          assert set(by)=={'KEN-C022-CON116','KEN-C022-CON117'}
          for r in rows:
              assert r['render_dpi']==250
              v=r['visual_transcription']; rec=r['same_row_valid_vote_reconciliation']; den=r['governed_denominator']
              assert sum(v['candidate_vote_totals_in_source_column_order'])==v['total_valid_votes']==rec['candidate_vote_sum']
              assert rec['reconciles_total_valid_votes'] is True and rec['delta']==0
              assert sum(den['ward_values'])==den['sum']
              assert den['form_registered_voters']==v['registered_voters']
              assert den['delta']==den['form_registered_voters']-den['sum']
              assert r['promotion_eligible'] is False
              assert r['promotion_authorized_by_this_record'] is False
              assert r['canonical_turnout_written'] is False
          a=by['KEN-C022-CON116']; b=by['KEN-C022-CON117']
          assert a['verification_state']=='verified'
          assert a['governed_denominator']['reconciles'] is True and a['governed_denominator']['delta']==0
          assert b['verification_state']=='denominator_mismatch'
          assert b['governed_denominator']['reconciles'] is False and b['governed_denominator']['delta']==90
          print('P23_CYCLE1_REFRESHED_30WAY_SHARDS17_18_NEW2_OK rows=2 verified=1 denominator_mismatch=1 no_promotion=true')
          PY
