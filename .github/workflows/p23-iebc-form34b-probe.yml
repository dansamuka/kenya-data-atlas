name: P23 IEBC Form 34B probe

on:
  push:
    branches:
      - main
      - p23/constituency-turnout-probe
    paths:
      - scripts/p23/probe-iebc-form34b.sh
      - scripts/p23/probe-iebc-form34b-pages.sh
      - scripts/p23/probe-turnout-transcription.sh
      - scripts/p23/reconcile-turnout-transcription.mjs
      - .github/workflows/p23-iebc-form34b-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe official IEBC 2022 result-form portal
        run: bash scripts/p23/probe-iebc-form34b.sh
      - name: Resolve Form 34B result-grid pagination
        run: bash scripts/p23/probe-iebc-form34b-pages.sh

  transcription:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe candidate turnout transcription layer
        run: bash scripts/p23/probe-turnout-transcription.sh
      - name: Reconcile transcription to official constituency voter schedule
        run: node scripts/p23/reconcile-turnout-transcription.mjs
      - name: Retain transcription evidence
        uses: actions/upload-artifact@v4
        with:
          name: p23-turnout-transcription-evidence
          path: |
            /tmp/p23-turnout-transcription-envelope.json
            /tmp/p23-turnout-reconciliation.json
          if-no-files-found: error
          retention-days: 7

# Feature-branch trigger is intentionally scoped to P23 source discovery.
# The expensive 291-detail-page Form 34B manifest crawl is deliberately excluded
# from routine pushes because the official portal intermittently throttles/TLS-times out.
