name: P23 IEBC Form 34B probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p23-iebc-form34b-probe.yml
      - data/p23/constituency-turnout-readiness-contract.json
      - data/p23/form34b-source-index-contract.json
      - data/p23/form34b-ocr-feasibility-contract.json
      - data/p23/form34b-extraction-contract.json
      - data/p23/form34b-sample-page-layout-contract.json
      - scripts/p23/probe-iebc-form34b.sh
      - scripts/p23/probe-iebc-form34b-download.sh
      - scripts/p23/probe-iebc-form34b-download-all.sh
      - scripts/p23/probe-iebc-form34b-ocr.sh
      - scripts/p23/probe-form34b-rejected-cell-candidates.py
      - scripts/p23/render-form34b-page-contexts.py
      - scripts/p23/validate-form34b-sample-page-layout.mjs
      - scripts/p23/assess-form34b-field-labels.py
      - scripts/p23/assess-form34b-column-layout.py
      - scripts/p23/discover-iebc-form34b-manifest.py
      - scripts/p23/build-form34b-extraction-queue.mjs
      - scripts/p23/validate-form34b-extraction-queue.mjs
      - scripts/p23/validate-constituency-turnout-readiness.mjs
      - scripts/p23/validate-iebc-form34b-source-manifest.mjs
      - scripts/p23/validate-form34b-ocr-feasibility.mjs
      - scripts/p23/validate-form34b-extraction-contract.mjs
  pull_request:
    paths:
      - .github/workflows/p23-iebc-form34b-probe.yml
      - data/p23/constituency-turnout-readiness-contract.json
      - data/p23/form34b-source-index-contract.json
      - data/p23/form34b-ocr-feasibility-contract.json
      - data/p23/form34b-extraction-contract.json
      - data/p23/form34b-sample-page-layout-contract.json
      - scripts/p23/probe-iebc-form34b.sh
      - scripts/p23/probe-iebc-form34b-download.sh
      - scripts/p23/probe-iebc-form34b-download-all.sh
      - scripts/p23/probe-iebc-form34b-ocr.sh
      - scripts/p23/probe-form34b-rejected-cell-candidates.py
      - scripts/p23/render-form34b-page-contexts.py
      - scripts/p23/validate-form34b-sample-page-layout.mjs
      - scripts/p23/assess-form34b-field-labels.py
      - scripts/p23/assess-form34b-column-layout.py
      - scripts/p23/discover-iebc-form34b-manifest.py
      - scripts/p23/build-form34b-extraction-queue.mjs
      - scripts/p23/validate-form34b-extraction-queue.mjs
      - scripts/p23/validate-constituency-turnout-readiness.mjs
      - scripts/p23/validate-iebc-form34b-source-manifest.mjs
      - scripts/p23/validate-form34b-ocr-feasibility.mjs
      - scripts/p23/validate-form34b-extraction-contract.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraction-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate turnout and field-extraction governance
        run: node scripts/p23/validate-constituency-turnout-readiness.mjs && node scripts/p23/validate-form34b-extraction-contract.mjs
      - name: Build unresolved 290-row extraction queue
        run: node scripts/p23/build-form34b-extraction-queue.mjs /tmp/p23-form34b-extraction-queue.json
      - name: Validate extraction queue no-value gate
        run: node scripts/p23/validate-form34b-extraction-queue.mjs /tmp/p23-form34b-extraction-queue.json
      - name: Upload extraction work queue
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-extraction-queue
          path: /tmp/p23-form34b-extraction-queue.json
          if-no-files-found: error
          retention-days: 7

  source-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed turnout readiness contract
        run: node scripts/p23/validate-constituency-turnout-readiness.mjs
      - name: Validate field-level extraction governance
        run: node scripts/p23/validate-form34b-extraction-contract.mjs
      - name: Probe official IEBC 2022 result-form portal
        run: bash scripts/p23/probe-iebc-form34b.sh
      - name: Probe official Form 34B bulk-download transport
        run: bash scripts/p23/probe-iebc-form34b-download-all.sh
      - name: Discover official Form 34B source manifest
        run: python3 scripts/p23/discover-iebc-form34b-manifest.py --output /tmp/iebc-2022-form34b-source-manifest.json
      - name: Validate source-reference manifest boundary
        run: node scripts/p23/validate-iebc-form34b-source-manifest.mjs /tmp/iebc-2022-form34b-source-manifest.json
      - name: Upload source-reference manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-source-manifest
          path: /tmp/iebc-2022-form34b-source-manifest.json
          if-no-files-found: error
          retention-days: 7

  sample-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate OCR extraction and page-layout contracts
        run: node scripts/p23/validate-form34b-ocr-feasibility.mjs && node scripts/p23/validate-form34b-extraction-contract.mjs && node scripts/p23/validate-form34b-sample-page-layout.mjs
      - name: Install deterministic PDF and OCR inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Probe Form 34B download transport and text layer
        run: bash scripts/p23/probe-iebc-form34b-download.sh
      - name: Run governed sample-only OCR feasibility gate
        run: bash scripts/p23/probe-iebc-form34b-ocr.sh
      - name: Render all governed Form 34B page contexts
        run: python3 scripts/p23/render-form34b-page-contexts.py --manifest /tmp/p23-form34b-page-contexts.json --output-dir /tmp/p23-form34b-page-contexts
      - name: Upload multi-page source context
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-page-contexts
          path: |
            /tmp/p23-form34b-page-contexts.json
            /tmp/p23-form34b-page-contexts/*.png
          if-no-files-found: error
          retention-days: 2
      - name: Build rejected-ballot cell machine candidates
        run: python3 scripts/p23/probe-form34b-rejected-cell-candidates.py --output /tmp/p23-form34b-rejected-cell-candidates.json --context /tmp/iebc-form34b-rejected-context-page1.png
      - name: Upload rejected-ballot candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-rejected-cell-candidates
          path: |
            /tmp/p23-form34b-rejected-cell-candidates.json
            /tmp/iebc-form34b-rejected-context-page1.png
          if-no-files-found: error
          retention-days: 2
      - name: Assess target field-label coverage without values
        run: python3 scripts/p23/assess-form34b-field-labels.py /tmp/iebc-form34b-ocr.tsv /tmp/iebc-form34b-labels-page1.tsv
      - name: Assess target column geometry without values
        run: python3 scripts/p23/assess-form34b-column-layout.py /tmp/iebc-form34b-ocr.tsv /tmp/iebc-form34b-labels-page1.tsv --numeric-density-tsv /tmp/iebc-form34b-labels-page1-raw.tsv --numeric-density-tsv /tmp/iebc-form34b-numeric-page1-raw.tsv --numeric-density-tsv /tmp/iebc-form34b-numeric-page1-psm6-raw.tsv
