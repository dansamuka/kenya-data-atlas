name: P20 audit opinion branch generator

on:
  push:
    branches: [p20-audit-opinion-promotion]
    paths:
      - '.github/workflows/p20-audit-opinion-generator.yml'
      - 'scripts/p20/promote-audit-opinion.mjs'
      - 'scripts/p20/build-audit-opinion.mjs'
      - 'scripts/p20/validate-audit-opinion.mjs'

permissions:
  contents: write

concurrency:
  group: p20-audit-opinion-promotion
  cancel-in-progress: false

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out promotion branch
        uses: actions/checkout@v4
        with:
          ref: p20-audit-opinion-promotion
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check shapely

      - name: Apply reviewed P20 audit promotion
        run: |
          node scripts/p20/promote-audit-opinion.mjs
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/countyiq/source/p10-fiscal-accountability-2024-25.json';
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          doc.audit_context_2023_24.exact_qualified_geo_codes_from_indexed_appendix_extract = [...doc.audit_context_2023_24.qualified_geo_codes];
          doc.audit_context_2023_24.compatibility_note = 'Legacy P10 field retained as an alias to the complete 47-county primary Appendix 1(a) verification.';
          fs.writeFileSync(file, JSON.stringify(doc, null, 2) + '\n');
          console.log('P20_AUDIT_P10_COMPAT_OK qualified=47');
          NODE

      - name: Rebuild all published Atlas products
        run: npm run build:data

      - name: Run full Atlas validation suite
        run: npm test

      - name: Run independent geometry audit
        run: npm run geography:audit

      - name: Commit implementation and deterministic generated products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No P20 audit promotion changes were produced.'
            exit 0
          fi
          git commit -m 'feat(p20): promote 47 county audit opinions'
          git push origin HEAD:p20-audit-opinion-promotion
