name: Debug Sprint 3 CoB layouts

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - .github/workflows/sprint3-debug-cob.yml
  workflow_dispatch:

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fy: '2020/21', county: 'Bungoma' }
          - { fy: '2021/22', county: 'Baringo' }
          - { fy: '2022/23', county: 'Baringo' }
          - { fy: '2023/24', county: 'Baringo' }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pdfplumber pandas
      - name: Inspect official county section
        env:
          FY: ${{ matrix.fy }}
          COUNTY: ${{ matrix.county }}
        run: |
          python scripts/sprint3/harden_acquisition_v14.py
          python - <<'PY'
          import io, os, re, sys
          sys.path.insert(0,'scripts/sprint3')
          import acquire_cob_history as cob
          import pdfplumber
          fy=os.environ['FY']; county=os.environ['COUNTY']
          session=cob.requests.Session(); session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/138.0','Accept':'*/*'})
          url,content=cob._discover_pdf(session,cob.COB_PAGES[fy],fy)
          with pdfplumber.open(io.BytesIO(content)) as pdf:
              texts=[p.extract_text(x_tolerance=2,y_tolerance=3) or '' for p in pdf.pages]
              variants=cob.COUNTY_VARIANTS.get(county,[county])
              page_i=cob._find_section(texts,variants)
              print('SOURCE',fy,county,'page',page_i+1,url)
              for pi in range(page_i,min(page_i+6,len(pdf.pages))):
                  print(f'--- PAGE {pi+1} TEXT HITS ---')
                  lines=[cob._norm(x) for x in texts[pi].splitlines() if cob._norm(x)]
                  for line in lines:
                      low=line.lower()
                      if any(k in low for k in ['budget','expenditure','absorption','development','economic classification','total']):
                          print(line[:1200])
                  print(f'--- PAGE {pi+1} TABLE ROWS ---')
                  for ti,table in enumerate(pdf.pages[pi].extract_tables() or []):
                      for row in table or []:
                          cells=[cob._norm(c or '') for c in row or []]
                          joined=' | '.join(cells)
                          low=joined.lower()
                          if any(k in low for k in ['development','total','expenditure','budget','absorption']):
                              print('T',ti,joined[:1600])
          PY
