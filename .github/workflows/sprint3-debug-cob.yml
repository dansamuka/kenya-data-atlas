name: Debug Sprint 3 generated parser

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - .github/workflows/sprint3-debug-cob.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml html5lib pdfplumber pandas
      - name: Inspect generated v21 parser
        run: |
          python scripts/sprint3/harden_acquisition_v21.py
          python - <<'PY'
          import inspect, sys
          sys.path.insert(0,'scripts/sprint3')
          import acquire_cob_history as cob
          print('--- EXTRACT NARRATIVE ---')
          print(inspect.getsource(cob._extract_narrative))
          print('--- ECONOMIC CLASSIFICATION ---')
          print(inspect.getsource(cob._economic_classification_values))
          PY
