name: Verify Sprint 3 Wajir FY2022-23

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - .github/workflows/sprint3-debug-cob.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml html5lib pdfplumber pandas
      - name: Verify official Wajir values
        run: |
          python scripts/sprint3/harden_acquisition_v26.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts/sprint3')
          import acquire_cob_history as cob
          fy='2022/23'; county='Wajir'
          session=cob.requests.Session(); session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/138.0','Accept':'*/*'})
          url,content=cob._discover_pdf(session,cob.COB_PAGES[fy],fy)
          values=cob._parse_narrative_year(content,fy,[county])
          value=values[county]
          print('SOURCE',url)
          print('WAJIR',value)
          budget=float(value['budget_total_ksh_mn'])
          spend=float(value['expenditure_total_ksh_mn'])
          overall=float(value['overall_absorption_pct'])
          development=float(value['development_absorption_pct'])
          assert 11200 <= budget <= 11260, value
          assert 10200 <= spend <= 10260, value
          assert 88 <= overall <= 94, value
          assert abs(development - 76.5) <= 0.1, value
          assert abs(spend / budget * 100 - overall) <= 5.0, value
          print('WAJIR V26 PASS')
          PY
