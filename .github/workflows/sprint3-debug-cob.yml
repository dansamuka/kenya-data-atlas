name: Verify Sprint 3 FY2022-23 full gate

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - .github/workflows/sprint3-debug-cob.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml html5lib pdfplumber pandas
      - name: Verify all 47 counties for FY2022-23
        run: |
          python scripts/sprint3/harden_acquisition_v27.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'scripts/sprint3')
          import acquire_cob_history as cob
          fy='2022/23'
          geos=json.loads(Path('data/geography/registry/geographies.json').read_text())
          counties=[g['name'] for g in geos if g.get('level')=='county']
          session=cob.requests.Session(); session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/138.0','Accept':'*/*'})
          url,content=cob._discover_pdf(session,cob.COB_PAGES[fy],fy)
          values=cob._parse_narrative_year(content,fy,counties)
          cob._validate_year(fy,values,counties)
          assert len(values)==47, len(values)
          for county in ('Trans Nzoia','Wajir'):
              print(county,values[county])
          print('FY2022/23 V27 FULL PASS',len(values),url)
          PY
