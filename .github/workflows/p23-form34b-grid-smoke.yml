name: P23 Form 34B grid smoke

on:
  pull_request:
    paths:
      - .github/workflows/p23-form34b-grid-smoke.yml
      - scripts/p23/probe-form34b-grid-smoke.py
      - scripts/p23/probe-form34b-adaptive-grid-smoke.py
      - scripts/p23/probe-form34b-denominator-anchor-smoke.py
      - scripts/p23/materialize-form34b-source-manifest.py
      - scripts/p23/validate-form34b-grid-smoke.mjs
      - scripts/p23/validate-form34b-denominator-anchor-smoke.mjs
      - scripts/p23/probe-form34b-total-row-candidates.py
      - scripts/p23/validate-iebc-form34b-source-manifest.mjs
      - data/p23/form34b-source-index-contract.json
      - data/p23/form34b-extraction-contract.json
      - data/p23/constituency-turnout-readiness-contract.json
      - data/indicators/registry/series.json
      - data/indicators/registry/observations.json
  push:
    branches: [main]
    paths:
      - .github/workflows/p23-form34b-grid-smoke.yml
      - scripts/p23/probe-form34b-grid-smoke.py
      - scripts/p23/probe-form34b-adaptive-grid-smoke.py
      - scripts/p23/probe-form34b-denominator-anchor-smoke.py
      - scripts/p23/materialize-form34b-source-manifest.py
      - scripts/p23/validate-form34b-grid-smoke.mjs
      - scripts/p23/validate-form34b-denominator-anchor-smoke.mjs
      - scripts/p23/probe-form34b-total-row-candidates.py
      - scripts/p23/validate-iebc-form34b-source-manifest.mjs
      - data/p23/form34b-source-index-contract.json
      - data/p23/form34b-extraction-contract.json
      - data/p23/constituency-turnout-readiness-contract.json
      - data/indicators/registry/series.json
      - data/indicators/registry/observations.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p23-form34b-grid-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  twenty-five-form-source-review-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate P23 source and extraction governance
        run: node scripts/p23/validate-form34b-extraction-contract.mjs
      - name: Install deterministic PDF, OCR and vector tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-numpy
      - name: Materialize verified IEBC Form 34B locator manifest
        run: python3 scripts/p23/materialize-form34b-source-manifest.py --output /tmp/iebc-2022-form34b-source-manifest.json
      - name: Validate source-reference manifest boundary
        run: node scripts/p23/validate-iebc-form34b-source-manifest.mjs /tmp/iebc-2022-form34b-source-manifest.json
      - name: Run governed 25-form adaptive source-grid diagnostic
        run: python3 scripts/p23/probe-form34b-adaptive-grid-smoke.py --manifest /tmp/iebc-2022-form34b-source-manifest.json --limit 25 --output /tmp/p23-form34b-grid-smoke.json
      - name: Validate adaptive no-promotion boundary and Changamwe anchor
        run: node scripts/p23/validate-form34b-grid-smoke.mjs /tmp/p23-form34b-grid-smoke.json
      - name: Run exact-denominator source-review locator diagnostic for rows 26-50
        run: python3 scripts/p23/probe-form34b-denominator-anchor-smoke.py --manifest /tmp/iebc-2022-form34b-source-manifest.json --offset 25 --limit 25 --output /tmp/p23-form34b-denominator-anchor-smoke.json --context-dir /tmp/p23-form34b-denominator-contexts
      - name: Validate denominator-locator no-promotion boundary
        run: node scripts/p23/validate-form34b-denominator-anchor-smoke.mjs /tmp/p23-form34b-denominator-anchor-smoke.json
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-source-review-diagnostics
          path: |
            /tmp/p23-form34b-grid-smoke.json
            /tmp/p23-form34b-denominator-anchor-smoke.json
            /tmp/p23-form34b-denominator-contexts/
          if-no-files-found: error
          retention-days: 3
