name: P23 Form 34B grid smoke

on:
  pull_request:
    paths:
      - .github/workflows/p23-form34b-grid-smoke.yml
      - scripts/p23/probe-form34b-grid-smoke.py
      - scripts/p23/probe-form34b-adaptive-grid-smoke.py
      - scripts/p23/probe-form34b-adaptive-grid-batch.py
      - scripts/p23/aggregate-form34b-adaptive-grid-batches.py
      - scripts/p23/render-form34b-verification-contexts.py
      - scripts/p23/probe-form34b-denominator-anchor-smoke.py
      - scripts/p23/materialize-form34b-source-manifest.py
      - scripts/p23/validate-form34b-grid-smoke.mjs
      - scripts/p23/validate-form34b-adaptive-grid-batch.mjs
      - scripts/p23/validate-form34b-candidate-audit.mjs
      - scripts/p23/validate-form34b-verification-contexts.mjs
      - scripts/p23/validate-form34b-denominator-anchor-smoke.mjs
      - scripts/p23/probe-form34b-total-row-candidates.py
      - scripts/p23/validate-iebc-form34b-source-manifest.mjs
      - data/p23/form34b-source-index-contract.json
      - data/p23/form34b-extraction-contract.json
      - data/p23/constituency-turnout-readiness-contract.json
      - data/indicators/registry/series.json
      - data/indicators/registry/observations.json
  push:
    branches: [main]
    paths:
      - .github/workflows/p23-form34b-grid-smoke.yml
      - scripts/p23/probe-form34b-grid-smoke.py
      - scripts/p23/probe-form34b-adaptive-grid-smoke.py
      - scripts/p23/probe-form34b-adaptive-grid-batch.py
      - scripts/p23/aggregate-form34b-adaptive-grid-batches.py
      - scripts/p23/render-form34b-verification-contexts.py
      - scripts/p23/probe-form34b-denominator-anchor-smoke.py
      - scripts/p23/materialize-form34b-source-manifest.py
      - scripts/p23/validate-form34b-grid-smoke.mjs
      - scripts/p23/validate-form34b-adaptive-grid-batch.mjs
      - scripts/p23/validate-form34b-candidate-audit.mjs
      - scripts/p23/validate-form34b-verification-contexts.mjs
      - scripts/p23/validate-form34b-denominator-anchor-smoke.mjs
      - scripts/p23/probe-form34b-total-row-candidates.py
      - scripts/p23/validate-iebc-form34b-source-manifest.mjs
      - data/p23/form34b-source-index-contract.json
      - data/p23/form34b-extraction-contract.json
      - data/p23/constituency-turnout-readiness-contract.json
      - data/indicators/registry/series.json
      - data/indicators/registry/observations.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p23-form34b-grid-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governed-source-review-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate P23 source and extraction governance
        run: node scripts/p23/validate-form34b-extraction-contract.mjs
      - name: Install deterministic PDF, OCR and vector tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-numpy
      - name: Materialize verified IEBC Form 34B locator manifest
        run: python3 scripts/p23/materialize-form34b-source-manifest.py --output /tmp/iebc-2022-form34b-source-manifest.json
      - name: Validate source-reference manifest boundary
        run: node scripts/p23/validate-iebc-form34b-source-manifest.mjs /tmp/iebc-2022-form34b-source-manifest.json
      - name: Run governed 25-form adaptive source-grid diagnostic
        run: python3 scripts/p23/probe-form34b-adaptive-grid-smoke.py --manifest /tmp/iebc-2022-form34b-source-manifest.json --limit 25 --output /tmp/p23-form34b-grid-smoke.json
      - name: Validate adaptive no-promotion boundary and Changamwe anchor
        run: node scripts/p23/validate-form34b-grid-smoke.mjs /tmp/p23-form34b-grid-smoke.json
      - name: Upload baseline diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-source-review-baseline
          path: /tmp/p23-form34b-grid-smoke.json
          if-no-files-found: error
          retention-days: 3

  adaptive-total-row-candidate-review:
    name: Candidate extraction ${{ matrix.range }}
    needs: governed-source-review-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - range: rows-001-025
            offset: 0
            limit: 25
          - range: rows-026-050
            offset: 25
            limit: 25
          - range: rows-051-075
            offset: 50
            limit: 25
          - range: rows-076-100
            offset: 75
            limit: 25
          - range: rows-101-125
            offset: 100
            limit: 25
          - range: rows-126-150
            offset: 125
            limit: 25
          - range: rows-151-175
            offset: 150
            limit: 25
          - range: rows-176-200
            offset: 175
            limit: 25
          - range: rows-201-225
            offset: 200
            limit: 25
          - range: rows-226-250
            offset: 225
            limit: 25
          - range: rows-251-275
            offset: 250
            limit: 25
          - range: rows-276-290
            offset: 275
            limit: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate P23 source and extraction governance
        run: node scripts/p23/validate-form34b-extraction-contract.mjs
      - name: Install deterministic PDF, OCR and vector tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-numpy
      - name: Materialize verified IEBC Form 34B locator manifest
        run: python3 scripts/p23/materialize-form34b-source-manifest.py --output /tmp/iebc-2022-form34b-source-manifest.json
      - name: Validate source-reference manifest boundary
        run: node scripts/p23/validate-iebc-form34b-source-manifest.mjs /tmp/iebc-2022-form34b-source-manifest.json
      - name: Run governed adaptive machine-candidate extraction for ${{ matrix.range }}
        run: python3 scripts/p23/probe-form34b-adaptive-grid-batch.py --manifest /tmp/iebc-2022-form34b-source-manifest.json --offset ${{ matrix.offset }} --limit ${{ matrix.limit }} --output /tmp/p23-form34b-adaptive-grid-${{ matrix.range }}.json
      - name: Validate machine-candidate no-promotion boundary
        run: node scripts/p23/validate-form34b-adaptive-grid-batch.mjs /tmp/p23-form34b-adaptive-grid-${{ matrix.range }}.json
      - name: Upload candidate diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-candidates-${{ matrix.range }}
          path: /tmp/p23-form34b-adaptive-grid-${{ matrix.range }}.json
          if-no-files-found: error
          retention-days: 3

  aggregate-candidate-audit:
    name: Aggregate 290-row candidate audit
    needs: adaptive-total-row-candidate-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all candidate shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p23-form34b-candidates-*
          path: /tmp/p23-form34b-candidate-shards
          merge-multiple: true
      - name: Build 290-row candidate audit and source-verification queue
        run: python3 scripts/p23/aggregate-form34b-adaptive-grid-batches.py --input-dir /tmp/p23-form34b-candidate-shards --aggregate-output /tmp/p23-form34b-candidate-audit.json --queue-output /tmp/p23-form34b-source-verification-queue.json
      - name: Validate aggregate no-promotion and queue boundary
        run: node scripts/p23/validate-form34b-candidate-audit.mjs /tmp/p23-form34b-candidate-audit.json /tmp/p23-form34b-source-verification-queue.json
      - name: Upload candidate audit and source-verification queue
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-candidate-audit-and-verification-queue
          path: |
            /tmp/p23-form34b-candidate-audit.json
            /tmp/p23-form34b-source-verification-queue.json
          if-no-files-found: error
          retention-days: 7

  render-source-verification-contexts:
    name: Render pending source-verification contexts
    needs: aggregate-candidate-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate P23 source and extraction governance
        run: node scripts/p23/validate-form34b-extraction-contract.mjs
      - name: Install deterministic PDF, OCR and vector tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-numpy
      - name: Download candidate audit and source-verification queue
        uses: actions/download-artifact@v4
        with:
          name: p23-form34b-candidate-audit-and-verification-queue
          path: /tmp/p23-form34b-audit
      - name: Render official review contexts and reproduce candidate readings
        run: python3 scripts/p23/render-form34b-verification-contexts.py --queue /tmp/p23-form34b-audit/p23-form34b-source-verification-queue.json --output-dir /tmp/p23-form34b-verification-contexts --manifest /tmp/p23-form34b-verification-contexts.json
      - name: Validate context no-promotion and review boundary
        run: node scripts/p23/validate-form34b-verification-contexts.mjs /tmp/p23-form34b-verification-contexts.json /tmp/p23-form34b-audit/p23-form34b-source-verification-queue.json /tmp/p23-form34b-verification-contexts
      - name: Upload source-image review packet
        uses: actions/upload-artifact@v4
        with:
          name: p23-form34b-source-verification-contexts
          path: |
            /tmp/p23-form34b-verification-contexts.json
            /tmp/p23-form34b-verification-contexts/*.png
          if-no-files-found: error
          retention-days: 7
