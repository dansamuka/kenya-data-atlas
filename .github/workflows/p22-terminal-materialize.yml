name: P22 terminal evidence materialization

# One-shot terminal generator; rerun after extending the completeness validator
# and scoping the P20 unavailable invariant to P20-owned closure families.
on:
  push:
    branches:
      - p22-terminal-evidence-closure
    paths:
      - .github/workflows/p22-terminal-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply governed P22 terminal evidence closures
        run: npm run p22:prepare

      - name: Rebuild all governed data products
        run: npm run build:data

      - name: Validate full repository
        run: npm test

      - name: Validate exact P22 terminal state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const s=j('data/completeness/summary.json');
          const q=j('data/completeness/p22-work-queue.json');
          const r=j('data/data-completion-roadmap.json');
          const e=j('data/completeness/evidence-states.json');
          const fail=m=>{throw new Error(m)};
          if(s.total_slots!==20115)fail(`total_slots=${s.total_slots}`);
          if(s.resolved_slots!==3874)fail(`resolved_slots=${s.resolved_slots}`);
          if(s.unresolved_slots!==16241)fail(`unresolved_slots=${s.unresolved_slots}`);
          if(s.resolved_pct!==19.26)fail(`resolved_pct=${s.resolved_pct}`);
          if(s.unknown_missing!==0)fail(`unknown_missing=${s.unknown_missing}`);
          if((s.by_completion_phase?.P22||0)!==0)fail(`P22=${s.by_completion_phase?.P22}`);
          if(s.by_status?.official_unavailable!==114)fail(`official_unavailable=${s.by_status?.official_unavailable}`);
          if(q.remaining_slots!==0||q.family_count!==0)fail(`queue slots=${q.remaining_slots} families=${q.family_count}`);
          const p22=(r.phases||[]).find(x=>x.id==='P22');
          if(p22?.status!=='complete'||p22?.progress?.resolved_total!==66||p22?.progress?.remaining_slots!==0)fail(`roadmap=${JSON.stringify(p22?.progress)}`);
          const codes=['IND-DROUGHT-EARLY-WARNING','IND-FOOD-SECURITY-PHASE','IND-RAINFALL-TEMPERATURE'];
          for(const code of codes){
            const state=(e.states||[]).find(x=>x.indicator_code===code&&x.status==='official_unavailable');
            if(!state||state.geo_codes?.length!==22)fail(`${code} closure missing or width=${state?.geo_codes?.length}`);
          }
          console.log('P22_TERMINAL_TARGET_OK resolved=3874 unresolved=16241 p22=0 evidence_constrained=66 next=P23');
          NODE

      - name: Commit governed outputs and remove one-shot workflow
        run: |
          rm .github/workflows/p22-terminal-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'P22: complete ASAL resilience snapshot with governed evidence closures'
            git push
          fi
