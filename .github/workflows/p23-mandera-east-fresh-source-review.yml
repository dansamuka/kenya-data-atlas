name: P23 Mandera East fresh source review

on:
  pull_request:
    paths:
      - data/p23/form34b-mandera-east-fresh-source-review.json
      - scripts/p23/validate-mandera-east-fresh-source-review.mjs
      - .github/workflows/p23-mandera-east-fresh-source-review.yml
  push:
    branches: [main]
    paths:
      - data/p23/form34b-mandera-east-fresh-source-review.json
      - scripts/p23/validate-mandera-east-fresh-source-review.mjs
      - .github/workflows/p23-mandera-east-fresh-source-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mandera-east-fresh-source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate fresh exactly-250-DPI Mandera East review and no-promotion state
        run: node scripts/p23/validate-mandera-east-fresh-source-review.mjs data/p23/form34b-mandera-east-fresh-source-review.json
