name: P22 NDMA freshness governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-ndma-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate P22 ASAL eligibility and NDMA freshness inventory
        run: node scripts/p22/validate-ndma-freshness.mjs
