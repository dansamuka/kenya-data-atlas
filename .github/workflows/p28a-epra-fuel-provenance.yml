name: P28A EPRA fuel provenance

on:
  pull_request:
    paths:
      - 'data/sprint1/sources.json'
      - 'data/sprint1/fuel-super-petrol-2026-08.csv'
      - 'scripts/sprint1/build-native.mjs'
      - 'scripts/p28/validate-epra-fuel-provenance.mjs'
      - 'data/catalogue/registry/**'
      - 'data/indicators/registry/**'
      - 'data/audit/legacy-*'
      - '.github/workflows/p28a-epra-fuel-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'data/sprint1/sources.json'
      - 'data/sprint1/fuel-super-petrol-2026-08.csv'
      - 'scripts/sprint1/build-native.mjs'
      - 'scripts/p28/validate-epra-fuel-provenance.mjs'
      - 'data/catalogue/registry/**'
      - 'data/indicators/registry/**'
      - 'data/audit/legacy-*'
      - '.github/workflows/p28a-epra-fuel-provenance.yml'

permissions:
  contents: write

jobs:
  epra-fuel-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild canonical catalogue and indicator registries
        run: |
          npm run catalogue:build
          npm run indicators:build

      - name: Validate official EPRA pricing-town proxy provenance
        run: node scripts/p28/validate-epra-fuel-provenance.mjs

      - name: Rebuild and validate P28A audit
        run: |
          node scripts/p28/build-legacy-source-audit.mjs
          node scripts/p28/validate-legacy-source-audit.mjs

      - name: Enforce remediation delta
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('data/audit/legacy-source-tier-summary.json','utf8'));
          const failures=[];
          if(s.preferred_observations_in_scope!==6007) failures.push(`preferred observations changed: ${s.preferred_observations_in_scope}`);
          if(s.secondary_preferred_observation_count!==0) failures.push(`secondary preferred observations remain: ${s.secondary_preferred_observation_count}`);
          if(s.secondary_explicit_relabel_queue_count!==0) failures.push(`secondary relabel queue remains: ${s.secondary_explicit_relabel_queue_count}`);
          if(s.source_tier_counts?.S2_secondary_verified_to_identifiable_primary!==0) failures.push(`S2 count is ${s.source_tier_counts?.S2_secondary_verified_to_identifiable_primary}`);
          if(s.source_tier_counts?.S1_derived_from_primary_official!==577) failures.push(`expected S1 count 577, got ${s.source_tier_counts?.S1_derived_from_primary_official}`);
          if(s.manual_review_count!==3781) failures.push(`expected manual review count 3781, got ${s.manual_review_count}`);
          if(failures.length){console.error('FAIL: EPRA P28A remediation delta\n - '+failures.join('\n - '));process.exit(1);}
          console.log('PASS: 45 legacy secondary EPRA observations moved to S1 official proxy provenance.');
          console.log('      S2: 45 -> 0; S1: 532 -> 577; manual review: 3826 -> 3781.');
          NODE

      - name: Materialize deterministic remediation outputs onto PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add data/catalogue/registry data/indicators/registry data/audit/legacy-*
          if git diff --cached --quiet; then
            echo 'Generated EPRA remediation outputs already match the committed branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'P28A: materialize EPRA fuel provenance remediation'
          git push origin HEAD:${{ github.head_ref }}

      - name: Re-run deterministic zero-drift check
        run: |
          npm run catalogue:build
          npm run indicators:build
          node scripts/p28/validate-epra-fuel-provenance.mjs
          node scripts/p28/build-legacy-source-audit.mjs
          node scripts/p28/validate-legacy-source-audit.mjs
          git diff --exit-code -- data/catalogue/registry data/indicators/registry data/audit/legacy-*

      - name: Show P28A summary
        run: cat data/audit/legacy-source-tier-summary.json
