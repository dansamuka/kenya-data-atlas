name: P39 repository cleanup

# Manual only, and scoped to exactly the P38-authorised actions:
#   - cleanup-branches-dry-run / cleanup-branches-execute: re-verifies the P38 first-cleanup-batch
#     against LIVE branch/PR state immediately before any deletion decision, then reports or
#     deletes accordingly. Dispatch mode keeps this a human-triggered, auditable Actions run
#     rather than an unreviewed local execution.
#
# There is no archive-workflows action here: the default GITHUB_TOKEN can never push changes to
# files under .github/workflows/ (a hardcoded GitHub anti-escalation restriction -- see the
# permissions block below), so that half of P39 (narrowing historical_one_off workflow triggers to
# workflow_dispatch-only) was applied directly instead; see scripts/p39/workflow-archival-planner.mjs
# and data/p39/workflow-archival-report.json for how and what.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Which P39 action to run (archive-workflows is NOT here: the default GITHUB_TOKEN can never push to .github/workflows/, so that action cannot run inside CI -- see scripts/p39/archive-historical-workflows.mjs)'
        required: true
        type: choice
        options:
          - cleanup-branches-dry-run
          - cleanup-branches-execute

permissions:
  contents: write
  pull-requests: read
  # NOTE: the default GITHUB_TOKEN can NEVER push changes to files under .github/workflows/,
  # regardless of any permissions requested here -- this is a hardcoded GitHub anti-escalation
  # restriction (confirmed by a real rejected push, run 35587681353, 2026-09-21: "refusing to
  # allow a GitHub App to create or update workflow ... without workflows permission"; a follow-up
  # attempt to request a "workflows" key here was itself rejected as invalid YAML -- that scope
  # does not exist in this block's schema at all). The archive-workflows action therefore never
  # commits from inside this job; see scripts/p39/archive-historical-workflows.mjs's own docs for
  # how that half of P39 is actually executed.

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate P39 contract
        run: node --test tests/p39/branch-cleanup-planner.spec.mjs tests/p39/workflow-archival-planner.spec.mjs

      - name: Branch cleanup (dry run)
        if: inputs.action == 'cleanup-branches-dry-run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/p39/execute-branch-cleanup.mjs

      - name: Branch cleanup (execute)
        if: inputs.action == 'cleanup-branches-execute'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/p39/execute-branch-cleanup.mjs --execute

      - name: Validate branch cleanup report
        if: inputs.action == 'cleanup-branches-dry-run' || inputs.action == 'cleanup-branches-execute'
        run: node scripts/p39/validate-branch-cleanup.mjs

      - name: Commit refreshed P39 reports
        run: |
          git add data/p39
          if git diff --cached --quiet; then
            echo 'No P39 report changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "P39: refresh ${{ inputs.action }} report"
          git push origin HEAD:main
