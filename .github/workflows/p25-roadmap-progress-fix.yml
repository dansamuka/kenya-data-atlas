name: P25 roadmap progress fix

on:
  push:
    branches:
      - watchdog/p25-mobile-money-semantic-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watchdog/p25-mobile-money-semantic-fix
          fetch-depth: 0
      - name: Record corrected P25 progress metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'data/data-completion-roadmap.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          const p25 = (r.phases || []).find(x => x.id === 'P25');
          if (!p25) throw new Error('P25 roadmap entry missing');
          p25.status = 'in_progress';
          p25.progress = {
            session_note: 'P25 implementation resolves the final national slot with the Central Bank of Kenya National Payments System Mobile Payments table using the published agent cash-in/cash-out transaction-volume column, converted exactly from millions of transactions to transaction count. Monetary CICO value is retained only as source context and is not relabelled as volume. Compare, Rankings, CountyIQ, Evidence Hub, Opportunity Finder and place-profile null states were audited; CountyIQ and Opportunity Finder required targeted fixes while the other audited surfaces were already explicit about missing/empty states.',
            mobile_money_slot_resolved: true,
            semantic_definition: 'CBK agent CICO transaction count; not monetary value and not a reconciled total across every mobile-money rail',
            ui_surfaces_audited: ['compare','rankings','countyiq','evidence-hub','opportunity-finder','place-profile'],
            ui_surfaces_fixed: ['countyiq','opportunity-finder'],
            ui_surfaces_already_correct: ['compare','rankings','evidence-hub','place-profile'],
            phase_closure_note: 'P24 has reached zero on the canonical completeness ledger. P25 is marked in_progress here until the corrected mobile-money build and full Atlas validation commit successfully; the final P25 reducer may then close the phase.'
          };
          fs.writeFileSync(p, JSON.stringify(r, null, 2) + '\n');
          NODE
      - name: Commit metadata and remove helper
        run: |
          rm -f .github/workflows/p25-roadmap-progress-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P25: record corrected national-slot progress metadata'
          git push origin HEAD:watchdog/p25-mobile-money-semantic-fix
