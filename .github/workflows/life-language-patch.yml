name: Apply lived-experience comparison language

on:
  push:
    branches:
      - feature/life-elsewhere-lived-experience
    paths:
      - .github/workflows/life-language-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch comparison language
        run: python scripts/patch-life-language.py
      - name: Syntax check
        run: node --check assets/compare.js
      - name: Commit language update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/compare.js
          git commit -m "refine(compare): deepen lived-experience phrasing"
          git push origin HEAD:feature/life-elsewhere-lived-experience
