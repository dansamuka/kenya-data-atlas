name: Data completion execution governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-execution-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate phase authority and parallel execution overlay
        run: node scripts/project/validate-data-completion-execution.mjs
      - name: Validate P22 NDMA eligibility and freshness contract
        run: node scripts/p22/validate-ndma-freshness.mjs
