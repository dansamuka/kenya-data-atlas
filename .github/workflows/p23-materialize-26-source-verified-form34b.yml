name: P23 materialize 26 source-verified Form 34B rows

on:
  push:
    branches:
      - watchdog/p23-materialize-26-source-verified-form34b
    paths:
      - .github/workflows/p23-materialize-26-source-verified-form34b.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p23-materialize-26-source-verified-form34b
  cancel-in-progress: false

jobs:
  atomic-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@v4
        with:
          ref: watchdog/p23-materialize-26-source-verified-form34b
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Authorize exactly the 26 pending source-verified rows
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
            20: ('form34b-bura-source-verification.json', 'KEN-C004-CON020', (45678, 29683, 218)),
            28: ('form34b-balambala-source-verification.json', 'KEN-C007-CON028', (26085, 13653, 76)),
            38: ('form34b-wajir-south-source-verification.json', 'KEN-C008-CON038', (58077, 34814, 321)),
            71: ('form34b-kitui-rural-source-verification.json', 'KEN-C015-CON071', (55000, 32820, 334)),
            73: ('form34b-kitui-east-source-verification.json', 'KEN-C015-CON073', (65377, 42637, 322)),
            74: ('form34b-kitui-south-source-verification.json', 'KEN-C015-CON074', (75372, 46725, 352)),
            95: ('form34b-kieni-source-verification.json', 'KEN-C019-CON095', (114573, 74861, 573)),
            104: ('form34b-kangema-source-verification.json', 'KEN-C021-CON104', (52002, 34965, 266)),
            126: ('form34b-loima-source-verification.json', 'KEN-C023-CON126', (36515, 21160, 74)),
            141: ('form34b-soy-source-verification.json', 'KEN-C027-CON141', (92702, 66883, 342)),
            172: ('form34b-subukia-source-verification.json', 'KEN-C032-CON172', (55599, 38323, 343)),
            176: ('form34b-nakuru-town-east-source-verification.json', 'KEN-C032-CON176', (125551, 75843, 533)),
            182: ('form34b-narok-west-source-verification.json', 'KEN-C033-CON182', (66596, 53603, 270)),
            183: ('form34b-kajiado-north-source-verification.json', 'KEN-C034-CON183', (134880, 78352, 582)),
            195: ('form34b-chepalungu-source-verification.json', 'KEN-C036-CON195', (80140, 64032, 507)),
            199: ('form34b-lugari-source-verification.json', 'KEN-C037-CON199', (86908, 52059, 540)),
            213: ('form34b-hamisi-source-verification.json', 'KEN-C038-CON213', (80384, 46090, 524)),
            217: ('form34b-sirisia-source-verification.json', 'KEN-C039-CON217', (48717, 29675, 398)),
            225: ('form34b-teso-north-source-verification.json', 'KEN-C040-CON225', (59795, 39202, 911)),
            230: ('form34b-funyula-source-verification.json', 'KEN-C040-CON230', (54031, 37311, 301)),
            242: ('form34b-nyando-source-verification.json', 'KEN-C042-CON242', (80757, 60481, 403)),
            246: ('form34b-kabondo-kasipul-source-verification.json', 'KEN-C043-CON246', (59910, 42430, 157)),
            259: ('form34b-kuria-west-source-verification.json', 'KEN-C044-CON259', (62244, 41197, 359)),
            274: ('form34b-westlands-source-verification.json', 'KEN-C047-CON274', (160739, 84150, 1099)),
            278: ('form34b-kibra-source-verification.json', 'KEN-C047-CON278', (128282, 75074, 404)),
            286: ('form34b-embakasi-west-source-verification.json', 'KEN-C047-CON286', (141878, 80487, 466)),
          }
          root = Path('data/p23')
          evidence = {}
          pending = set()
          for path in sorted(root.glob('form34b-*-source-verification.json')):
              doc = json.loads(path.read_text())
              code = int((doc.get('sample') or {}).get('constituency_code') or 0)
              if code:
                  evidence[code] = (path, doc)
              if doc.get('verification_state') == 'verified' and doc.get('promotion_eligible') is False:
                  pending.add(code)
          assert pending == set(expected), (sorted(pending), sorted(expected))

          for code, (filename, geo_code, values_expected) in expected.items():
              path, doc = evidence[code]
              assert path.name == filename, (code, path.name)
              assert doc['sample']['geo_code'] == geo_code, (code, doc['sample']['geo_code'])
              assert doc['verification_state'] == 'verified'
              assert doc['promotion_eligible'] is False
              assert doc['promotion_state'] == 'pending_explicit_materialization'
              assert doc.get('promotion_authorized_by_this_file') is False
              fields = doc['field_evidence']
              field_names = ('registered_voters', 'total_valid_votes', 'rejected_ballots')
              values = tuple(fields[name]['verified_value'] for name in field_names)
              assert values == values_expected, (code, values)
              assert all(fields[name]['verification_state'] == 'source_verified' for name in field_names)
              reconciliation = doc['same_row_valid_vote_reconciliation']
              assert reconciliation['reconciles_total_valid_votes'] is True
              assert sum(reconciliation['candidate_vote_totals_in_source_column_order']) == values[1]
              assert values[1] + values[2] <= values[0]
              doc['promotion_eligible'] = True
              doc['promotion_state'] = 'explicit_materialization_authorized'
              doc['promotion_authorization_contract'] = 'data/p23/form34b-turnout-promotion-contract.json'
              doc['promotion_authorized_by_this_file'] = False
              doc['note'] = 'This evidence establishes a source-verified row under the extraction contract. Canonical materialization is authorized only by the separate governed promotion tranche in data/p23/form34b-turnout-promotion-contract.json.'
              path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n')

          contract_path = root / 'form34b-turnout-promotion-contract.json'
          contract = json.loads(contract_path.read_text())
          current = contract['current_tranche']
          assert contract['schema_version'] == 'kda.p23.form34b-turnout-promotion.v1'
          assert current['verified_constituency_codes'] == [1, 5, 139, 192, 198]
          assert current['expected_p23_remaining_after_materialization'] == 285
          assert current['expected_resolved_slots_after_materialization'] == 11099
          assert current['governed_total_slots'] == 20115

          all_codes = sorted({1, 5, 139, 192, 198} | set(expected))
          all_geo_codes = [evidence[code][1]['sample']['geo_code'] for code in all_codes]
          contract['contract_id'] = 'P23-IEBC-2022-FORM34B-TURNOUT-PROMOTION-2026-09-07-T4'
          contract['as_of'] = '2026-09-07'
          contract['current_tranche'] = {
              'verified_constituencies': 31,
              'verified_geo_codes': all_geo_codes,
              'verified_constituency_codes': all_codes,
              'newly_authorized_constituency_codes': sorted(expected),
              'expected_p23_remaining_after_materialization': 259,
              'expected_resolved_slots_after_materialization': 11125,
              'governed_total_slots': 20115,
              'materialization_state': 'explicit_materialization_authorized',
              'materialization_checks': [
                  'canonical_rebuild',
                  'exact_completeness_delta',
                  'full_validation_suite',
                  'independent_geography_audit',
              ],
          }
          contract['scale_plan']['next_step'] = 'Obtain wider governed source-page renders for the 14 held unique-anchor rows; preserve clipped, summary-only, incomplete and arithmetic-mismatch rows without inference.'
          contract['scale_plan']['batch_rule'] = 'Source review may proceed in parallel, but canonical promotion remains a single deterministic reducer over independently source-verified rows.'
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n')
          print('P23_AUTHORIZE_26_OK codes=' + ','.join(map(str, sorted(expected))))
          PY
      - name: Rebuild canonical data
        run: npm run build:data
      - name: Validate source verification and no self-promotion
        run: node scripts/p23/validate-form34b-source-verifications.mjs
      - name: Assert exact 26-row P23 delta and source linkage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const expectedCodes = [1,5,20,28,38,71,73,74,95,104,126,139,141,172,176,182,183,192,195,198,199,213,217,225,230,242,246,259,274,278,286];
          const newlyAuthorized = [20,28,38,71,73,74,95,104,126,141,172,176,182,183,195,199,213,217,225,230,242,246,259,274,278,286];
          const summary = JSON.parse(fs.readFileSync('data/completeness/summary.json', 'utf8'));
          const series = JSON.parse(fs.readFileSync('data/indicators/registry/series.json', 'utf8'));
          const observations = JSON.parse(fs.readFileSync('data/indicators/registry/observations.json', 'utf8'));
          const contract = JSON.parse(fs.readFileSync('data/p23/form34b-turnout-promotion-contract.json', 'utf8'));
          assert(summary.total_slots === 20115, `denominator ${summary.total_slots}`);
          assert(summary.resolved_slots === 11125, `resolved ${summary.resolved_slots}`);
          assert(summary.unresolved_slots === 8990, `unresolved ${summary.unresolved_slots}`);
          assert(summary.by_completion_phase?.P23 === 259, `P23 ${summary.by_completion_phase?.P23}`);
          assert(summary.unknown_missing === 0, `unknown missing ${summary.unknown_missing}`);
          assert(series.length === 6650, `series ${series.length}`);
          assert(observations.length === 10433, `observations ${observations.length}`);
          assert(JSON.stringify(contract.current_tranche.verified_constituency_codes) === JSON.stringify(expectedCodes), 'contract verified code set changed');
          assert(JSON.stringify(contract.current_tranche.newly_authorized_constituency_codes) === JSON.stringify(newlyAuthorized), 'contract newly-authorized set changed');

          const evidenceByCode = new Map();
          for (const filename of fs.readdirSync('data/p23').filter(name => name.endsWith('-source-verification.json'))) {
            const evidence = JSON.parse(fs.readFileSync(path.join('data/p23', filename), 'utf8'));
            if (evidence.verification_state === 'verified') evidenceByCode.set(evidence.sample.constituency_code, {filename, evidence});
          }
          assert(evidenceByCode.size === 31, `verified evidence ${evidenceByCode.size}`);
          const expectedSeries = new Set(expectedCodes.map(code => `KDA-TURNOUT-CON-${String(code).padStart(3, '0')}-2022-PRES`));
          const turnoutSeries = series.filter(row => row.comparability_group === 'IEBC-PRESIDENTIAL-TURNOUT-2022-FORM34B');
          assert(turnoutSeries.length === 31, `turnout series ${turnoutSeries.length}`);
          assert(turnoutSeries.every(row => expectedSeries.has(row.series_code)), 'unexpected turnout series');
          const observationById = new Map(observations.map(row => [row.observation_id, row]));
          for (const code of expectedCodes) {
            const item = evidenceByCode.get(code);
            assert(item, `evidence missing ${code}`);
            const {filename, evidence} = item;
            assert(evidence.promotion_eligible === true, `promotion eligibility ${code}`);
            if (newlyAuthorized.includes(code)) {
              assert(evidence.promotion_state === 'explicit_materialization_authorized', `promotion state ${code}`);
              assert(evidence.promotion_authorization_contract === 'data/p23/form34b-turnout-promotion-contract.json', `promotion contract ${code}`);
            }
            assert(evidence.promotion_authorized_by_this_file === false, `self authorization ${code}`);
            const seriesCode = `KDA-TURNOUT-CON-${String(code).padStart(3, '0')}-2022-PRES`;
            const seriesRow = turnoutSeries.find(row => row.series_code === seriesCode);
            assert(seriesRow, `series missing ${code}`);
            const observation = observationById.get(seriesRow.latest_observation_id);
            assert(observation, `observation missing ${code}`);
            const fields = evidence.field_evidence;
            const expectedValue = 100 * (fields.total_valid_votes.verified_value + fields.rejected_ballots.verified_value) / fields.registered_voters.verified_value;
            assert(Math.abs(observation.value - expectedValue) < 1e-12, `turnout mismatch ${code}`);
            assert(observation.source_class === 'official' && observation.geographic_method === 'direct', `provenance ${code}`);
            assert(observation.source_url === evidence.sample.source_url, `source URL ${code}`);
            assert(observation.source_row_label === 'TOTAL', `source row ${code}`);
            assert(observation.notes.includes(filename), `evidence link ${code}`);
          }
          const budalangi = JSON.parse(fs.readFileSync('data/p23/form34b-budalangi-source-verification.json', 'utf8'));
          assert(budalangi.verification_state === 'arithmetic_mismatch', 'Budalangi state changed');
          assert(budalangi.promotion_eligible === false, 'Budalangi promoted');
          console.log('P23_MATERIALIZE_26_DELTA_OK verified=31 newly_materialized=26 p23_remaining=259 resolved=11125 denominator=20115 series=6650 observations=10433');
          NODE
      - name: Run full Atlas validation suite
        run: npm test
      - name: Install independent geometry audit dependency
        run: python3 -m pip install --disable-pip-version-check shapely
      - name: Run independent geography audit
        run: python3 scripts/geography/audit-geometry.py .
      - name: Remove one-shot workflow
        run: rm .github/workflows/p23-materialize-26-source-verified-form34b.yml
      - name: Commit atomic materialization
        run: |
          git config user.name 'kda-p23-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'P23: materialize 26 source-verified Form 34B turnout rows'
          git push origin HEAD:watchdog/p23-materialize-26-source-verified-form34b
