name: P04 roadmap handoff

on:
  push:
    paths:
      - '.github/workflows/p04-roadmap-handoff.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mark P04 complete and advance P05
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roadmap_path=Path('data/project-roadmap.json')
          roadmap=json.loads(roadmap_path.read_text())
          phases={p['id']:p for p in roadmap['phases']}
          assert phases['P04']['status']=='next', phases['P04']['status']
          assert phases['P05']['status']=='planned', phases['P05']['status']
          phases['P04']['status']='complete'
          phases['P05']['status']='next'
          roadmap_path.write_text(json.dumps(roadmap,indent=2,ensure_ascii=False)+'\n')

          docs_path=Path('docs/REPO-COMPLETION-PLAN.md')
          docs=docs_path.read_text()
          docs=docs.replace(
            '> Complete P04 from `docs/REPO-COMPLETION-PLAN.md`. Do not restart completed phases. Implement the full phase, run its acceptance checks, push to `main`, and report any unmet gate explicitly.',
            '> Complete P05 from `docs/REPO-COMPLETION-PLAN.md`. Do not restart completed phases. Implement the full phase, run its acceptance checks, push to `main`, and report any unmet gate explicitly.'
          )
          p03_bullet='- P03 twelve-year county fiscal experience with common-period rankings, exact 1/3/5-year changes, absorption volatility, responsive history UI and explicit denominator withholding.'
          p04_bullet='- P04 47-county health and living-standards package with 2022 poverty/KDHS survey precision metadata, withheld survey rankings, and the 2023 Health Facility Census assessed-facility inventory.'
          if p04_bullet not in docs:
              docs=docs.replace(p03_bullet,p03_bullet+'\n'+p04_bullet)

          start=docs.index('## P04 — Health + living-standards activation')
          end=docs.index('\n---\n\n## P05 — Education + economic structure + agriculture + infrastructure',start)
          p04_section='\n'.join([
            '## P04 — Health + living-standards activation',
            '',
            '**Status: complete.**',
            '',
            'P04 activated a coherent five-indicator county social-outcomes package across all 47 counties: 2022 overall poverty with KNBS source-reported standard errors; 2022 KDHS stunting, basic immunisation and skilled birth attendance with source table denominators retained as precision metadata; and the 2023 Ministry of Health Health Facility Census assessed-facility inventory, reconciling to 14,883 assessed facilities.',
            '',
            'Survey point estimates and raw facility counts remain deliberately unranked in this phase. CountyIQ exposes source, period and available precision evidence without inventing confidence intervals or presenting a composite health score. P04 does not introduce HIV estimates, per-capita facility rates, governor scores or causal performance claims.',
            '',
            'Release evidence: the exact PR candidate passed deterministic rebuild, committed-output drift checks, the full Atlas validation suite and the independent Shapely geometry audit. PR #12 merged to `main`; the generated-data workflow then published the canonical CountyIQ mart, and the resulting publish head deployed successfully to GitHub Pages.',
            '',
            '**Do not reopen:** survey rankings remain gated to later comparison methodology; source precision must remain explicit and no missing uncertainty field may be fabricated.',
            ''
          ])
          docs=docs[:start]+p04_section+docs[end:]
          p05_heading='## P05 — Education + economic structure + agriculture + infrastructure\n\n'
          if p05_heading+'**Status: next.**' not in docs:
              docs=docs.replace(p05_heading,p05_heading+'**Status: next.**\n\n',1)
          docs_path.write_text(docs)

          validator_path=Path('scripts/project/validate-roadmap.mjs')
          v=validator_path.read_text()
          v=v.replace("assert(next.length===1&&next[0].id==='P04','exactly P04 must be the next phase after P03');","assert(next.length===1&&next[0].id==='P05','exactly P05 must be the next phase after P04');")
          p03_assert="  assert(roadmap.phases[3].status==='complete','P03 must be complete');"
          p04_assert="  assert(roadmap.phases[4].status==='complete','P04 must be complete');"
          if p04_assert not in v:
              v=v.replace(p03_assert,p03_assert+'\n'+p04_assert)
          v=v.replace("'Complete P04'","'Complete P05'")
          v=v.replace("console.log('PROJECT_P03_COMPLETE_OK');","console.log('PROJECT_P04_COMPLETE_OK');")
          v=v.replace("console.log('PROJECT_NEXT_PHASE_P04_OK');","console.log('PROJECT_NEXT_PHASE_P05_OK');")
          validator_path.write_text(v)
          PY
          node scripts/project/validate-roadmap.mjs
      - name: Commit clean handoff
        run: |
          git rm .github/workflows/p04-apply.yml
          git rm .github/workflows/p04-roadmap-handoff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/project-roadmap.json docs/REPO-COMPLETION-PLAN.md scripts/project/validate-roadmap.mjs
          git commit -m 'docs: mark P04 complete and advance to P05'
          git push origin HEAD:main
