name: Probe CoB historical parser

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - .github/workflows/sprint3-cob-probe.yml
      - scripts/sprint3/harden_acquisition_v5.py
      - scripts/sprint3/harden_acquisition_v6.py
      - scripts/sprint3/harden_acquisition_v7.py
      - scripts/sprint3/harden_acquisition_v8.py
      - scripts/sprint3/harden_acquisition_v9.py
      - scripts/sprint3/harden_acquisition_v10.py
      - scripts/sprint3/harden_acquisition_v11.py
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib pdfplumber
      - name: Validate FY2018/19 official Table 2.5 snapshot
        run: |
          python scripts/sprint3/harden_acquisition_v11.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/sprint3')
          import acquire_cob_history as cob

          fy='2018/19'
          root=Path('.')
          geos=json.loads((root/'data/geography/registry/geographies.json').read_text())
          counties=[g['name'] for g in geos if g.get('level')=='county']
          session=cob.requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36','Accept':'*/*'})
          pdf_url,content=cob._discover_pdf(session,cob.COB_PAGES[fy],fy)
          values=cob._parse_2018_consolidated_table(content,counties)
          cob._validate_year(fy,values,counties)
          print('FY2018/19 PASS',len(values),'counties',pdf_url)
          print('AGG_BUDGET',sum(v['budget_total_ksh_mn'] for v in values.values()))
          print('AGG_SPEND',sum(v['expenditure_total_ksh_mn'] for v in values.values()))
          for county in ['Garissa','Laikipia','Lamu','Trans Nzoia','West Pokot']:
              print(county,values[county])
          PY
