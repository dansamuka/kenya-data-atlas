name: Probe CoB FY2019 parser

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - .github/workflows/sprint3-cob-probe.yml
      - scripts/sprint3/harden_acquisition_v5.py
      - scripts/sprint3/harden_acquisition_v6.py
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib pdfplumber
      - name: Validate FY2019/20 all-county parser
        run: |
          python scripts/sprint3/harden_acquisition_v6.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/sprint3')
          import acquire_cob_history as cob

          root=Path('.')
          geos=json.loads((root/'data/geography/registry/geographies.json').read_text())
          counties=[g['name'] for g in geos if g.get('level')=='county']
          session=cob.requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36','Accept':'*/*'})
          pdf_url,content=cob._discover_pdf(session,cob.COB_PAGES['2019/20'],'2019/20')
          values=cob._parse_narrative_year(content,'2019/20',counties)
          cob._validate_year('2019/20',values,counties)
          print('FY2019/20 PASS',len(values),'counties',pdf_url)
          for county in ['Busia','Kirinyaga','Kisii','Narok','Nyamira','Garissa','Homa Bay','Kilifi','Mandera','Meru',"Murang'a",'Nairobi','Siaya','Vihiga']:
              print(county,values[county])
          PY
