name: Probe CoB historical download

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths: [.github/workflows/sprint3-cob-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pdfplumber
      - name: Inspect 2013/14 OCoB table layout
        run: |
          python - <<'PY'
          import io,re,requests,pdfplumber
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://cob.go.ke/download/annual-county-governments-budget-implementation-review-report-fy-20132014/'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'
          r=s.get(url,timeout=60); soup=BeautifulSoup(r.text,'lxml'); c=[]
          for tag in soup.find_all(True):
              for attr in ('href','data-downloadurl','data-url','onclick'):
                  val=str(tag.get(attr) or '')
                  for hit in re.findall(r'(?:https?://[^\"\'<>\s]+)?\?wpdmdl=\d+[^\"\'<>\s]*',val,re.I): c.append(urljoin(r.url,hit))
          c=list(dict.fromkeys(c)); print('candidates',c)
          q=s.get(c[0],timeout=90,allow_redirects=True); assert q.content[:5]==b'%PDF-'
          counties=['Mombasa','Kwale','Kilifi','Nairobi','Kiambu','Nakuru','Kakamega','Turkana']
          hits=[]
          with pdfplumber.open(io.BytesIO(q.content)) as pdf:
              print('pages',len(pdf.pages))
              for i,p in enumerate(pdf.pages):
                  t=p.extract_text(x_tolerance=2,y_tolerance=3) or ''
                  low=t.lower()
                  score=sum(x.lower() in low for x in counties)
                  kw=sum(x in low for x in ['budget allocation','absorption','total expenditure','county governments','development expenditure','recurrent expenditure'])
                  if score>=3 or kw>=3:
                      compact=' '.join(t.split())
                      hits.append((i+1,score,kw,compact[:1200]))
              print('candidate_pages',len(hits))
              for x in hits[:40]: print('PAGE',x[0],'COUNTY_SCORE',x[1],'KW',x[2],x[3])
          if not hits: raise SystemExit('no candidate pages')
          PY
