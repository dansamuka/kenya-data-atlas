name: Probe CoB historical download

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths: [.github/workflows/sprint3-cob-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pdfplumber
      - name: Inspect FY2014/15 report structure
        run: |
          python - <<'PY'
          import io,re,requests,pdfplumber
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://cob.go.ke/download/annual-county-governments-budget-implementation-review-report-fy-201415/'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'
          r=s.get(url,timeout=60); print('landing',r.status_code,len(r.content),r.url)
          soup=BeautifulSoup(r.text,'lxml'); c=[]
          for tag in soup.find_all(True):
              for attr in ('href','data-downloadurl','data-url','onclick'):
                  val=str(tag.get(attr) or '')
                  for hit in re.findall(r'(?:https?://[^\"\'<>\s]+)?\?wpdmdl=\d+[^\"\'<>\s]*',val,re.I): c.append(urljoin(r.url,hit))
          for hit in re.findall(r'(?:https?://[^\"\'<>\s]+)?\?wpdmdl=\d+[^\"\'<>\s]*',r.text,re.I): c.append(urljoin(r.url,hit))
          c=list(dict.fromkeys(c)); print('candidates',c)
          if not c: raise SystemExit('no download candidate')
          q=s.get(c[0],timeout=120,allow_redirects=True); print('pdf',q.status_code,len(q.content),q.url,q.headers.get('content-type')); assert q.content[:5]==b'%PDF-'
          counties=['Mombasa','Kwale','Kilifi','Nairobi','Kiambu','Nakuru','Kakamega','Turkana','Baringo','Bomet','Wajir','Kisumu']
          with pdfplumber.open(io.BytesIO(q.content)) as pdf:
              print('pages',len(pdf.pages))
              hits=[]
              texts=[]
              for i,p in enumerate(pdf.pages):
                  t=p.extract_text(x_tolerance=2,y_tolerance=3) or ''; texts.append(t)
                  low=t.lower(); cs=sum(x.lower() in low for x in counties)
                  ks=sum(k in low for k in ['budget','expenditure','absorption','gross estimates','development','recurrent'])
                  if cs>=5 or (cs>=2 and ks>=3): hits.append((cs,ks,i))
              hits=sorted(hits,reverse=True)[:25]
              print('TOP',[(a,b,i+1) for a,b,i in hits])
              for cs,ks,i in hits[:12]:
                  p=pdf.pages[i]; t=texts[i]
                  print('\n=== PAGE',i+1,'COUNTIES',cs,'KEYS',ks,'===\n',' '.join(t.split())[:6000])
                  tables=p.extract_tables() or []
                  print('TABLES',len(tables))
                  for ti,table in enumerate(tables[:3]):
                      print('TABLE',ti,'ROWS',len(table),'WIDTH',max((len(r or []) for r in table),default=0))
                      for row in table[:18]: print(row)
          PY
