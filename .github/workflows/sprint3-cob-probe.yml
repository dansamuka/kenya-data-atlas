name: Probe CoB FY2018 parser

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths: [.github/workflows/sprint3-cob-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib pdfplumber
      - name: Validate FY2018/19 all-county parser
        run: |
          python scripts/sprint3/harden_acquisition_v3.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/sprint3')
          import acquire_cob_history as cob

          root=Path('.')
          geos=json.loads((root/'data/geography/registry/geographies.json').read_text())
          counties=[g['name'] for g in geos if g.get('level')=='county']
          session=cob.requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36','Accept':'*/*'})
          url='https://cob.go.ke/download/county-governments-annual-budget-implementation-review-report-fy-2018-19/?wpdmdl=15011'
          r=cob._get(session,url,180)
          assert r.content[:4]==b'%PDF' and len(r.content)>100000
          values=cob._parse_narrative_year(r.content,'2018/19',counties)
          cob._validate_year('2018/19',values,counties)
          print('FY2018/19 PASS',len(values),'counties')
          for county in ['Lamu','Trans Nzoia','Nyeri','Turkana','Laikipia','Nyamira','Homa Bay']:
              print(county,values[county])
          PY
