name: P17 v1.0 release finisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p17-release-finisher.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: p17-v1-release-finisher
  cancel-in-progress: true

env:
  RELEASE_SHA: ac1e56b045f5d7126e0c131012c8c8cfd2e5ec98

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact release SHA gates
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.RELEASE_SHA;
            const required = ['Validate Atlas data', 'P16 release audit', 'pages build and deployment'];
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, head_sha: sha, per_page: 100 });
            for (const name of required) {
              const candidates = runs.filter(run => run.name === name).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
              const run = candidates[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                core.setFailed(`${name} is not green for ${sha}: ${run?.status || 'missing'}/${run?.conclusion || '-'}`);
                return;
              }
              core.info(`P17_FINISHER_GATE_OK ${name} run=${run.id} sha=${sha}`);
            }

      - name: Verify live routed release
        shell: bash
        run: |
          set -euo pipefail
          base='https://dansamuka.github.io/kenya-data-atlas'
          curl -fsSL --retry 5 --retry-delay 3 "$base/?release=$RELEASE_SHA" -o /tmp/index.html
          grep -q 'Kenya Data Atlas' /tmp/index.html
          grep -q '#/countyiq' /tmp/index.html
          curl -fsSL --retry 5 --retry-delay 3 "$base/assets/router.js?release=$RELEASE_SHA" -o /tmp/router.js
          grep -q "'countyiq'" /tmp/router.js
          curl -fsSL --retry 5 --retry-delay 3 "$base/data/project-roadmap.json?release=$RELEASE_SHA" -o /tmp/roadmap.json
          curl -fsSL --retry 5 --retry-delay 3 "$base/data/release/v1.0.0.json?release=$RELEASE_SHA" -o /tmp/release.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/roadmap.json'));const p=r.phases.find(x=>x.id==='P17');if(!p||p.status!=='complete')process.exit(1);const m=JSON.parse(fs.readFileSync('/tmp/release.json'));if(m.release_version!=='1.0.0'||m.release_status!=='released')process.exit(1);console.log('P17_LIVE_ROUTED_RELEASE_OK release=1.0.0');"

      - name: Check out release documentation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Create immutable v1.0.0 tag and GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.RELEASE_SHA;
            const tag = 'v1.0.0';
            try {
              const existing = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (existing.data.object.sha !== sha) {
                core.setFailed(`${tag} already points to ${existing.data.object.sha}, expected ${sha}`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            }
            const body = `${fs.readFileSync('docs/releases/v1.0.0.md', 'utf8')}\n\nRelease commit: \`${sha}\`\n`;
            try {
              const existingRelease = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({ owner, repo, release_id: existingRelease.data.id, tag_name: tag, target_commitish: sha, name: 'Kenya Data Atlas v1.0.0', body, draft: false, prerelease: false });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: sha, name: 'Kenya Data Atlas v1.0.0', body, draft: false, prerelease: false });
            }
            core.info(`P17_GITHUB_RELEASE_OK tag=${tag} sha=${sha}`);
