name: P23 final shard 1 independent visual review

on:
  pull_request:
    paths:
      - data/p23/form34b-final-shard1-independent-visual-review.json
      - .github/workflows/p23-final-shard1-independent-visual-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent visual-review batch
        run: |
          python3 - <<'PY'
          import json
          p='data/p23/form34b-final-shard1-independent-visual-review.json'
          d=json.load(open(p))
          assert d['schema_version']=='kda.p23.form34b-independent-visual-review-batch.v1'
          assert d['source_cycle']['workflow_run_id']==34807864713
          assert d['source_cycle']['workflow_head_sha']=='5049c9536f652999809abe67227baa29db87d8ce'
          assert d['source_cycle']['artifact_id']==10333642884
          assert d['source_cycle']['artifact_digest']=='sha256:6ed359fc4a479baa260334df6d5a818c8bc6884bed86955f617fd064c9438bac'
          g=d['governance']
          assert g['no_inheritance'] is True
          assert g['no_promotion'] is True
          assert g['required_render_dpi']==250
          assert g['denominator_reconciliation_required_before_verification'] is True
          assert g['promotion_authorized_by_this_file'] is False
          assert g['canonical_turnout_value_written'] is False
          expected={
            'KEN-C007-CON027':('Garissa Township',53293,[16925,8031,18,112],25086,228,'34a6b2b04f4e945d30f309d9fd19c76a0335906429c1fb62be9612b2761b18d7','2f915b4961de6dc225f9a0144530f276762ef23f84d73674db146492c65c96a3',2),
            'KEN-C017-CON084':('Kilome',59178,[28166,7023,82,233],35504,240,'3d0ed8c0a0ab50006553ff4e7ef1d8e72736d7b6dfaa36271489880b27c24137','fe62d3f26d50c6751b5fef6a5b20687467ac194893afa3d3063b1c47766f7f83',2),
            'KEN-C024-CON131':('Kacheliba',51146,[16767,24445,12,38],41262,94,'3eb21f9f1431a9f4d19b1d7e2b8f4e91bed4fa108f7f0adb3dac0e281ece8aac','fb134c50c8a369a75e87cc6256e55e20a0788c04143ffd381a9cbc19ad6641e9',3),
            'KEN-C024-CON129':('Kapenguria',66556,[15042,35242,57,101],50442,390,'e21afdc9a2cf804609e3003384e638aace1c133970d45d9e02e260e84bc745c3','c97182f998ee652d843d86807e50d67088d5268bc6ecbc7c1be7594ce79976ca',4)
          }
          assert len(d['rows'])==4
          assert {r['geo_code'] for r in d['rows']}==set(expected)
          for r in d['rows']:
            name,rv,cands,tvv,rej,pdfsha,imgsha,page=expected[r['geo_code']]
            assert r['name']==name
            assert r['page_number']==page
            assert r['render_dpi']==250
            assert r['source_pdf_sha256']==pdfsha and len(pdfsha)==64
            assert r['review_context_image_sha256']==imgsha and len(imgsha)==64
            assert r['source_image_legibility']=='clear'
            assert r['form_identity_visually_confirmed'] is True
            assert r['total_row_label_visually_confirmed'] is True
            v=r['visual_transcription']
            assert v['registered_voters']==rv
            assert v['candidate_vote_totals_in_source_column_order']==cands
            assert v['total_valid_votes']==tvv
            assert v['rejected_ballots']==rej
            assert sum(cands)==tvv
            assert r['same_row_valid_vote_reconciliation']['candidate_vote_sum']==tvv
            assert r['same_row_valid_vote_reconciliation']['reconciles_total_valid_votes'] is True
            assert r['denominator_reconciliation_state']=='pending_separate_governed_denominator_check'
            assert r['verification_state']=='visual_source_transcribed_pending_denominator_reconciliation'
            assert r['promotion_eligible'] is False
            assert r['promotion_authorized_by_this_record'] is False
            assert r['canonical_turnout_written'] is False
          print('P23_SHARD1_VISUAL_REVIEW_OK rows=4 no_promotion=true denominator_check=pending')
          PY
