name: P23 Isiolo South review context

on:
  pull_request:
    paths:
      - .github/workflows/p23-isiolo-south-review-context.yml
      - data/p23/turnout-salvage-isiolo-south-review.json
      - data/p23/turnout-salvage-tranche-c.json
      - data/p23/form34b-source-index-contract.json
      - scripts/p23/fresh-download-turnout-salvage-tranche.py
      - scripts/p23/validate-turnout-salvage-fresh-download.mjs
      - scripts/p23/render-turnout-salvage-review-context.py
      - scripts/p23/validate-turnout-salvage-review-context.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isiolo-south-review-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fresh-download official IEBC Form 34B source for Isiolo South
        run: >-
          python3 scripts/p23/fresh-download-turnout-salvage-tranche.py
          --tranche data/p23/turnout-salvage-isiolo-south-review.json
          --source-index data/p23/form34b-source-index-contract.json
          --output /tmp/p23-isiolo-south-fresh-download.json
          --download-dir /tmp/p23-isiolo-south-pdf
      - name: Revalidate fresh-download no-inheritance contract
        run: >-
          node scripts/p23/validate-turnout-salvage-fresh-download.mjs
          /tmp/p23-isiolo-south-fresh-download.json
          data/p23/turnout-salvage-isiolo-south-review.json
      - name: Render every fresh official source page at exactly 250 DPI
        run: >-
          python3 scripts/p23/render-turnout-salvage-review-context.py
          --fresh-manifest /tmp/p23-isiolo-south-fresh-download.json
          --pdf-dir /tmp/p23-isiolo-south-pdf
          --output /tmp/p23-isiolo-south-review-context.json
          --render-dir /tmp/p23-isiolo-south-review-pages
      - name: Validate review-context no-review and no-promotion contract
        run: node scripts/p23/validate-turnout-salvage-review-context.mjs /tmp/p23-isiolo-south-review-context.json
      - name: Upload row-scoped fresh 250-DPI review-context artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-isiolo-south-review-context
          path: |
            /tmp/p23-isiolo-south-fresh-download.json
            /tmp/p23-isiolo-south-review-context.json
            /tmp/p23-isiolo-south-pdf/*.pdf
            /tmp/p23-isiolo-south-review-pages/*.png
          if-no-files-found: warn
          retention-days: 2
