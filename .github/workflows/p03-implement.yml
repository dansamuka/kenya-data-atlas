name: P03 fiscal history implementation

on:
  push:
    branches: [p03-fiscal-history]
    paths:
      - '.github/workflows/p03-implement.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p03-fiscal-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply P03 analytical and UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              assert old in text, f'missing replacement anchor in {path}: {old[:100]}'
              p.write_text(text.replace(old,new,1))

          # Extend the canonical CountyIQ mart with a synchronized 12-year fiscal experience.
          p=Path('scripts/countyiq/build-mart.mjs')
          text=p.read_text()
          anchor="function generatedAt(observations,releases){"
          assert anchor in text
          fiscal_js='\n'.join([
            "const FISCAL_CODES={budget:'IND-COUNTY-BUDGET-TOTAL',expenditure:'IND-COUNTY-EXPENDITURE-TOTAL',overall_absorption:'IND-COUNTY-BUDGET-ABSORPTION',development_absorption:'IND-COUNTY-DEVELOPMENT-ABSORPTION'};",
            "const EXPECTED_FISCAL_YEARS=Array.from({length:12},(_,i)=>{const y=2013+i;return `${y}/${String(y+1).slice(-2)}`;});",
            "function fiscalKey(o){",
            "  const label=String(o?.period_label||'');const match=label.match(/(\\d{4})\\s*\\/\\s*(\\d{2,4})/);",
            "  if(match)return `${match[1]}/${match[2].slice(-2)}`;",
            "  const start=String(o?.period_start||'');const y=Number(start.slice(0,4));return Number.isFinite(y)&&y>0?`${y}/${String(y+1).slice(-2)}`:null;",
            "}",
            "function finiteValue(o){const x=Number(o?.value);return Number.isFinite(x)?x:null;}",
            "function stdev(values){const a=values.filter(Number.isFinite);if(a.length<2)return null;const mean=a.reduce((s,v)=>s+v,0)/a.length;return Number(Math.sqrt(a.reduce((s,v)=>s+(v-mean)**2,0)/a.length).toFixed(2));}",
            "function rankInPeriod(value,values){if(!Number.isFinite(value)||values.length!==47)return null;return 1+values.filter(v=>Number.isFinite(v)&&v>value).length;}",
            "function fiscalChange(history,field,lag,kind){",
            "  const last=history.at(-1),base=history.at(-(lag+1));if(!last||!base)return null;const current=last[field]?.value,prior=base[field]?.value;if(!Number.isFinite(current)||!Number.isFinite(prior))return null;",
            "  const raw=kind==='percent'?prior===0?null:((current/prior)-1)*100:current-prior;if(raw===null||!Number.isFinite(raw))return null;",
            "  return {lag_years:lag,from_period:base.fiscal_year,to_period:last.fiscal_year,value:Number(raw.toFixed(2)),unit:kind==='percent'?'percent':'percentage_points'};",
            "}",
            "function fiscalExperience(row,allRows){",
            "  const maps={};for(const [key,code] of Object.entries(FISCAL_CODES)){maps[key]=new Map((row.metrics[code]?.history||[]).map(o=>[fiscalKey(o),o]).filter(([k])=>k));}",
            "  const history=EXPECTED_FISCAL_YEARS.map(fy=>{",
            "    const found={};for(const key of Object.keys(FISCAL_CODES)){found[key]=maps[key].get(fy);if(!found[key])throw new Error(`${row.county.geo_code}: missing ${key} for fiscal year ${fy}`);}",
            "    const measure=key=>({value:finiteValue(found[key]),observation_id:found[key].observation_id,series_id:found[key].series_id,period_label:found[key].period_label,provenance:found[key].provenance});",
            "    return {fiscal_year:fy,period_start:found.budget.period_start,period_end:found.budget.period_end,budget:measure('budget'),expenditure:measure('expenditure'),overall_absorption:measure('overall_absorption'),development_absorption:measure('development_absorption'),rankings:{}};",
            "  });",
            "  for(const fyRow of history){for(const [key,code] of Object.entries(FISCAL_CODES)){",
            "    const peers=allRows.map(peer=>(peer.metrics[code]?.history||[]).find(o=>fiscalKey(o)===fyRow.fiscal_year)).map(finiteValue).filter(Number.isFinite);",
            "    if(peers.length!==47)throw new Error(`${fyRow.fiscal_year}/${key}: common-period county coverage ${peers.length}/47`);",
            "    const rate=key.includes('absorption');fyRow.rankings[key]={rank:rankInPeriod(fyRow[key].value,peers),eligible_count:47,period_key:fyRow.fiscal_year,common_period:true,interpretation:rate?'higher_rate_position':'scale_only'};",
            "  }}",
            "  const population=row.metrics['IND-POPULATION'];const availablePopulationPeriods=[...new Set((population?.history||[]).map(o=>String(o.period_label||o.period_start||'')).filter(Boolean))];",
            "  return {",
            "    period_start:history[0].fiscal_year,period_end:history.at(-1).fiscal_year,fiscal_year_count:history.length,",
            "    measures:Object.fromEntries(Object.entries(FISCAL_CODES).map(([k,v])=>[k,{indicator_code:v}])),history,",
            "    changes:{",
            "      budget:{one_year:fiscalChange(history,'budget',1,'percent'),three_year:fiscalChange(history,'budget',3,'percent'),five_year:fiscalChange(history,'budget',5,'percent')},",
            "      expenditure:{one_year:fiscalChange(history,'expenditure',1,'percent'),three_year:fiscalChange(history,'expenditure',3,'percent'),five_year:fiscalChange(history,'expenditure',5,'percent')},",
            "      overall_absorption:{one_year:fiscalChange(history,'overall_absorption',1,'points'),three_year:fiscalChange(history,'overall_absorption',3,'points'),five_year:fiscalChange(history,'overall_absorption',5,'points')},",
            "      development_absorption:{one_year:fiscalChange(history,'development_absorption',1,'points'),three_year:fiscalChange(history,'development_absorption',3,'points'),five_year:fiscalChange(history,'development_absorption',5,'points')}},",
            "    volatility:{period_count:history.length,overall_absorption_sd_pp:stdev(history.map(x=>x.overall_absorption.value)),development_absorption_sd_pp:stdev(history.map(x=>x.development_absorption.value)),interpretation:'Population standard deviation across the twelve published annual absorption rates; descriptive only.'},",
            "    denominators:{policy:'exact_or_explicitly_compatible_period_only',population:{indicator_code:'IND-POPULATION',compatible_annual_series:false,available_periods:availablePopulationPeriods,required_periods:EXPECTED_FISCAL_YEARS,interpolation_allowed:false,national_inheritance_allowed:false,reason:'No active canonical county population series provides an explicit compatible annual denominator for every fiscal year from FY2013/14 through FY2024/25.'},per_capita:{published:false,measures:[],reason:'Per-capita fiscal measures are withheld until a compatible official county population denominator series is activated.'}}",
            "  };",
            "}",
            ""
          ])
          text=text.replace(anchor,fiscal_js+anchor,1)
          old="    return {\n      geography:{geography_id:county.geography_id,geo_code:county.geo_code,name:county.name,level:'county',county_code:county.county_code,boundary_version:county.boundary_version||'2012-01'},\n      metrics,domains,benchmarks:{national:{},peer_group:null},"
          new="    const fiscal=fiscalExperience({county,metrics},rows);\n    return {\n      geography:{geography_id:county.geography_id,geo_code:county.geo_code,name:county.name,level:'county',county_code:county.county_code,boundary_version:county.boundary_version||'2012-01'},\n      metrics,fiscal,domains,benchmarks:{national:{},peer_group:null},"
          assert old in text
          text=text.replace(old,new,1)
          text=text.replace("schema_version:'kda.countyiq.county-summary.v1'","schema_version:'kda.countyiq.county-summary.v2'",1)
          text=text.replace("methodology_version:'P02-v1'","methodology_version:'P03-v1'",1)
          p.write_text(text)

          replace('scripts/countyiq/validate-mart.mjs',"assert(committed.meta?.schema_version==='kda.countyiq.county-summary.v1','unexpected schema version');","assert(committed.meta?.schema_version==='kda.countyiq.county-summary.v2','unexpected schema version');")

          # P03-specific validator.
          validator='\n'.join([
            "import fs from 'node:fs';",
            "import path from 'node:path';",
            "import { buildMart, loadCanonical } from './build-mart.mjs';",
            "const root=process.cwd();const read=p=>fs.readFileSync(path.join(root,p),'utf8');const json=p=>JSON.parse(read(p));",
            "const assert=(ok,msg)=>{if(!ok)throw new Error(`P03 validation: ${msg}`);};",
            "const YEARS=Array.from({length:12},(_,i)=>{const y=2013+i;return `${y}/${String(y+1).slice(-2)}`;});",
            "const KEYS=['budget','expenditure','overall_absorption','development_absorption'];",
            "try{",
            "  const canonical=loadCanonical(root),mart=json('data/countyiq/county-summary.json'),rebuilt=buildMart(canonical);",
            "  assert(JSON.stringify(mart)===JSON.stringify(rebuilt),'committed mart diverges from deterministic P03 build');",
            "  assert(mart.meta?.schema_version==='kda.countyiq.county-summary.v2','schema must be v2');assert(mart.meta?.methodology_version==='P03-v1','methodology must be P03-v1');assert(mart.counties?.length===47,'expected 47 counties');",
            "  const obsById=new Map(canonical.observations.map(o=>[o.observation_id,o]));",
            "  for(const county of mart.counties){const f=county.fiscal;assert(f,`${county.geography.geo_code}: fiscal block missing`);assert(f.fiscal_year_count===12,`${county.geography.geo_code}: expected 12 fiscal years`);assert(f.history.map(x=>x.fiscal_year).join('|')===YEARS.join('|'),`${county.geography.geo_code}: fiscal year sequence mismatch`);",
            "    for(const row of f.history){for(const key of KEYS){const m=row[key];assert(Number.isFinite(m?.value),`${county.geography.geo_code}/${row.fiscal_year}/${key}: finite value required`);assert(obsById.has(m.observation_id),`${county.geography.geo_code}/${row.fiscal_year}/${key}: canonical observation missing`);assert(m.provenance?.source_url,`${county.geography.geo_code}/${row.fiscal_year}/${key}: source URL missing`);const r=row.rankings?.[key];assert(r?.common_period===true&&r?.period_key===row.fiscal_year&&r?.eligible_count===47,`${county.geography.geo_code}/${row.fiscal_year}/${key}: common-period ranking invalid`);assert(Number.isInteger(r.rank)&&r.rank>=1&&r.rank<=47,`${county.geography.geo_code}/${row.fiscal_year}/${key}: rank invalid`);}}",
            "    for(const key of KEYS){for(const window of ['one_year','three_year','five_year'])assert(Number.isFinite(f.changes?.[key]?.[window]?.value),`${county.geography.geo_code}/${key}/${window}: comparable change missing`);}assert(Number.isFinite(f.volatility?.overall_absorption_sd_pp)&&Number.isFinite(f.volatility?.development_absorption_sd_pp),`${county.geography.geo_code}: absorption volatility missing`);",
            "    const d=f.denominators;assert(d?.policy==='exact_or_explicitly_compatible_period_only',`${county.geography.geo_code}: denominator policy missing`);assert(d.population?.compatible_annual_series===false,`${county.geography.geo_code}: annual population denominator must remain withheld`);assert(d.population?.interpolation_allowed===false&&d.population?.national_inheritance_allowed===false,`${county.geography.geo_code}: silent denominator substitution is not prohibited`);assert(d.per_capita?.published===false,`${county.geography.geo_code}: per-capita fiscal measures must be withheld`);",
            "  }",
            "  const html=read('index.html'),js=read('assets/countyiq-view.js'),css=read('assets/countyiq-view.css');assert(html.includes('id=\"ciq-fiscal-history\"')&&html.includes('id=\"ciq-denominator\"'),'P03 fiscal history/denominator UI anchors missing');assert(js.includes('renderFiscalHistory')&&js.includes('row.fiscal'),'runtime does not render mart fiscal block');assert(!js.includes('data/sprint3/')&&!js.includes('KDA.csv('),'runtime must not join Sprint 3 CSVs');assert(css.includes('.ciq-fiscal-history')&&css.includes('@media(max-width:700px)'),'mobile fiscal history styling missing');",
            "  console.log('P03_47X12_FISCAL_HISTORY_OK');console.log('P03_COMMON_PERIOD_RANKS_OK');console.log('P03_DENOMINATOR_DISCIPLINE_OK');console.log('P03_MOBILE_FISCAL_UI_OK');console.log('P03_ALL_OK');",
            "}catch(error){console.error(error.message||error);process.exit(1);}",
            ""
          ])
          Path('scripts/countyiq/validate-p03.mjs').write_text(validator)

          # Package gate.
          replace('package.json',"\"countyiq:validate\": \"node scripts/countyiq/validate-scaffold.mjs all && node scripts/countyiq/validate-mart.mjs && node scripts/countyiq/validate-runtime.mjs\"","\"countyiq:validate\": \"node scripts/countyiq/validate-scaffold.mjs all && node scripts/countyiq/validate-mart.mjs && node scripts/countyiq/validate-runtime.mjs && node scripts/countyiq/validate-p03.mjs\",\n    \"countyiq:p03:validate\": \"node scripts/countyiq/validate-p03.mjs\"")

          # CountyIQ HTML surface.
          old='<article class="ciq-card"><div class="ciq-card-head"><div><small>Public finance</small><h2>FY2024/25 execution</h2></div></div><div class="ciq-fiscal" id="ciq-fiscal"></div></article>'
          new='<article class="ciq-card ciq-fiscal-card"><div class="ciq-card-head"><div><small>Public finance</small><h2>Twelve-year fiscal experience</h2></div><p>FY2013/14–FY2024/25 · common-period county comparisons only.</p></div><div class="ciq-fiscal" id="ciq-fiscal"></div><div class="ciq-fiscal-insights" id="ciq-fiscal-insights"></div><div class="ciq-fiscal-history" id="ciq-fiscal-history"></div><div class="ciq-denominator" id="ciq-denominator"></div></article>'
          replace('index.html',old,new)

          # Runtime rendering from mart only.
          p=Path('assets/countyiq-view.js');js=p.read_text();js=js.replace(' * P02: production CountyIQ is backed by one generated canonical analytical',' * P03: production CountyIQ is backed by one generated canonical analytical',1)
          old="      return {county:c,geo_code:c.geography?.geo_code,name:c.geography?.name,"
          new="      return {county:c,fiscal:c.fiscal,geo_code:c.geography?.geo_code,name:c.geography?.name,"
          assert old in js;js=js.replace(old,new,1)
          anchor="  function render(code=currentCode){"
          assert anchor in js
          helpers='\n'.join([
            "  function signed(value,suffix){const x=Number(value);if(!Number.isFinite(x))return '—';return `${x>0?'+':''}${x.toLocaleString('en-KE',{maximumFractionDigits:1})}${suffix}`;}",
            "  function fiscalTrendSvg(f){const h=f?.history||[];if(h.length<2)return'<div class=\"source-note\">Fiscal trend unavailable.</div>';const w=760,ht=210,left=34,right=18,top=18,bottom=34;const point=(r,i,key)=>({x:left+(i/(h.length-1))*(w-left-right),y:top+((100-Number(r[key]?.value))/100)*(ht-top-bottom),v:Number(r[key]?.value),fy:r.fiscal_year});const overall=h.map((r,i)=>point(r,i,'overall_absorption')),dev=h.map((r,i)=>point(r,i,'development_absorption'));const path=a=>a.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');return `<div class=\"ciq-fiscal-chart\"><div class=\"ciq-fiscal-legend\"><span><i class=\"overall\"></i>Overall absorption</span><span><i class=\"development\"></i>Development absorption</span></div><svg viewBox=\"0 0 ${w} ${ht}\" role=\"img\" aria-label=\"Twelve-year budget absorption trend\"><path class=\"ciq-gridline\" d=\"M${left} ${top}H${w-right}M${left} ${(top+ht-bottom)/2}H${w-right}M${left} ${ht-bottom}H${w-right}\"/><path class=\"ciq-fiscal-overall\" d=\"${path(overall)}\"/><path class=\"ciq-fiscal-dev\" d=\"${path(dev)}\"/>${overall.map(p=>`<circle class=\"ciq-fiscal-dot overall\" cx=\"${p.x}\" cy=\"${p.y}\" r=\"3\"><title>${esc(p.fy)} overall: ${formatPct(p.v)}</title></circle>`).join('')}${dev.map(p=>`<circle class=\"ciq-fiscal-dot development\" cx=\"${p.x}\" cy=\"${p.y}\" r=\"3\"><title>${esc(p.fy)} development: ${formatPct(p.v)}</title></circle>`).join('')}</svg><div class=\"ciq-fiscal-years\"><span>${esc(h[0].fiscal_year)}</span><span>${esc(h[Math.floor(h.length/2)].fiscal_year)}</span><span>${esc(h.at(-1).fiscal_year)}</span></div></div>`;}",
            "  function renderFiscalHistory(row){const f=row.fiscal;if(!f?.history?.length)return'<div class=\"source-note\">Twelve-year history unavailable.</div>';const rowsHtml=f.history.slice().reverse().map(r=>{const source=r.budget?.provenance?.source_url||'';const ranks=`#${r.rankings?.overall_absorption?.rank||'—'} overall · #${r.rankings?.development_absorption?.rank||'—'} dev`;return `<tr><td data-label=\"Fiscal year\"><strong>${esc(r.fiscal_year)}</strong></td><td data-label=\"Budget\">${esc(formatKesMn(r.budget?.value))}</td><td data-label=\"Expenditure\">${esc(formatKesMn(r.expenditure?.value))}</td><td data-label=\"Overall absorption\">${esc(formatPct(r.overall_absorption?.value))}</td><td data-label=\"Development absorption\">${esc(formatPct(r.development_absorption?.value))}</td><td data-label=\"Same-year ranks\">${esc(ranks)}</td><td data-label=\"Source\">${source?`<a href=\"${esc(source)}\" target=\"_blank\" rel=\"noopener\">CoB ↗</a>`:'—'}</td></tr>`;}).join('');return fiscalTrendSvg(f)+`<div class=\"ciq-fiscal-table-wrap\"><table class=\"ciq-fiscal-table\"><thead><tr><th>FY</th><th>Budget</th><th>Expenditure</th><th>Overall</th><th>Development</th><th>Same-year ranks</th><th>Source</th></tr></thead><tbody>${rowsHtml}</tbody></table></div><p class=\"ciq-trend-note\">Budget and expenditure ranks describe fiscal scale only. Absorption ranks compare execution rates within the same fiscal year; they are not a county performance score.</p>`;}",
            "  function insight(label,item,unit){return `<div><small>${esc(label)}</small><strong>${esc(item?signed(item.value,unit):'—')}</strong><span>${item?`${esc(item.from_period)} → ${esc(item.to_period)}`:'Not comparable'}</span></div>`;}",
            "  function renderFiscalInsights(f){const e=f?.changes?.expenditure||{},a=f?.changes?.overall_absorption||{},v=f?.volatility||{};return [insight('Expenditure · 1Y',e.one_year,'%'),insight('Expenditure · 3Y',e.three_year,'%'),insight('Expenditure · 5Y',e.five_year,'%'),insight('Absorption · 1Y',a.one_year,' pp'),insight('Absorption · 3Y',a.three_year,' pp'),insight('Absorption · 5Y',a.five_year,' pp'),`<div><small>Overall absorption volatility</small><strong>${esc(Number.isFinite(v.overall_absorption_sd_pp)?v.overall_absorption_sd_pp.toFixed(1)+' pp':'—')}</strong><span>12-year standard deviation</span></div>`,`<div><small>Development absorption volatility</small><strong>${esc(Number.isFinite(v.development_absorption_sd_pp)?v.development_absorption_sd_pp.toFixed(1)+' pp':'—')}</strong><span>12-year standard deviation</span></div>`].join('');}",
            "  function renderDenominator(f){const d=f?.denominators?.population,pc=f?.denominators?.per_capita;if(!d)return'';const periods=(d.available_periods||[]).join(', ')||'none aligned to the fiscal panel';return `<strong>Per-capita measures withheld.</strong><p>${esc(pc?.reason||d.reason||'No compatible denominator is active.')}</p><small>Population denominator policy: exact or explicitly compatible period only · interpolation: prohibited · Kenya-level inheritance: prohibited · currently available county population periods: ${esc(periods)}.</small>`;}",
            ""
          ])
          js=js.replace(anchor,helpers+anchor,1)
          old="    const fiscal=$('#ciq-fiscal');if(fiscal)fiscal.innerHTML=`<div><small>${esc(mode==='production'?metric(c,CODES.budget)?.latest?.period_label||'Latest':'FY2024/25')} budget</small><strong>${esc(formatKesMn(row.budget))}</strong></div><div><small>${esc(mode==='production'?metric(c,CODES.expenditure)?.latest?.period_label||'Latest':'FY2024/25')} expenditure</small><strong>${esc(formatKesMn(row.expenditure))}</strong></div><div><small>Overall absorption</small><strong>${esc(formatPct(row.absorption))}</strong></div><div><small>Development absorption</small><strong>${esc(formatPct(row.devAbsorption))}</strong></div>`;"
          new="    const fiscal=$('#ciq-fiscal'),fiscalInsights=$('#ciq-fiscal-insights'),fiscalHistory=$('#ciq-fiscal-history'),denominator=$('#ciq-denominator');if(mode==='production'&&row.fiscal){const latest=row.fiscal.history?.at(-1);if(fiscal)fiscal.innerHTML=`<div><small>${esc(latest?.fiscal_year||'Latest')} budget</small><strong>${esc(formatKesMn(latest?.budget?.value))}</strong></div><div><small>${esc(latest?.fiscal_year||'Latest')} expenditure</small><strong>${esc(formatKesMn(latest?.expenditure?.value))}</strong></div><div><small>Overall absorption</small><strong>${esc(formatPct(latest?.overall_absorption?.value))}</strong></div><div><small>Development absorption</small><strong>${esc(formatPct(latest?.development_absorption?.value))}</strong></div>`;if(fiscalInsights)fiscalInsights.innerHTML=renderFiscalInsights(row.fiscal);if(fiscalHistory)fiscalHistory.innerHTML=renderFiscalHistory(row);if(denominator)denominator.innerHTML=renderDenominator(row.fiscal);}else{if(fiscal)fiscal.innerHTML=`<div><small>FY2024/25 budget</small><strong>${esc(formatKesMn(row.budget))}</strong></div><div><small>FY2024/25 expenditure</small><strong>${esc(formatKesMn(row.expenditure))}</strong></div><div><small>Overall absorption</small><strong>${esc(formatPct(row.absorption))}</strong></div><div><small>Development absorption</small><strong>${esc(formatPct(row.devAbsorption))}</strong></div>`;if(fiscalInsights)fiscalInsights.innerHTML='';if(fiscalHistory)fiscalHistory.innerHTML='<div class=\"source-note\">Twelve-year fiscal history requires the canonical CountyIQ mart.</div>';if(denominator)denominator.innerHTML='<strong>Per-capita measures unavailable in fallback mode.</strong>'; }"
          assert old in js;js=js.replace(old,new,1);p.write_text(js)

          # Fiscal history styling including a true mobile card layout.
          replace('assets/countyiq-view.css','.ciq-lower{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);padding-bottom:6rem}','.ciq-lower{grid-template-columns:1fr;padding-bottom:6rem}')
          p=Path('assets/countyiq-view.css');css=p.read_text();anchor='.ciq-evidence{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}'
          assert anchor in css
          styles='\n'.join([
            ".ciq-fiscal-card{overflow:hidden}.ciq-fiscal-insights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:1rem}.ciq-fiscal-insights>div{background:var(--paper);padding:.9rem}.ciq-fiscal-insights small{display:block;color:var(--muted);font-size:.58rem;text-transform:uppercase;letter-spacing:.05em}.ciq-fiscal-insights strong{display:block;font-family:var(--serif);font-size:1.2rem;font-weight:500;margin:.25rem 0}.ciq-fiscal-insights span{font-size:.6rem;color:var(--muted)}",
            ".ciq-fiscal-history{margin-top:1.1rem;overflow-x:auto}.ciq-fiscal-chart{border:1px solid var(--line);padding:.9rem;background:#fff}.ciq-fiscal-chart svg{display:block;width:100%;height:auto;min-height:180px}.ciq-fiscal-overall,.ciq-fiscal-dev{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ciq-fiscal-overall{stroke:var(--green2)}.ciq-fiscal-dev{stroke:#9a7137}.ciq-fiscal-dot{fill:#fff;stroke-width:2}.ciq-fiscal-dot.overall{stroke:var(--green2)}.ciq-fiscal-dot.development{stroke:#9a7137}.ciq-fiscal-legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.63rem;color:var(--muted);margin-bottom:.35rem}.ciq-fiscal-legend span{display:flex;align-items:center;gap:.35rem}.ciq-fiscal-legend i{display:inline-block;width:14px;height:3px}.ciq-fiscal-legend i.overall{background:var(--green2)}.ciq-fiscal-legend i.development{background:#9a7137}.ciq-fiscal-years{display:flex;justify-content:space-between;color:var(--muted);font-size:.6rem}",
