name: P23 constituency voter readiness

on:
  push:
    branches: [main]
    paths:
      - 'data/p23/**'
      - 'data/completeness/**'
      - 'data/geography/registry/**'
      - 'scripts/p23/**'
      - '.github/workflows/p23-constituency-voter-readiness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/p23/**'
      - 'data/completeness/**'
      - 'data/geography/registry/**'
      - 'scripts/p23/**'
      - '.github/workflows/p23-constituency-voter-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate P23 constituency voter readiness
        run: node scripts/p23/validate-constituency-voter-readiness.mjs
