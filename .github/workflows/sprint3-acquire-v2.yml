name: Acquire Sprint 3 historical sources v2

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - .github/workflows/sprint3-acquire-v2.yml
      - scripts/sprint3/harden_acquisition_v2.py
      - scripts/sprint3/harden_acquisition_v3.py
      - scripts/sprint3/harden_acquisition_v4.py
      - scripts/sprint3/acquire_sources.py
      - scripts/sprint3/acquire_cob_history.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib pdfplumber
      - name: Apply acquisition hardening
        run: python scripts/sprint3/harden_acquisition_v4.py
      - name: Acquire and validate source snapshots
        run: python scripts/sprint3/acquire_sources.py
      - name: Commit source snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sprint3/acquire_sources.py scripts/sprint3/acquire_cob_history.py data/sprint3/*.csv data/sprint3/sources.json
          if git diff --cached --quiet; then
            echo "No acquisition changes."
          else
            git commit -m "data(sprint3): snapshot historical source series"
            git pull --rebase origin data-sprint-3-historical-kenya
            git push origin HEAD:data-sprint-3-historical-kenya
          fi
