name: P23 materialize Likoni and Belgut

on:
  push:
    branches:
      - watchdog/p23-materialize-likoni-belgut
    paths:
      - .github/workflows/p23-materialize-likoni-belgut.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p23-materialize-likoni-belgut
  cancel-in-progress: false

jobs:
  atomic-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@v4
        with:
          ref: watchdog/p23-materialize-likoni-belgut
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Authorize only Likoni and Belgut for explicit materialization
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          targets = {
              5: root / 'data/p23/form34b-likoni-source-verification.json',
              192: root / 'data/p23/form34b-belgut-source-verification.json',
          }
          expected = {
              5: (94764, 37643, 539),
              192: (75175, 57877, 295),
          }
          for code, path in targets.items():
              doc = json.loads(path.read_text(encoding='utf-8'))
              assert doc['verification_state'] == 'verified'
              assert doc['promotion_eligible'] is False
              assert doc['promotion_state'] == 'pending_explicit_materialization'
              fields = doc['field_evidence']
              values = tuple(fields[name]['verified_value'] for name in ('registered_voters', 'total_valid_votes', 'rejected_ballots'))
              assert values == expected[code], (code, values)
              assert all(fields[name]['verification_state'] == 'source_verified' for name in ('registered_voters', 'total_valid_votes', 'rejected_ballots'))
              doc['promotion_eligible'] = True
              doc['promotion_state'] = 'explicit_materialization_authorized'
              doc['promotion_authorization_contract'] = 'data/p23/form34b-turnout-promotion-contract.json'
              doc['promotion_authorized_by_this_file'] = False
              doc['note'] = 'This evidence establishes a source-verified row under the extraction contract. Canonical materialization is authorized only by the separate governed promotion tranche in data/p23/form34b-turnout-promotion-contract.json.'
              path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          contract_path = root / 'data/p23/form34b-turnout-promotion-contract.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          assert contract['schema_version'] == 'kda.p23.form34b-turnout-promotion.v1'
          assert contract['current_tranche']['verified_constituency_codes'] == [1, 139, 198]
          assert contract['current_tranche']['expected_p23_remaining_after_materialization'] == 287
          assert contract['current_tranche']['governed_total_slots'] == 20115
          contract['contract_id'] = 'P23-IEBC-2022-FORM34B-TURNOUT-PROMOTION-2026-09-07-T3'
          contract['as_of'] = '2026-09-07'
          contract['current_tranche'] = {
              'verified_constituencies': 5,
              'verified_geo_codes': [
                  'KEN-C001-CON001',
                  'KEN-C001-CON005',
                  'KEN-C026-CON139',
                  'KEN-C035-CON192',
                  'KEN-C036-CON198',
              ],
              'verified_constituency_codes': [1, 5, 139, 192, 198],
              'newly_authorized_constituency_codes': [5, 192],
              'expected_p23_remaining_after_materialization': 285,
              'expected_resolved_slots_after_materialization': 11099,
              'governed_total_slots': 20115,
              'materialization_state': 'explicit_materialization_authorized',
              'materialization_checks': [
                  'canonical_rebuild',
                  'exact_completeness_delta',
                  'full_validation_suite',
                  'independent_geography_audit',
              ],
          }
          contract['scale_plan']['next_step'] = 'Run the governed parallel source-row recovery and independent visual source-image review across the 284 grid-unresolved Form 34B rows; preserve Budalangi as an arithmetic-mismatch hold until its turnout semantics are independently resolved.'
          contract['scale_plan']['batch_rule'] = 'Source review may proceed in parallel, but canonical promotion remains a single deterministic reducer over independently source-verified rows; unresolved or conflicting forms remain pending rather than being force-corrected.'
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Rebuild all canonical generated data deterministically
        run: npm run build:data
      - name: Validate source-verification and materialization boundary
        run: node scripts/p23/validate-form34b-source-verifications.mjs
      - name: Validate exact P23 materialization delta
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summary = JSON.parse(fs.readFileSync('data/completeness/summary.json', 'utf8'));
          const series = JSON.parse(fs.readFileSync('data/indicators/registry/series.json', 'utf8'));
          const observations = JSON.parse(fs.readFileSync('data/indicators/registry/observations.json', 'utf8'));
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          assert(summary.total_slots === 20115, 'governed completeness denominator changed');
          assert(summary.resolved_slots === 11099, `expected resolved_slots=11099, got ${summary.resolved_slots}`);
          assert(summary.unresolved_slots === 9016, `expected unresolved_slots=9016, got ${summary.unresolved_slots}`);
          assert(summary.by_completion_phase?.P23 === 285, `expected P23 remainder=285, got ${summary.by_completion_phase?.P23}`);
          assert(summary.unknown_missing === 0, `unknown_missing changed to ${summary.unknown_missing}`);
          const expected = new Set([1, 5, 139, 192, 198].map(code => `KDA-TURNOUT-CON-${String(code).padStart(3, '0')}-2022-PRES`));
          const turnoutSeries = series.filter(s => expected.has(s.series_code));
          assert(turnoutSeries.length === 5, `expected 5 governed turnout series, got ${turnoutSeries.length}`);
          const observationById = new Map(observations.map(o => [o.observation_id, o]));
          for (const s of turnoutSeries) {
            const o = observationById.get(s.latest_observation_id);
            assert(o, `${s.series_code}: latest observation missing`);
            assert(o.source_class === 'official' && o.geographic_method === 'direct', `${s.series_code}: provenance class changed`);
            assert(String(o.source_url || '').startsWith('https://forms.iebc.or.ke/'), `${s.series_code}: source URL not official IEBC`);
          }
          console.log('P23_LIKONI_BELGUT_MATERIALIZATION_DELTA_OK verified=5 newly_materialized=2 p23_remaining=285 resolved=11099 denominator=20115');
          NODE
      - name: Run full Atlas validation suite
        run: npm test
      - name: Run independent geography audit
        run: python3 scripts/geography/audit-geometry.py .
      - name: Remove one-shot materialization workflow
        run: rm .github/workflows/p23-materialize-likoni-belgut.yml
      - name: Commit atomic materialization tranche
        run: |
          git config user.name 'kda-p23-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'P23: materialize source-verified Likoni and Belgut turnout'
          git push origin HEAD:watchdog/p23-materialize-likoni-belgut
