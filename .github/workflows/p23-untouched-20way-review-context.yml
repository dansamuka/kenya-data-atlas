name: P23 untouched 20-way fresh review context

on:
  pull_request:
    paths:
      - .github/workflows/p23-untouched-20way-review-context.yml
      - scripts/p23/fresh-review-context-untouched-row.py
      - data/p23/turnout-followup-triage.json
      - data/p23/form34b-source-index-contract.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  untouched-review-context:
    name: ${{ matrix.geo_code }} ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {geo_code: KEN-C001-CON003, name: Kisauni}
          - {geo_code: KEN-C009-CON044, name: Lafey}
          - {geo_code: KEN-C010-CON048, name: Laisamis}
          - {geo_code: KEN-C012-CON052, name: Igembe Central}
          - {geo_code: KEN-C012-CON056, name: North Imenti}
          - {geo_code: KEN-C013-CON060, name: Maara}
          - {geo_code: KEN-C014-CON064, name: Runyenjes}
          - {geo_code: KEN-C015-CON069, name: Mwingi Central}
          - {geo_code: KEN-C016-CON076, name: Yatta}
          - {geo_code: KEN-C016-CON081, name: Machakos Town}
          - {geo_code: KEN-C017-CON085, name: Kaiti}
          - {geo_code: KEN-C018-CON089, name: Kinangop}
          - {geo_code: KEN-C018-CON093, name: Ndaragwa}
          - {geo_code: KEN-C019-CON098, name: Mukurweini}
          - {geo_code: KEN-C020-CON102, name: Ndia}
          - {geo_code: KEN-C021-CON107, name: Kigumo}
          - {geo_code: KEN-C022-CON111, name: Gatundu South}
          - {geo_code: KEN-C022-CON115, name: Ruiru}
          - {geo_code: KEN-C022-CON120, name: Kikuyu}
          - {geo_code: KEN-C023-CON124, name: Turkana West}
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fresh-download and render official IEBC source
        run: >-
          python3 scripts/p23/fresh-review-context-untouched-row.py
          --geo-code '${{ matrix.geo_code }}'
          --name '${{ matrix.name }}'
          --output-dir '/tmp/${{ matrix.geo_code }}'
      - name: Enforce no-promotion manifest invariants
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          geo=os.environ['GEO']
          p=pathlib.Path('/tmp')/geo/'review-context.json'
          d=json.loads(p.read_text())
          g=d['governance']
          assert d['geo_code']==geo
          assert d['fresh_download'] is True
          assert g['no_inheritance'] is True
          assert g['no_promotion'] is True
          assert g['result_values_forbidden'] is True
          assert g['source_review_performed'] is False
          assert g['canonical_turnout_value_written'] is False
          assert g['required_render_dpi']==250
          assert d['pages'] and all(x['render_dpi']==250 for x in d['pages'])
          forbidden={'registered_voters','total_valid_votes','rejected_ballots','turnout_pct','candidate_vote_sum','verified_value','source_verified','promotion_eligible','promotion_state','explicit_materialization_authorized'}
          def walk(v):
              if isinstance(v,dict):
                  assert not (forbidden & set(v))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(d)
          print('P23_UNTOUCHED_NO_PROMOTION_OK', geo)
          PY
        env:
          GEO: ${{ matrix.geo_code }}
      - name: Upload isolated fresh review context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-untouched-${{ matrix.geo_code }}-fresh-review-context
          path: /tmp/${{ matrix.geo_code }}/
          if-no-files-found: warn
          retention-days: 2
