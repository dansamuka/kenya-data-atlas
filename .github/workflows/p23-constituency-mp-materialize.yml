name: P23 constituency MP materialization

on:
  push:
    branches:
      - watchdog/p23-constituency-mp-roster
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p23-constituency-mp-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tranche branch
        uses: actions/checkout@v4
        with:
          ref: watchdog/p23-constituency-mp-roster
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check shapely

      - name: Freeze official Parliament constituency roster
        run: node scripts/p23/prepare-constituency-mps-final.mjs

      - name: Deterministic Atlas rebuild
        run: npm run build:data

      - name: Validate MP promotion contract
        run: node scripts/p23/validate-constituency-mps.mjs

      - name: Full Atlas validation
        run: npm test

      - name: Geography audit
        run: npm run geography:audit

      - name: Commit validated materialization
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/p23-constituency-mp-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json data scripts .github/workflows/p23-constituency-mp-materialize.yml assets index.html
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "feat(p23): materialize official constituency MP roster"
          git push origin HEAD:watchdog/p23-constituency-mp-roster
