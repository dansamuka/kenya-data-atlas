name: P23 Form 34B canonical rebuild sync

on:
  push:
    branches: [watchdog/p23-form34b-materialize-kiminini-konoin]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out promotion branch
        uses: actions/checkout@v4
        with:
          ref: watchdog/p23-form34b-materialize-kiminini-konoin
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check shapely

      - name: Rebuild canonical published products
        run: npm run build:data

      - name: Assert governed P23 delta survived canonical rebuild
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s = JSON.parse(fs.readFileSync('data/completeness/summary.json', 'utf8'));
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          assert(s.total_slots === 20115, `denominator changed: ${s.total_slots}`);
          assert(s.resolved_slots === 11097, `resolved_slots=${s.resolved_slots}`);
          assert(s.unresolved_slots === 9018, `unresolved_slots=${s.unresolved_slots}`);
          assert(Number(s.by_completion_phase?.P23) === 287, `P23=${s.by_completion_phase?.P23}`);
          assert(s.unknown_missing === 0, `unknown_missing=${s.unknown_missing}`);
          console.log('P23_CANONICAL_REBUILD_DELTA_OK resolved=11097 unresolved=9018 p23=287 denominator=20115 unknown=0');
          NODE

      - name: Validate canonical outputs and provenance gates
        run: |
          node scripts/p23/validate-form34b-source-verifications.mjs
          node scripts/p23/validate-constituency-evidence-gap-closures.mjs
          node scripts/indicators/validate-registry.mjs
          node scripts/completeness/validate-slot-ledger.mjs
          node scripts/completeness/validate-local-indicator-cascade.mjs
          npm test
          python scripts/geography/audit-geometry.py .

      - name: Commit canonical rebuild drift and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p23-form34b-canonical-rebuild-sync.yml
          git add \
            data/geography/registry \
            data/geography/geometry \
            data/geography/reference \
            data/catalogue/registry \
            data/indicators/seed/derived/area-computed.json \
            data/indicators/registry \
            data/countyiq/county-summary.json \
            data/opportunities/opportunity-registry.json \
            data/completeness \
            data/distribution \
            data/release \
            data/ui/initial-pulse.json
          if git diff --cached --quiet; then
            echo 'Canonical build is already synchronized; removing workflow only.'
          fi
          git commit -m 'fix(p23): sync canonical rebuild outputs'
          git push origin HEAD:watchdog/p23-form34b-materialize-kiminini-konoin
