name: P23 cycle 1 refreshed 30-way shards15-16 new2 terminal classification

on:
  pull_request:
    paths:
      - data/p23/p23-cycle1-terminal-classification-refreshed-30way-shards15-16-new2.json
      - .github/workflows/p23-cycle1-terminal-classification-refreshed-30way-shards15-16-new2.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed terminal classifications
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/p23/p23-cycle1-terminal-classification-refreshed-30way-shards15-16-new2.json')
          d=json.loads(p.read_text())
          assert d['schema_version']=='kda.p23.cycle1-terminal-classification-batch.v1'
          assert d['source_cycle']['workflow_run_id']==34861724480
          assert d['source_cycle']['workflow_head_sha']=='7de5ee40f3f5daa32dd4dc417a06b9654a23bbe3'
          assert len(d['source_cycle']['artifacts'])==2
          g=d['governance']
          assert g['no_inheritance'] is True
          assert g['no_promotion'] is True
          assert g['required_render_dpi']==250
          assert g['promotion_authorized_by_this_file'] is False
          assert g['canonical_turnout_value_written'] is False
          assert g['verified_rows_still_require_separate_cycle2_promotion_review'] is True
          rows=d['rows']
          assert len(rows)==2
          by={r['geo_code']:r for r in rows}
          assert set(by)=={'KEN-C021-CON108','KEN-C021-CON109'}
          for r in rows:
              assert r['render_dpi']==250
              v=r['visual_transcription']; rec=r['same_row_valid_vote_reconciliation']; den=r['governed_denominator']
              assert sum(v['candidate_vote_totals_in_source_column_order'])==v['total_valid_votes']==rec['candidate_vote_sum']
              assert rec['reconciles_total_valid_votes'] is True and rec['delta']==0
              assert sum(den['ward_values'])==den['sum']
              assert den['form_registered_voters']==v['registered_voters']
              assert r['promotion_eligible'] is False
              assert r['promotion_authorized_by_this_record'] is False
              assert r['canonical_turnout_written'] is False
          m=by['KEN-C021-CON108']; md=m['governed_denominator']
          assert m['verification_state']=='denominator_mismatch'
          assert md['sum']==102383 and md['form_registered_voters']==102405 and md['delta']==22 and md['reconciles'] is False
          k=by['KEN-C021-CON109']; kd=k['governed_denominator']
          assert k['verification_state']=='verified'
          assert kd['sum']==105148 and kd['form_registered_voters']==105148 and kd['delta']==0 and kd['reconciles'] is True
          print('P23_CYCLE1_REFRESHED_30WAY_SHARDS15_16_NEW2_OK rows=2 verified=1 denominator_mismatch=1 no_promotion=true')
          PY
