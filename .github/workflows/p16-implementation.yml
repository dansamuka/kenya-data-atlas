name: P16 release hardening implementation

on:
  push:
    branches: [p16-release-hardening-20260830]
  workflow_dispatch:

permissions:
  contents: write

env:
  P16_BRANCH: p16-release-hardening-20260830

jobs:
  build-audit-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out P16 branch
        uses: actions/checkout@v4
        with:
          ref: p16-release-hardening-20260830
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply P16 release migration
        run: |
          node scripts/p16/apply-release.mjs
          node scripts/p16/advance-p15-validator.mjs

      - name: Install Node dependencies and refresh lockfile
        run: npm install

      - name: Install geometry audit dependency
        run: python -m pip install --disable-pip-version-check shapely

      - name: Rebuild all canonical products for 0.19.0
        run: npm run build:data

      - name: Validate complete Atlas including P16 static contracts
        run: npm test

      - name: Independent geometry audit
        run: npm run geography:audit

      - name: Install real-browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Prepare audit evidence
        run: mkdir -p reports/p16

      - name: Run cross-browser and accessibility gates
        run: npm run p16:browser

      - name: Run Lighthouse release budgets
        run: npm run p16:lighthouse

      - name: Run deduplicated external-link audit
        run: npm run p16:links

      - name: Remove one-shot implementation tooling
        run: |
          rm -f scripts/p16/apply-release.mjs
          rm -f scripts/p16/advance-p15-validator.mjs
          rm -f .github/workflows/p16-implementation.yml
          git diff --check

      - name: Commit validated P16 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P16: publish real-browser release hardening" || exit 0
          git push origin HEAD:p16-release-hardening-20260830
