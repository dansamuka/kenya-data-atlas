name: P16 release hardening implementation

on:
  push:
    branches: [p16-release-hardening-20260830]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-diagnostic:
    if: ${{ !contains(github.event.head_commit.message, 'P16 debug browser failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out P16 branch
        uses: actions/checkout@v4
        with:
          ref: p16-release-hardening-20260830
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply P16 release migration
        run: |
          node scripts/p16/apply-release.mjs
          node scripts/p16/advance-p15-validator.mjs

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser gate and capture exact output
        id: browser
        shell: bash
        run: |
          set +e
          npm run p16:browser 2>&1 | tee P16-BROWSER-FAILURE.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostic when browser gate fails
        if: steps.browser.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add P16-BROWSER-FAILURE.txt
          git commit -m "P16 debug browser failure"
          git push origin HEAD:p16-release-hardening-20260830
          exit 1

      - name: Browser gate passed
        if: steps.browser.outputs.exit_code == '0'
        run: echo "P16_BROWSER_DIAGNOSTIC_OK"
