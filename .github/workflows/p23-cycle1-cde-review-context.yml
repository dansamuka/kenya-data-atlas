name: P23 cycle 1 salvage C-D-E review context

on:
  pull_request:
    paths:
      - .github/workflows/p23-cycle1-cde-review-context.yml
      - data/p23/turnout-salvage-tranche-c.json
      - data/p23/turnout-salvage-tranche-d.json
      - data/p23/turnout-salvage-tranche-e.json
      - data/p23/form34b-source-index-contract.json
      - scripts/p23/fresh-download-turnout-salvage-tranche.py
      - scripts/p23/validate-turnout-salvage-fresh-download.mjs
      - scripts/p23/render-turnout-salvage-review-context.py
      - scripts/p23/validate-turnout-salvage-review-context.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-context:
    name: ${{ matrix.tranche }} fresh 250-DPI context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tranche: [salvage-c, salvage-d, salvage-e]
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fresh-download official IEBC Form 34B sources
        run: >-
          python3 scripts/p23/fresh-download-turnout-salvage-tranche.py
          --tranche data/p23/turnout-${{ matrix.tranche }}-tranche.json
          --source-index data/p23/form34b-source-index-contract.json
          --output /tmp/p23-${{ matrix.tranche }}-fresh-download.json
          --download-dir /tmp/p23-${{ matrix.tranche }}-pdfs
      - name: Revalidate fresh-download no-inheritance contract
        run: node scripts/p23/validate-turnout-salvage-fresh-download.mjs /tmp/p23-${{ matrix.tranche }}-fresh-download.json
      - name: Render every fresh official source page at exactly 250 DPI
        run: >-
          python3 scripts/p23/render-turnout-salvage-review-context.py
          --fresh-manifest /tmp/p23-${{ matrix.tranche }}-fresh-download.json
          --pdf-dir /tmp/p23-${{ matrix.tranche }}-pdfs
          --output /tmp/p23-${{ matrix.tranche }}-review-context.json
          --render-dir /tmp/p23-${{ matrix.tranche }}-review-pages
      - name: Validate review-context no-review and no-promotion contract
        run: node scripts/p23/validate-turnout-salvage-review-context.mjs /tmp/p23-${{ matrix.tranche }}-review-context.json
      - name: Upload fresh 250-DPI review-context artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-${{ matrix.tranche }}-cycle1-review-context
          path: |
            /tmp/p23-${{ matrix.tranche }}-fresh-download.json
            /tmp/p23-${{ matrix.tranche }}-review-context.json
            /tmp/p23-${{ matrix.tranche }}-pdfs/*.pdf
            /tmp/p23-${{ matrix.tranche }}-review-pages/*.png
          if-no-files-found: warn
          retention-days: 2
