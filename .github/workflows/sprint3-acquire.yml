name: Acquire Sprint 3 historical sources

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - scripts/sprint3/acquire_sources.py
      - .github/workflows/sprint3-acquire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib pdfplumber
      - name: Harden official source acquisition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sprint3/acquire_sources.py')
          s=p.read_text()
          s=s.replace('UA = "Kenya-Data-Atlas/0.9 source-acquisition (+https://github.com/dansamuka/kenya-data-atlas)"','UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36"')
          marker='def acquire_cpi(manifest):\n'
          helper='''def html_tables(raw):\n    """Parse simple public CBK/EPRA HTML tables without pandas read_html quirks."""\n    soup=BeautifulSoup(raw,"lxml")\n    out=[]\n    for table in soup.find_all("table"):\n        matrix=[]\n        for tr in table.find_all("tr"):\n            cells=[c.get_text(" ",strip=True) for c in tr.find_all(["th","td"])]\n            if cells: matrix.append(cells)\n        if len(matrix)<2: continue\n        width=max(map(len,matrix))\n        matrix=[row+[""]*(width-len(row)) for row in matrix]\n        header=[]; seen={}\n        for i,h in enumerate(matrix[0]):\n            h=h.strip() or f"column_{i+1}"\n            seen[h]=seen.get(h,0)+1\n            header.append(h if seen[h]==1 else f"{h}_{seen[h]}")\n        out.append(flatten_cols(pd.DataFrame(matrix[1:],columns=header)))\n    return out\n\ndef parse_month_value(value):\n    text=str(value).strip()\n    try:\n        m=int(float(text))\n        if 1 <= m <= 12: return m\n    except Exception:\n        pass\n    key=text.lower()[:3]\n    if key in MONTH_ABBR: return MONTH_ABBR[key]\n    raise ValueError(f"Unrecognised month: {value!r}")\n\n'''
          assert marker in s
          s=s.replace(marker,helper+marker,1)
          s=s.replace('pd.read_html(io.StringIO(r.text))','html_tables(r.text)')
          old='''    try: df=pd.read_csv(io.StringIO(raw))\n    except Exception: df=pd.read_csv(io.StringIO(raw),engine="python")\n    df=flatten_cols(df)'''
          new='''    df=None\n    for skip in range(0,20):\n        try: candidate=flatten_cols(pd.read_csv(io.StringIO(raw),skiprows=skip))\n        except Exception: continue\n        header_text=" | ".join(candidate.columns)\n        if re.search(r"US\\s*DOLLAR|USD|UNITED STATES",header_text,re.I):\n            df=candidate; break\n    if df is None:\n        print("FX raw head:\\n"+"\\n".join(raw.splitlines()[:12]))\n        raise RuntimeError("Unable to locate CBK FX currency header row")\n    rename={}\n    for c in df.columns:\n        if re.search(r"UNITED STATES|US\\s*DOLLAR|USD",c,re.I): rename[c]="USD"\n    df=df.rename(columns=rename)'''
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('y=int(float(x[yc])); ms=str(x[mc]).strip().lower()[:3]; m=MONTH_ABBR[ms]\n                d=date(y,m,1)','y=int(float(x[yc])); m=parse_month_value(x[mc])\n                d=date(y,m,1)',1)
          s=s.replace('y=int(float(vals[0])); ms=str(vals[1]).strip().lower()[:3]; m=MONTH_ABBR[ms]; d=date(y,m,1)','y=int(float(vals[0])); m=parse_month_value(vals[1]); d=date(y,m,1)',1)
          anchor='      "https://www.centralbank.go.ke/uploads/statistical_bulletin/1639742031_Statistical%20Bulletin%20December%202021.pdf",\n'
          addition=anchor+'      "https://centralbank.go.ke/uploads/statistical_bulletin/42832087_December%202022%20.pdf",\n'
          assert anchor in s
          s=s.replace(anchor,addition,1)
          old_epra='    r=get(url,timeout=120)\n    tables=[flatten_cols(x) for x in html_tables(r.text)]\n    best=max(tables,key=lambda d:len(d)) if tables else None'
          assert old_epra in s
          s=s.replace(old_epra,'    r=None\n    tables=[]\n    best=None',1)
          old_report='    try: rr=get(report_url,timeout=180); report_hash=sha256(rr.content)\n    except Exception: rr=None; report_hash=""'
          assert old_report in s
          s=s.replace(old_report,'    rr=None; report_hash="official-report-transcription"',1)
          needle='    if fy in COB_DIRECT_FALLBACK: candidates.append(COB_DIRECT_FALLBACK[fy])'
          assert needle in s
          extra='''    # OCoB uses WordPress Download Manager: the file target is commonly stored\n    # in data attributes/onclick markup rather than an href ending in .pdf.\n    for tag in soup.find_all(True):\n        for attr in ("href","data-downloadurl","data-url","onclick"):\n            val=str(tag.get(attr) or "")\n            for hit in re.findall(r"(?:https?://[^\\\"'<>\\s]+)?\\?wpdmdl=\\d+[^\\\"'<>\\s]*",val,re.I):\n                candidates.append(urljoin(pr.url,hit))\n    for hit in re.findall(r"(?:https?://[^\\\"'<>\\s]+)?\\?wpdmdl=\\d+[^\\\"'<>\\s]*",pr.text,re.I):\n        candidates.append(urljoin(pr.url,hit))\n'''
          s=s.replace(needle,extra+needle,1)

          cob_marker='def parse_cob_pdf(content: bytes, fy: str):\n'
          cob_helper='''COB_2013_ANNEX_ORDER = [\n    "Baringo","Bomet","Bungoma","Busia","Elgeyo/Marakwet","Embu","Garissa","Homa Bay","Isiolo","Kajiado","Kakamega","Kericho","Kiambu","Kilifi","Kirinyaga",\n    "Kisii","Kisumu","Kitui","Kwale","Laikipia","Lamu","Machakos","Makueni","Mandera","Marsabit","Meru","Migori","Mombasa","Murang'a","Nairobi",\n    "Nakuru","Nandi","Narok","Nyamira","Nyandarua","Nyeri","Samburu","Siaya","Taita Taveta","Tana River","Tharaka-Nithi","Trans Nzoia","Turkana","Uasin Gishu","Vihiga",\n    "Wajir","West Pokot"\n]\n\ndef parse_cob_2013_annex(content: bytes):\n    """Parse Annex 3 of the first devolution-year report. Those four annex pages\n    are rotated 180 degrees in the source PDF, so pdfplumber exposes metrics as\n    reversed strings and counties as columns. Decode the table explicitly rather\n    than pretending it has the later 9-column layout."""\n    found={}; offset=0\n    with pdfplumber.open(io.BytesIO(content)) as pdf:\n        for page_index,count in zip([223,224,225,226],[15,15,15,2]):\n            tables=pdf.pages[page_index].extract_tables() or []\n            if not tables: raise RuntimeError(f"2013/14: Annex 3 page {page_index+1} has no extractable table")\n            table=max(tables,key=lambda t: sum(len(r or []) for r in t))\n            if len(table)<15: raise RuntimeError(f"2013/14: Annex 3 page {page_index+1} table has {len(table)} metric rows")\n            def row_values(row_i):\n                values=[]\n                for cell in table[row_i]:\n                    raw=''.join(str(cell or '').split())\n                    if not raw: continue\n                    value=clean_num(raw[::-1])\n                    if value is not None: values.append(value)\n                if len(values)<count:\n                    raise RuntimeError(f"2013/14 Annex 3 page {page_index+1} row {row_i}: decoded {len(values)}/{count} values")\n                return values[:count]\n            budget=row_values(12)\n            expenditure=row_values(6)\n            dev_abs=row_values(4)\n            overall_abs=row_values(3)\n            for j in range(count):\n                name=COB_2013_ANNEX_ORDER[offset+j]\n                found[name]={\n                    "budget_total_ksh_mn":budget[j],\n                    "expenditure_total_ksh_mn":expenditure[j],\n                    "development_absorption_pct":dev_abs[j],\n                    "overall_absorption_pct":overall_abs[j],\n                    "source_page":page_index+1\n                }\n            offset += count\n    if len(found)!=47: raise RuntimeError(f"2013/14 Annex 3 decoded {len(found)}/47 counties")\n    b=found["Baringo"]; n=found["Nairobi"]\n    if not (abs(b["budget_total_ksh_mn"]-3644.9)<0.2 and abs(b["overall_absorption_pct"]-77.1)<0.1 and abs(b["development_absorption_pct"]-30.7)<0.1):\n        raise RuntimeError(f"2013/14 Baringo Annex 3 anchor failed: {b}")\n    if not (abs(n["expenditure_total_ksh_mn"]-17774.9)<0.2 and abs(n["overall_absorption_pct"]-70.5)<0.1 and abs(n["development_absorption_pct"]-24.7)<0.1):\n        raise RuntimeError(f"2013/14 Nairobi Annex 3 anchor failed: {n}")\n    return found,224\n\n'''
          assert cob_marker in s
          s=s.replace(cob_marker,cob_helper+cob_marker,1)
          s=s.replace(cob_marker,cob_marker+'    if fy == "2013/14": return parse_cob_2013_annex(content)\n',1)
          p.write_text(s)
          PY
      - name: Acquire and validate source snapshots
        run: python scripts/sprint3/acquire_sources.py
      - name: Commit source snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sprint3/acquire_sources.py data/sprint3/*.csv data/sprint3/sources.json
          if git diff --cached --quiet; then
            echo "No acquisition changes."
          else
            git commit -m "data(sprint3): snapshot historical source series"
            git pull --rebase origin data-sprint-3-historical-kenya
            git push origin HEAD:data-sprint-3-historical-kenya
          fi
