name: Acquire Sprint 3 historical sources

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - scripts/sprint3/acquire_sources.py
      - .github/workflows/sprint3-acquire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib pdfplumber
      - name: Use a standard browser user agent for public statistical pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sprint3/acquire_sources.py')
          s=p.read_text()
          start='UA = "Kenya-Data-Atlas/0.9 source-acquisition (+https://github.com/dansamuka/kenya-data-atlas)"'
          replacement='UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36"'
          assert start in s
          p.write_text(s.replace(start,replacement))
          PY
      - name: Probe CBK page response
        run: |
          python - <<'PY'
          import requests,re
          u='https://www.centralbank.go.ke/inflation-rates/'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'},timeout=30)
          print('status',r.status_code,'final',r.url,'len',len(r.text),'type',r.headers.get('content-type'))
          print('has2026', '2026' in r.text, 'tables', len(re.findall(r'<table',r.text,re.I)))
          print(r.text[:2500].replace('\n',' ')[:2500])
          PY
      - name: Acquire and validate source snapshots
        run: python scripts/sprint3/acquire_sources.py
      - name: Commit source snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sprint3/*.csv data/sprint3/sources.json
          if git diff --cached --quiet; then
            echo "No acquisition changes."
          else
            git commit -m "data(sprint3): snapshot historical source series"
            git push origin HEAD:data-sprint-3-historical-kenya
          fi
