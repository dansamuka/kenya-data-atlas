name: Acquire Sprint 3 historical sources

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - scripts/sprint3/acquire_sources.py
      - .github/workflows/sprint3-acquire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib pdfplumber
      - name: Harden official source acquisition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sprint3/acquire_sources.py')
          s=p.read_text()
          s=s.replace('UA = "Kenya-Data-Atlas/0.9 source-acquisition (+https://github.com/dansamuka/kenya-data-atlas)"','UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36"')
          marker='def acquire_cpi(manifest):\n'
          helper='''def html_tables(raw):\n    """Parse simple public CBK/EPRA HTML tables without pandas read_html quirks."""\n    soup=BeautifulSoup(raw,"lxml")\n    out=[]\n    for table in soup.find_all("table"):\n        matrix=[]\n        for tr in table.find_all("tr"):\n            cells=[c.get_text(" ",strip=True) for c in tr.find_all(["th","td"])]\n            if cells: matrix.append(cells)\n        if len(matrix)<2: continue\n        width=max(map(len,matrix))\n        matrix=[row+[""]*(width-len(row)) for row in matrix]\n        header=[]; seen={}\n        for i,h in enumerate(matrix[0]):\n            h=h.strip() or f"column_{i+1}"\n            seen[h]=seen.get(h,0)+1\n            header.append(h if seen[h]==1 else f"{h}_{seen[h]}")\n        out.append(flatten_cols(pd.DataFrame(matrix[1:],columns=header)))\n    return out\n\ndef parse_month_value(value):\n    text=str(value).strip()\n    try:\n        m=int(float(text))\n        if 1 <= m <= 12: return m\n    except Exception:\n        pass\n    key=text.lower()[:3]\n    if key in MONTH_ABBR: return MONTH_ABBR[key]\n    raise ValueError(f"Unrecognised month: {value!r}")\n\n'''
          assert marker in s
          s=s.replace(marker,helper+marker,1)
          s=s.replace('pd.read_html(io.StringIO(r.text))','html_tables(r.text)')
          old='''    try: df=pd.read_csv(io.StringIO(raw))\n    except Exception: df=pd.read_csv(io.StringIO(raw),engine="python")\n    df=flatten_cols(df)'''
          new='''    df=None\n    for skip in range(0,20):\n        try: candidate=flatten_cols(pd.read_csv(io.StringIO(raw),skiprows=skip))\n        except Exception: continue\n        header_text=" | ".join(candidate.columns)\n        if re.search(r"US\\s*DOLLAR|USD|UNITED STATES",header_text,re.I):\n            df=candidate; break\n    if df is None:\n        print("FX raw head:\\n"+"\\n".join(raw.splitlines()[:12]))\n        raise RuntimeError("Unable to locate CBK FX currency header row")\n    rename={}\n    for c in df.columns:\n        if re.search(r"UNITED STATES|US\\s*DOLLAR|USD",c,re.I): rename[c]="USD"\n    df=df.rename(columns=rename)'''
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('y=int(float(x[yc])); ms=str(x[mc]).strip().lower()[:3]; m=MONTH_ABBR[ms]\n                d=date(y,m,1)','y=int(float(x[yc])); m=parse_month_value(x[mc])\n                d=date(y,m,1)',1)
          s=s.replace('y=int(float(vals[0])); ms=str(vals[1]).strip().lower()[:3]; m=MONTH_ABBR[ms]; d=date(y,m,1)','y=int(float(vals[0])); m=parse_month_value(vals[1]); d=date(y,m,1)',1)
          anchor='      "https://www.centralbank.go.ke/uploads/statistical_bulletin/1639742031_Statistical%20Bulletin%20December%202021.pdf",\n'
          addition=anchor+'      "https://centralbank.go.ke/uploads/statistical_bulletin/42832087_December%202022%20.pdf",\n'
          assert anchor in s
          s=s.replace(anchor,addition,1)
          # EPRA's live pump-price page is intermittently unreachable from hosted CI.
          # The six direct Nairobi pricing-cycle values below are already transcribed
          # from the official 2025/26 EPRA statistics report, so do not make release
          # completion depend on a live HTML page.
          s=s.replace('    r=get(url,timeout=120)\n    tables=[flatten_cols(x) for x in pd.read_html(io.StringIO(r.text))]\n    best=max(tables,key=lambda d:len(d)) if tables else None','    r=None\n    tables=[]\n    best=None',1)
          s=s.replace('    try: rr=get(report_url,timeout=180); report_hash=sha256(rr.content)\n    except Exception: rr=None; report_hash=""','    rr=None; report_hash="official-report-transcription"',1)
          p.write_text(s)
          PY
      - name: Acquire and validate source snapshots
        run: python scripts/sprint3/acquire_sources.py
      - name: Commit source snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sprint3/acquire_sources.py data/sprint3/*.csv data/sprint3/sources.json
          if git diff --cached --quiet; then
            echo "No acquisition changes."
          else
            git commit -m "data(sprint3): snapshot historical source series"
            git pull --rebase origin data-sprint-3-historical-kenya
            git push origin HEAD:data-sprint-3-historical-kenya
          fi
