name: Acquire Sprint 3 historical sources

on:
  push:
    branches: [data-sprint-3-historical-kenya]
    paths:
      - scripts/sprint3/acquire_sources.py
      - .github/workflows/sprint3-acquire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib pdfplumber
      - name: Harden official HTML acquisition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sprint3/acquire_sources.py')
          s=p.read_text()
          s=s.replace('UA = "Kenya-Data-Atlas/0.9 source-acquisition (+https://github.com/dansamuka/kenya-data-atlas)"','UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36"')
          marker='def acquire_cpi(manifest):\n'
          helper='''def html_tables(raw):\n    """Parse the simple public CBK/EPRA HTML tables without pandas read_html quirks."""\n    soup=BeautifulSoup(raw,"lxml")\n    out=[]\n    for table in soup.find_all("table"):\n        matrix=[]\n        for tr in table.find_all("tr"):\n            cells=[c.get_text(" ",strip=True) for c in tr.find_all(["th","td"])]\n            if cells: matrix.append(cells)\n        if len(matrix)<2: continue\n        width=max(map(len,matrix))\n        matrix=[row+[""]*(width-len(row)) for row in matrix]\n        header=[]; seen={}\n        for i,h in enumerate(matrix[0]):\n            h=h.strip() or f"column_{i+1}"\n            seen[h]=seen.get(h,0)+1\n            header.append(h if seen[h]==1 else f"{h}_{seen[h]}")\n        out.append(flatten_cols(pd.DataFrame(matrix[1:],columns=header)))\n    return out\n\n'''
          assert marker in s
          s=s.replace(marker,helper+marker,1)
          s=s.replace('pd.read_html(io.StringIO(r.text))','html_tables(r.text)')
          p.write_text(s)
          PY
      - name: Acquire and validate source snapshots
        run: python scripts/sprint3/acquire_sources.py
      - name: Commit source snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sprint3/*.csv data/sprint3/sources.json
          if git diff --cached --quiet; then
            echo "No acquisition changes."
          else
            git commit -m "data(sprint3): snapshot historical source series"
            git push origin HEAD:data-sprint-3-historical-kenya
          fi
