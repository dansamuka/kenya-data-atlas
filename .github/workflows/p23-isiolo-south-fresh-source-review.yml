      - name: Validate fresh exactly-250-DPI Isiolo South arithmetic mismatch and no-promotion state
        run: node scripts/p23/validate-isiolo-south-fresh-source-review.mjs data/p23/form34b-isiolo-south-fresh-source-review.json
