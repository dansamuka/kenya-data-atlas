# every path scoped only to this workflow's own files (P38 classification: historical_one_off).
# Will not fire automatically again; preserved as a governed evidence record and kept available
# for on-demand manual re-run via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-isiolo-south-fresh-source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
